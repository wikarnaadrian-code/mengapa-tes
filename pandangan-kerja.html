let PIE_N = 0;
function pieMark(keys, size = 40) {
  const n = keys.length, R = 50, pt = ang => [50 + R * Math.cos(ang), 50 + R * Math.sin(ang)];
  const id = 'pie' + (++PIE_N);
  const slices = keys.map((k, i) => {
    const a0 = -Math.PI / 2 + (2 * Math.PI * i) / n, a1 = -Math.PI / 2 + (2 * Math.PI * (i + 1)) / n;
    const [x0, y0] = pt(a0), [x1, y1] = pt(a1), t = TEMPS[k];
    return `<clipPath id="${id}-${i}"><path d="M50 50 L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${n === 2 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z"/></clipPath>
      <g clip-path="url(#${id}-${i})"><circle cx="50" cy="50" r="50" fill="${PASTEL[k]}"/><circle cx="50" cy="50" r="34" fill="#fff"/><g transform="translate(25 25) scale(.5)">${GLYPH[k](t.color, t.deep)}</g></g>`;
  }).join('');
  const lines = keys.map((_, i) => { const [x, y] = pt(-Math.PI / 2 + (2 * Math.PI * i) / n); return `<line x1="50" y1="50" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" stroke="#fff" stroke-width="2.5"/>`; }).join('');
  return `<svg class="tmark pie" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">${slices}${lines}</svg>`;
}

const shade = (rx = 46) => `<ellipse cx="100" cy="211" rx="${rx}" ry="5" fill="#1D1D1D" opacity=".06"/>`;
function pose(d, s) {
  const head = (x, y) => `<circle cx="${x}" cy="${y}" r="23" fill="${CHEAD[d]}"/>`;
  if (d === 'S') return shade() + `<path d="${STAND}" fill="${PASTEL[d]}"/>` + limb('M86 136 C68 138 54 128 48 104', d) + limb('M114 136 C134 142 146 160 148 184', d) + head(100, 98) + crown(s);
  if (d === 'C') return shade() + `<path d="${STAND}" fill="${PASTEL[d]}"/>` + limb('M88 138 C58 140 40 162 64 182', d) + limb('M112 140 C134 144 156 142 174 136', d) + head(100, 94) + crown(s, 100, 94);
  if (d === 'M') return shade() + `<path d="M64 210 C60 168 66 140 92 132 C112 126 132 138 138 160 C141 176 140 194 140 210 Z" fill="${PASTEL[d]}"/>` + head(118, 114) + crown(s, 118, 114, 8);
  return shade(58) + limb('M88 160 C68 170 54 188 50 205', d, 12) + limb('M112 160 C132 170 146 188 150 205', d, 12)
    + `<path d="M64 204 C62 168 78 148 100 148 C122 148 138 168 136 204 Z" fill="${PASTEL[d]}"/>`
    + `<path d="M70 204 C70 194 84 192 100 196 C116 192 130 194 130 204 Z" fill="${CHEAD[d]}" opacity=".7"/>` + head(96, 124) + crown(s, 96, 124, -12);
}
function charLabel(p, s) {
  const P = TEMPS[p], key = p + (s || '');
  return s && COMBOS[key] ? `${COMBOS[key].name}: ${P.name} + ${TEMPS[s].name}` : P.name;
}
/* Badan penuh, untuk tampilan besar. s kosong = tanpa elemen kepala (hasil Quick Test). */
function charArt(p, s, size = 220) {
  let inner = pose(p, s);
  const pr = s && CPROP[p + s];
  if (pr) {
    if (pr[0] === 'under') { const i = inner.indexOf('/>') + 2; inner = inner.slice(0, i) + pr[1] + inner.slice(i); }
    else inner += pr[1];
  }
  return `<svg class="char-art" width="${size}" height="${Math.round(size * 1.1)}" viewBox="-14 -10 228 250" role="img" aria-label="${esc_(charLabel(p, s))}">${inner}</svg>`;
}
/* Setengah badan dalam lingkaran, untuk ikon kecil. */
function comboArt(p, s, size = 220) {
  const id = 'cc' + (++_cid);
  const top = p === s ? null : s;
  return `<svg class="combo-art" width="${size}" height="${size}" viewBox="28 22 144 144" role="img" aria-label="${esc_(charLabel(p, top))}"><defs><clipPath id="${id}"><circle cx="100" cy="94" r="72"/></clipPath></defs>
    <circle cx="100" cy="94" r="72" fill="${CBG[p]}"/><g clip-path="url(#${id})"><path d="${STAND}" fill="${PASTEL[p]}"/><circle cx="100" cy="98" r="23" fill="${CHEAD[p]}"/>${crown(top)}</g></svg>`;
}
const esc_ = t => String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

/* ---------------- Kartu share 1080 x 1920 (IG Story) ---------------- */
function svgToImage(svg) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
      svg.includes('xmlns') ? svg : svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"'));
  });
}

function wrap(ctx, text, maxW) {
  const words = text.split(' '); const lines = []; let line = '';
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  });
  if (line) lines.push(line);
  return lines;
}

const loadLogos = () => Promise.all([LOGO_ICON, LOGO_WORD].map(src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; })));
const SANS = '"Plus Jakarta Sans", system-ui, sans-serif';

// Kerangka kartu share gaya v2: latar abu muda, logo, subjudul, kaki dengan nama + pill mengapa.me
async function cardBase(sub) {
  const W = 1080, H = 1920, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#F0F0EE'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  const [li, lw] = await loadLogos();
  const ih = 80, iw = li.width * ih / li.height, wh = 44, ww = lw.width * wh / lw.height, lx = (W - (iw + 16 + ww)) / 2;
  ctx.drawImage(li, lx, 74, iw, ih); ctx.drawImage(lw, lx + iw + 16, 74 + (ih - wh) / 2 + 6, ww, wh);
  ctx.font = `700 26px ${SANS}`; ctx.fillStyle = '#8A8A8A'; ctx.letterSpacing = '5px';
  ctx.fillText(sub.toUpperCase(), W / 2 + 2, 210); ctx.letterSpacing = '0px';
  return { W, H, cv, ctx };
}
function cardFoot(ctx, W, who) {
  ctx.textAlign = 'center'; ctx.fillStyle = '#1D1D1D'; ctx.font = `700 34px ${SANS}`;
  ctx.fillText(who, W / 2, 1752);
  ctx.font = `800 30px ${SANS}`; const t = 'mengapa.me', tw = ctx.measureText(t).width + 72;
  ctx.fillStyle = '#1D1D1D'; roundRect(ctx, (W - tw) / 2, 1790, tw, 70, 35); ctx.fill();
  ctx.fillStyle = '#FFFFFF'; ctx.fillText(t, W / 2, 1836);
}
function cardBars(ctx, rows, top, max) {
  const x0 = 130, bw = 820;
  rows.forEach((r, i) => {
    const y = top + i * 86;
    ctx.textAlign = 'left'; ctx.fillStyle = '#1D1D1D'; ctx.font = `700 30px ${SANS}`; ctx.fillText(r.name, x0, y);
    ctx.textAlign = 'right'; ctx.font = `800 32px ${SANS}`; ctx.fillText(String(r.v), x0 + bw, y);
    ctx.fillStyle = '#F0F0EE'; roundRect(ctx, x0, y + 18, bw, 20, 10); ctx.fill();
    ctx.fillStyle = r.color; roundRect(ctx, x0, y + 18, Math.max(20, bw * r.v / max), 20, 10); ctx.fill();
  });
}

async function shareCard(result) {
  const { profile, analysis, dateLabel, mini } = result;
  const { primary: p, secondary: s, combo, scores } = analysis;
  const P = TEMPS[p], S = TEMPS[s];
  try { await document.fonts.ready; } catch (e) { /* abaikan */ }
  const { W, cv, ctx } = await cardBase(mini ? L('Quick Personality Test', 'Quick Personality Test') : L('Full Personality Test', 'Full Personality Test'));

  // kartu utama berwarna pastel dominan
  ctx.fillStyle = CBG[p]; roundRect(ctx, 60, 262, W - 120, 1000, 64); ctx.fill();
  const dual = !mini && analysis.tieType === 'dominan_seri';
  const mtop = mini && analysis.top && analysis.top.length > 1 ? analysis.top : null;
  if (mtop) {
    const n = mtop.length, sz = n === 2 ? 400 : n === 3 ? 300 : 230, gap = 16, x0 = (W - (n * sz + (n - 1) * gap)) / 2;
    for (let i = 0; i < n; i++) { const im = await svgToImage(charArt(mtop[i], null, sz)); ctx.drawImage(im, x0 + i * (sz + gap), 400 + (400 - sz) / 2, sz, sz * 1.1); }
  } else if (dual) {
    const a1 = await svgToImage(charArt(p, s, 400)), a2 = await svgToImage(charArt(s, p, 400));
    ctx.drawImage(a1, W / 2 - 420, 400, 400, 440); ctx.drawImage(a2, W / 2 + 20, 400, 400, 440);
  } else {
    const art = await svgToImage(charArt(p, mini ? null : s, 480));
    ctx.drawImage(art, (W - 480) / 2, 318, 480, 528);
  }
  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(29,29,29,.6)'; ctx.font = `700 28px ${SANS}`; ctx.letterSpacing = '5px';
  ctx.fillText(mtop ? L('TEMPERAMEN DOMINAN SERI', 'TIED PRIMARY TEMPERAMENTS') : mini ? L('TEMPERAMEN DOMINAN', 'PRIMARY TEMPERAMENT') : `${P.name.toUpperCase()} + ${S.name.toUpperCase()}`, W / 2 + 2, 930);
  ctx.letterSpacing = '0px';
  ctx.fillStyle = '#1D1D1D';
  let fs = 108; ctx.font = `800 ${fs}px ${SANS}`;
  const title = dual ? `${combo.name} & ${COMBOS[s + p].name}` : combo.name;
  while (ctx.measureText(title).width > 880 && fs > 60) { fs -= 4; ctx.font = `800 ${fs}px ${SANS}`; }
  ctx.letterSpacing = '-3px'; ctx.fillText(title, W / 2, 1040); ctx.letterSpacing = '0px';
  ctx.font = `500 38px ${SANS}`; ctx.fillStyle = '#2F2F2F';
  wrap(ctx, mtop ? (mtop.length === 4 ? L('Keempat sisi sama kuat.', 'All four sides equally strong.') : mtop.length === 3 ? L('Tiga sisi yang sama kuat.', 'Three equally strong sides.') : L('Dua sisi yang sama kuat.', 'Two equally strong sides.')) : dual ? L('Dua sisi yang sama kuat.', 'Two equally strong sides.') : combo.tagline, 820).slice(0, 3).forEach((l, i) => ctx.fillText(l, W / 2, 1110 + i * 52));

  // kartu skor
  ctx.fillStyle = '#FFFFFF'; roundRect(ctx, 60, 1290, W - 120, 400, 64); ctx.fill();
  cardBars(ctx, ORDER.map(k => ({ name: TEMPS[k].name, v: scores.t[k], color: TEMPS[k].color })), 1372, mini ? 10 : Math.max(20, ...Object.values(scores.t)));

  cardFoot(ctx, W, profile.nickname ? `${profile.nickname} · ${dateLabel}` : dateLabel);
  return new Promise(res => cv.toBlob(res, 'image/png', 0.95));
}

async function gmCard({ nickname, dateLabel, total, cat, pillars }) {
  try { await document.fonts.ready; } catch (e) { /* abaikan */ }
  const { W, cv, ctx } = await cardBase(L('Growth Mindset Test', 'Growth Mindset Test'));
  ctx.fillStyle = '#E4DCF8'; roundRect(ctx, 60, 262, W - 120, 860, 64); ctx.fill();
  const cx = 372, cy = 540, rr = 150;
  try { // tanaman sesuai skor di kanan lingkaran skor
    const im = new Image(); im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(plantSvg(total).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="312" ').replace(/ class="grow"/g, ''));
    await im.decode(); ctx.drawImage(im, 600, 360, 360, 312);
  } catch (e) { /* abaikan */ }
  ctx.lineWidth = 34; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#1D1D1D'; ctx.beginPath(); ctx.arc(cx, cy, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(.02, total / 100)); ctx.stroke();
  ctx.textAlign = 'center'; ctx.fillStyle = '#1D1D1D'; ctx.font = `800 128px ${SANS}`; ctx.letterSpacing = '-4px'; ctx.fillText(String(total), cx, cy + 42); ctx.letterSpacing = '0px';
  ctx.font = `600 30px ${SANS}`; ctx.fillStyle = 'rgba(29,29,29,.6)'; ctx.fillText(L('dari 100', 'out of 100'), cx, cy + 88);
  ctx.fillStyle = '#1D1D1D'; let fs = 96; ctx.font = `800 ${fs}px ${SANS}`;
  while (ctx.measureText(cat.name).width > 880 && fs > 56) { fs -= 4; ctx.font = `800 ${fs}px ${SANS}`; }
  ctx.letterSpacing = '-3px'; ctx.fillText(cat.name, W / 2, 872); ctx.letterSpacing = '0px';
  ctx.font = `500 38px ${SANS}`; ctx.fillStyle = '#2F2F2F';
  wrap(ctx, cat.tagline, 820).slice(0, 3).forEach((l, i) => ctx.fillText(l, W / 2, 944 + i * 52));
  ctx.fillStyle = '#FFFFFF'; roundRect(ctx, 60, 1150, W - 120, 540, 64); ctx.fill();
  cardBars(ctx, pillars, 1236, 100);
  cardFoot(ctx, W, nickname ? `${nickname} · ${dateLabel}` : dateLabel);
  return new Promise(res => cv.toBlob(res, 'image/png', 0.95));
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

   --------------------------------------------------------- */
const plantStage = total => total >= 85 ? 5 : total >= 70 ? 4 : total >= 55 ? 3 : total >= 40 ? 2 : total >= 20 ? 1 : 0;
function plantSvg(total, cls = 'plant') {
  const st = plantStage(total);
  const G = '#88A261', GL = '#A9C47F', D = '#3F5524', T = '#7A5A3A', S = '#B98B5E', SD = '#9C7048', GR = '#E3DDD2';
  const ground = `<ellipse cx="60" cy="97" rx="${st >= 4 ? 40 : 32}" ry="6.5" fill="${GR}"/>`;
  const mound = (w, h) => `<path d="M${60 - w} 97 C${60 - w * .7} ${97 - h} ${60 + w * .7} ${97 - h} ${60 + w} 97 Z" fill="${S}"/>`;
  const leaf = (x, y, dx, dy, f = G) => { // daun dari titik (x,y) ke ujung (x+dx, y+dy)
    const mx = x + dx / 2, my = y + dy / 2, nx = -dy * .45, ny = dx * .45;
    return `<path d="M${x} ${y} Q${mx + nx} ${my + ny} ${x + dx} ${y + dy} Q${mx - nx} ${my - ny} ${x} ${y}Z" fill="${f}"/>`; };
  const parts = [
    // 0: gundukan tanah, benih belum muncul
    `${ground}${mound(24, 20)}<path d="M53 87 q4 -3 7 0 q3 3 7 0" fill="none" stroke="${SD}" stroke-width="2" stroke-linecap="round"/><circle cx="48" cy="92" r="1.6" fill="${SD}"/><circle cx="71" cy="91" r="1.4" fill="${SD}"/>`,
    // 1: ujung tunas baru nongol
    `${ground}${mound(24, 18)}<g class="grow"><path d="M60 88 C60 82 60 79 62 76" fill="none" stroke="${D}" stroke-width="3" stroke-linecap="round"/>${leaf(62, 76, 8, -5, GL)}</g>`,
    // 2: tunas kecil, dua daun
    `${ground}${mound(22, 10)}<g class="grow"><path d="M60 92 V68" stroke="${D}" stroke-width="3.2" stroke-linecap="round"/>${leaf(60, 72, -16, -10)}${leaf(60, 68, 15, -12, GL)}</g>`,
    // 3: tanaman muda, beberapa daun
    `${ground}<g class="grow"><path d="M60 95 C60 80 58 64 60 50" fill="none" stroke="${D}" stroke-width="3.8" stroke-linecap="round"/>${leaf(60, 82, -18, -6, GL)}${leaf(59.5, 72, 19, -8)}${leaf(59.2, 62, -18, -10)}${leaf(60, 54, 15, -14, GL)}${leaf(60, 50, -4, -16)}</g>`,
    // 4: pohon muda, batang mulai kokoh
    `${ground}<g class="grow"><path d="M55.5 97 C57 84 58 72 58.5 58 L61.5 58 C62 72 63 84 64.5 97 Z" fill="${T}"/><path d="M59.5 74 L48 64" stroke="${T}" stroke-width="3.2" stroke-linecap="round"/><circle cx="60" cy="46" r="19" fill="${G}"/><circle cx="45" cy="56" r="11" fill="${G}"/><circle cx="75" cy="55" r="12" fill="${GL}"/><circle cx="54" cy="38" r="6" fill="${GL}" opacity=".7"/></g>`,
    // 5: pohon kuat, tajuk rimbun, berbuah
    `${ground}<g class="grow"><path d="M55 97 C57 84 57 70 58 56 L62 56 C63 70 63 84 65 97 Z" fill="${T}"/><path d="M60 70 L46 60 M60 66 L74 57" stroke="${T}" stroke-width="3.4" stroke-linecap="round"/><circle cx="60" cy="36" r="25" fill="${G}"/><circle cx="38" cy="50" r="16" fill="${G}"/><circle cx="82" cy="49" r="16" fill="${G}"/><circle cx="48" cy="26" r="11" fill="${GL}"/><circle cx="74" cy="28" r="10" fill="${GL}"/><circle cx="60" cy="54" r="12" fill="${G}"/><circle cx="50" cy="38" r="3.6" fill="#E5BE2E"/><circle cx="72" cy="44" r="3.6" fill="#BC4235"/><circle cx="62" cy="22" r="3.2" fill="#E5BE2E"/><circle cx="38" cy="52" r="3.2" fill="#BC4235"/><circle cx="84" cy="52" r="3" fill="#E5BE2E"/></g>`,
  ];
  return `<svg class="${cls}" viewBox="0 0 120 104" aria-hidden="true" data-stage="${st}">${parts[st]}</svg>`;
}

const SCREENS = { intro, profile, test, inter, calc, result };
function render() {
  $app.innerHTML = (SCREENS[st.screen] || intro)();
  (BIND[st.screen] || (() => {}))();
  window.scrollTo(0, 0);
}
function go(s, push = true) {
  st.screen = s; save();
  if (push) history.pushState({ s }, '');
  render();
}
window.addEventListener('popstate', e => {
  const s = (e.state && e.state.s) || 'intro';
  if (st.screen === 'test' && s !== 'test' && st.index > 0) {
    if (st.index === N1) { st.interSeen = false; go('inter', true); return; }
    st.index--; history.pushState({ s: 'test' }, ''); render(); return;
  }
  if (st.screen === 'inter') { st.index = N1 - 1; history.pushState({ s: 'test' }, ''); st.screen = 'test'; save(); render(); return; }
  if (s === 'test' && !st.profile.name) { go('intro', false); return; }
  if (s === 'result' && !st.result) { go('intro', false); return; }
  st.screen = s === 'calc' ? 'result' : s; save(); render();
});
const on = (act, fn) => $app.querySelectorAll(`[data-act="${act}"]`).forEach(el => el.addEventListener('click', e => fn(el, e)));
const resetAnswers = () => { st.answers = Array(N).fill(null); st.index = 0; st.interSeen = false; st.startedAt = null; };

const BIND = {
  intro() {
    on('start', () => go('profile'));
    on('resume', () => go(!st.profile.name ? 'profile' : st.index >= N1 && !st.interSeen ? 'inter' : 'test'));
    on('restart', () => { resetAnswers(); go('profile'); });
    on('lastresult', () => go('result'));
  },
  profile() {
    on('back', () => history.length > 1 ? history.back() : go('intro'));
    const f = document.getElementById('pf');
    setTimeout(() => { const n = document.getElementById('f-name'); if (n && !n.value && matchMedia('(pointer:fine)').matches) n.focus(); }, 50);
    f.addEventListener('submit', e => {
      e.preventDefault();
      const name = f.elements.name.value.trim().replace(/\s+/g, ' '), job = f.elements.job.value.trim().replace(/\s+/g, ' ');
      const err = (id, m) => { const el = document.getElementById(id); el.hidden = !m; el.textContent = m || ''; };
      err('e-name', name.length < 2 ? 'Isi nama lengkapmu dulu.' : ''); err('e-job', job.length < 2 ? 'Isi jabatanmu dulu.' : '');
      f.elements.name.classList.toggle('bad', name.length < 2); f.elements.job.classList.toggle('bad', job.length < 2);
      if (name.length < 2 || job.length < 2) return;
      st.profile = { name, job, hp: f.elements.website.value ? 1 : 0 };
      if (!st.startedAt) st.startedAt = Date.now();
      go('test');
    });
  },
  test() {
    on('prev', () => {
      if (st.index === N1) { st.interSeen = false; save(); go('inter'); return; }
      if (st.index > 0) { st.index--; save(); render(); } else go('profile');
    });
    on('skipnext', () => {
      const ni = Math.min(N - 1, st.index + 1);
      if (ni === N1 && !st.interSeen) { st.index = ni; save(); go('inter'); return; }
      st.index = ni; save(); render();
    });
    $app.querySelectorAll('.lk').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.busy) return;
      $app.querySelectorAll('.lk').forEach(x => { x.dataset.busy = 1; x.classList.toggle('sel', x === b); });
      st.answers[st.index] = Number(b.dataset.v); save();
      setTimeout(() => {
        const next = st.answers.findIndex(v => !v);
        if (next === -1) { finish(); return; }
        const ni = st.index < N - 1 && !st.answers[st.index + 1] ? st.index + 1 : next;
        st.index = ni; save();
        if (ni >= N1 && !st.interSeen) go('inter'); else render();
      }, 230);
    }));
  },
  inter() {
    on('part2', () => { st.interSeen = true; const n = st.answers.findIndex((v, k) => k >= N1 && !v); st.index = n === -1 ? N1 : n; save(); go('test'); });
    on('backp1', () => { st.index = N1 - 1; save(); go('test'); });
  },
  result() {
    on('pdf', () => window.print());
    on('again', () => { resetAnswers(); go('profile'); });
    on('share', async btn => {
      btn.disabled = true;
      try { const blob = await pkCard(st.result); await deliver(blob, 'hasil-pandangan-kerja.png'); }
      catch (e) { if (e && e.name !== 'AbortError') toast('Gagal membuat gambar. Coba lagi ya.'); }
      finally { btn.disabled = false; }
    });
  },
};

function finish() {
  const now = Date.now();
  const r = { id: makeId(), answers: [...st.answers], profile: { ...st.profile }, startedAt: st.startedAt, finishedAt: now };
  st.result = r; resetAnswers(); save();
  go('calc', false);
  submit(payload(r));
  setTimeout(() => { history.replaceState({ s: 'result' }, ''); go('result', false); }, 1300);
}
function payload(r) {
  const { p1, p2 } = split(r.answers), a = pkAnalyze(p1), o = woAnalyze(p2), d = new Date(r.finishedAt), pad = n => String(n).padStart(2, '0');
  return { hp: r.profile.hp || 0, row: {
    id: r.id, jenis_tes: 'pandangan', waktu_iso: d.toISOString(),
    tanggal_tes: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, jam_tes: `${pad(d.getHours())}:${pad(d.getMinutes())}`,
    nama: r.profile.name, jabatan: r.profile.job,
    afektif: a.avg.A, berkelanjutan: a.avg.B, normatif: a.avg.N, dominan: pkDomName(a.dominant),
    job: o.sc.J, career: o.sc.R, calling: o.sc.C, orientasi: woDomName(o.dominant),
    jawaban: r.answers.join(''), durasi_detik: r.startedAt ? Math.round((r.finishedAt - r.startedAt) / 1000) : '',
    versi_tes: 'hk-pandangan-v3', perangkat: navigator.userAgent.slice(0, 180),
  } };
}
async function post(p) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
  try {
    const res = await fetch(CONFIG.submitEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p), signal: ctl.signal, keepalive: true });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json().catch(() => ({}));
    if (j.ok === false) throw new Error(j.error || 'gagal');
  } finally { clearTimeout(t); }
}
async function submit(p) { try { await post(p); } catch (e) { const q = store.get(QKEY) || []; if (!q.some(x => x.row.id === p.row.id)) q.push(p); store.set(QKEY, q.slice(-20)); } }
async function flush() {
  const q = store.get(QKEY) || []; if (!q.length) return;
  const left = []; for (const p of q) { try { await post(p); } catch (e) { left.push(p); } }
  store.set(QKEY, left);
}

/* ---------- gambar hasil (PNG 1080×1920) ---------- */
async function pkCard(r) {
  try { await document.fonts.ready; } catch (e) { /* abaikan */ }
  const S = summarize(r), { a, o } = S;
  const { W, cv, ctx } = await cardBase('Tes Pandangan Kerja');
  // judul
  ctx.textAlign = 'center'; ctx.fillStyle = '#1D1D1D';
  let fs = 84; ctx.font = `800 ${fs}px ${SANS}`; let tl = wrap(ctx, S.headline, 940);
  while (tl.length > 2 && fs > 56) { fs -= 4; ctx.font = `800 ${fs}px ${SANS}`; tl = wrap(ctx, S.headline, 940); }
  ctx.letterSpacing = '-2px'; tl.slice(0, 2).forEach((l, i) => ctx.fillText(l, W / 2, 310 + i * (fs + 8))); ctx.letterSpacing = '0px';
  const tEnd = 310 + (Math.min(tl.length, 2) - 1) * (fs + 8);
  // dua kotak ringkas
  const bw2 = (W - 120 - 20) / 2, by = tEnd + 50;
  [['Alasan bertahan', S.kNames, a.dominant.length === 1 ? PK_DIMS[a.dominant[0]].soft : '#EFEDE8'], ['Cara memandang kerja', S.oNames, o.dominant.length === 1 ? WO_DIMS[o.dominant[0]].soft : '#EFEDE8']].forEach(([lb, nm, soft], i) => {
    const bx = 60 + i * (bw2 + 20); ctx.fillStyle = soft; roundRect(ctx, bx, by, bw2, 150, 36); ctx.fill();
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(29,29,29,.55)'; ctx.font = `700 22px ${SANS}`; ctx.letterSpacing = '2px'; ctx.fillText(lb.toUpperCase(), bx + 32, by + 50); ctx.letterSpacing = '0px';
    ctx.fillStyle = '#1D1D1D'; ctx.font = `800 40px ${SANS}`; const nt = nm.join(' + '); let f2 = 40; while (ctx.measureText(nt).width > bw2 - 64 && f2 > 26) { f2 -= 2; ctx.font = `800 ${f2}px ${SANS}`; } ctx.fillText(nt, bx + 32, by + 112);
  });
  ctx.textAlign = 'center'; ctx.font = `500 32px ${SANS}`; ctx.fillStyle = '#444';
  const lines = wrap(ctx, S.sentence, 900).slice(0, 3); lines.forEach((l, i) => ctx.fillText(l, W / 2, by + 150 + 56 + i * 44));
  // dua kotak
  const group = (y0, soft, label, rows) => {
    ctx.fillStyle = soft; roundRect(ctx, 60, y0, W - 120, 450, 52); ctx.fill();
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(29,29,29,.55)'; ctx.font = `700 24px ${SANS}`; ctx.letterSpacing = '3px';
    ctx.fillText(label.toUpperCase(), 130, y0 + 76); ctx.letterSpacing = '0px';
    const x0 = 130, bw = W - 260;
    rows.forEach((rw, i) => {
      const y = y0 + 150 + i * 110;
      ctx.globalAlpha = rw.on ? 1 : .55;
      ctx.textAlign = 'left'; ctx.fillStyle = '#1D1D1D'; ctx.font = `800 36px ${SANS}`; ctx.fillText(rw.name, x0, y);
      ctx.textAlign = 'right'; ctx.font = `800 38px ${SANS}`; ctx.fillText(rw.label, x0 + bw, y);
      ctx.fillStyle = 'rgba(255,255,255,.85)'; roundRect(ctx, x0, y + 20, bw, 28, 14); ctx.fill();
      ctx.fillStyle = rw.on ? rw.color : 'rgba(29,29,29,.28)'; roundRect(ctx, x0, y + 20, Math.max(28, bw * rw.f), 28, 14); ctx.fill();
      ctx.globalAlpha = 1;
    });
  };
  const yTop = by + 150 + 56 + lines.length * 44 + 10;
  group(yTop, a.dominant.length > 1 ? '#EFEDE8' : PK_DIMS[a.dominant[0]].soft, 'Bagian 1 · Alasan bertahan',
    PK_ORDER.map(d => ({ name: PK_DIMS[d].name, label: pkNum(a.avg[d]), f: a.avg[d] / 5, on: a.dominant.includes(d), color: PK_DIMS[d].color })));
  group(yTop + 480, o.dominant.length === 1 ? WO_DIMS[o.dominant[0]].soft : '#EFEDE8', 'Bagian 2 · Cara memandang pekerjaan',
    WO_ORDER.map(d => ({ name: WO_DIMS[d].name, label: o.pct[d] + '%', f: o.sc[d] / 3, on: o.dominant.includes(d), color: WO_DIMS[d].color })));
  cardFoot(ctx, W, `${first(r.profile.name) || 'Peserta'} · ${fmtDate(r.finishedAt)}`);
  return new Promise(res => cv.toBlob(res, 'image/png', 0.95));
}
async function deliver(blob, filename) {
  const file = new File([blob], filename, { type: 'image/png' });
  if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  const url = URL.createObjectURL(blob), link = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Gambar tersimpan.');
}

/* ---------- mulai ---------- */
if (st.screen === 'calc') st.screen = st.result ? 'result' : 'intro';
if ((st.screen === 'test' || st.screen === 'inter') && !st.profile.name) st.screen = 'intro';
if (st.screen === 'result' && !st.result) st.screen = 'intro';
if (st.screen === 'profile') st.screen = 'intro';
history.replaceState({ s: st.screen }, '');
render();
setTimeout(flush, 1500);
window.addEventListener('online', flush);
}
