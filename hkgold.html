      <div class="d-title"><h1 class="mono tk-code">${esc(t.token)}</h1><p class="tk-tags"><span class="tk-chip" style="--c:${J.c};--soft:${J.soft}">${J.name}</span><span class="tk-st" style="--c:${st.c}">${st.name}</span></p></div>
    </div>
    <div class="d-actions tk-share">
      <button class="btn ghost" data-copy="${esc(t.token)}">${L('Salin token', 'Copy token')}</button>
      <button class="btn ghost" data-copy="${esc(tkLink(t.token))}">${L('Salin link undangan', 'Copy invite link')}</button>
      <button class="btn ghost" data-copy="${esc(tkWa(t))}">${L('Salin pesan WhatsApp', 'Copy WhatsApp message')}</button>
    </div>
    <section class="box tk-use" style="--soft:${J.soft}">${use}</section>
    <section class="box"><h3>${L('Detail', 'Details')}</h3><dl class="kv">
      ${row(L('Jenis', 'Type'), J.name)}${row(L('Klien', 'Client'), esc(tkClient(t.klien)))}${row(L('Label batch', 'Batch label'), esc(t.label))}
      ${row(L('Berlaku sampai', 'Valid until'), t.berlaku ? `${tkDate(t.berlaku)} <span class="muted">· ${d < 0 ? L('sudah lewat', 'ended') : d === 0 ? L('hari ini terakhir', 'last day today') : L(`${d} hari lagi`, `${d} days left`)}</span>` : L('Tanpa batas', 'No end date'))}
      ${t.jenis === 'klien' ? row(L('Kuota', 'Quota'), t.kuota ? L(`${t.kuota} peserta`, `${t.kuota} participants`) : L('Tanpa batas', 'Unlimited')) : ''}
      ${row(L('Dibuat', 'Created'), dt(t.dibuat))}${row(L('Mulai dipakai', 'First used'), dt(t.mulai))}${row(L(t.jenis === 'personal' ? 'Selesai' : 'Terakhir dipakai', t.jenis === 'personal' ? 'Finished' : 'Last used'), dt(t.selesai))}

        : `<p class="small muted">${L('Belum ada hasil tes yang masuk dengan token ini.', 'No test results with this token yet.')}</p>`}

        <label><span>${L('Label batch', 'Batch label')}</span><input class="input" name="label" value="${esc(t.label)}" list="tklabels" maxlength="60" placeholder="${L('Contoh: Workshop Nov', 'e.g. November workshop')}"></label>

        ${off ? '' : `<button class="btn ghost sm" data-tkone="off">${L('Nonaktifkan', 'Deactivate')}</button>`}
        <button class="btn ghost sm danger" data-tkone="del">${L('Hapus token', 'Delete token')}</button>

}

/* ---------- ringkasan ---------- */
function tkSummary() {
  const all = TK.list || [], n = all.length, c = k => all.filter(t => tkStat(t) === k).length;
  const blocked = all.filter(t => ['off', 'exp', 'full'].includes(tkStat(t))).length;
  const card = (k, v, label, color) => `<button class="tk-kpi${TK.fs === k ? ' on' : ''}" data-tkfs="${k}"${color ? ` style="--c:${color}"` : ''}><b>${v}</b><span>${color ? '<i></i>' : ''}${label}${k !== 'all' && n ? ` · ${tkPct(v, n)}%` : ''}</span></button>`;
  const S2 = tkS();
  const soon = all.filter(tkSoon), stale = all.filter(tkStale), low = all.filter(tkLow);
  const alerts = [
    soon.length ? `<button data-tkfs="soon">${L(`${soon.length} token kedaluwarsa dalam 7 hari`, `${soon.length} tokens expire within 7 days`)}</button>` : '',
    stale.length ? `<button data-tkfs="stale">${L(`${stale.length} token sedang dikerjakan lebih dari sehari (mungkin peserta ganti HP)`, `${stale.length} tokens in progress for over a day (participant may have switched phone)`)}</button>` : '',
    ...low.slice(0, 3).map(t => `<button data-tk="${esc(t.token)}">${L(`Kuota ${esc(t.token)} tinggal ${t.kuota - tkUsed(t)} dari ${t.kuota}`, `${esc(t.token)} has ${t.kuota - tkUsed(t)} of ${t.kuota} quota left`)}</button>`),
  ].filter(Boolean);
  // batch per label
  const groups = {};
  all.forEach(t => { if (t.label) (groups[t.label] = groups[t.label] || []).push(t); });
  const batches = Object.entries(groups).map(([lb, ts]) => {
    let used = 0, cap = 0, open = false;
    ts.forEach(t => { if (t.jenis === 'personal') { cap += 1; used += tkStat(t) === 'done' ? 1 : 0; } else { used += tkUsed(t); if (t.kuota) cap += t.kuota; else open = true; } });
    const last = ts.map(t => t.dibuat).sort().pop() || '';
    const ends = ts.map(t => t.berlaku).filter(Boolean).sort().pop();
    return { lb, ts, used, cap: open ? 0 : cap, last, ends };
  }).sort((a, b) => String(b.last).localeCompare(String(a.last)));
  return `
    <section class="tk-kpis">
      ${card('all', n, L('Total token', 'Total tokens'))}
      ${card('ready', c('ready'), S2.ready.name, S2.ready.c)}
      ${card('busy', c('busy'), S2.busy.name, S2.busy.c)}
      ${card('done', c('done'), S2.done.name, S2.done.c)}
      ${card('blocked', blocked, L('Tidak bisa dipakai', 'Not usable'), S2.off.c)}
    </section>
    ${alerts.length ? `<div class="tk-alerts"><span>${ICON.alert || '⚠'}</span>${alerts.join('')}</div>` : ''}
    ${batches.length ? `<section class="tk-batches">${batches.map(b => `<button class="tk-batch${TK.fl === b.lb ? ' on' : ''}" data-tkfl="${esc(b.lb)}">
        <span class="tk-bh"><b>${esc(b.lb)}</b><small>${b.ts.length} token</small></span>
        <span class="tk-bn">${b.cap ? L(`${b.used} dari ${b.cap} sudah tes`, `${b.used} of ${b.cap} tested`) : L(`${b.used} sudah tes`, `${b.used} tested`)}${b.cap ? ` <em>${tkPct(b.used, b.cap)}%</em>` : ''}</span>
        ${b.cap ? `<span class="rail"><i style="width:${Math.min(100, tkPct(b.used, b.cap))}%"></i></span>` : ''}
        ${b.ends ? `<small class="tk-bend">${L('Berlaku s.d.', 'Valid until')} ${tkDate(b.ends)}</small>` : ''}
      </button>`).join('')}</section>` : ''}`;
}

/* ---------- tampilan utama ---------- */

  if (!tkAuthed()) return tkLockHtml();
  TK.hm = {};
  S.items.forEach(x => { if (x.kind === 'lengkap' && x.token) (TK.hm[x.token] = TK.hm[x.token] || []).push(x); });
  Object.values(TK.hm).forEach(a => a.sort((p, q) => q.t - p.t));
  if (!TK.list) return `${TK.err ? `<div class="banner">${esc(TK.err)}</div>` : ''}<div class="empty tk-wait">${TK.err ? `<button class="btn sm" data-tkretry>${L('Coba lagi', 'Try again')}</button>` : `<span class="spin"></span>${L('Memuat token…', 'Loading tokens…')}`}</div>`;

  const S2 = tkS();
  return `
    ${TK.err ? `<div class="banner">${esc(TK.err)}</div>` : ''}
    ${tkSummary()}
    <div class="main">
      <aside class="list-pane">
        <div class="tools">
          <div class="tk-top">
            <div class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input id="tkq" type="search" placeholder="${L('Cari token, catatan, label, peserta…', 'Search token, notes, label, participant…')}" value="${esc(TK.q)}" autocomplete="off"></div>
            <button class="btn sm tk-new" data-tknew>+ ${L('Buat token', 'New token')}</button>
          </div>

async function tkSubmitCreate(f) {

  if (m.jenis === 'klien' && m.klien === '__new') { const e = klFieldsErr(m.kb); if (e) return bad(e); }
  if (m.jenis === 'klien' && m.batasi && !(Number(m.kuota) >= 1)) return bad(L('Isi kuota minimal 1, atau pilih Tanpa batas.', 'Enter a quota of at least 1, or choose Unlimited.'));

  if (m.jenis === 'personal') { if (m.mode === 'acak') { data.jumlah = Number(m.jumlah); data.awalan = m.awalan; } else data.kode = kode; data.klien = m.klien || ''; }

}

function tkAsk(op, codes) {
  const ts = (TK.list || []).filter(t => codes.includes(t.token)), n = ts.length, one = n === 1 ? ts[0].token : '';
  const name = one ? `<b class="mono">${esc(one)}</b>` : L(`${n} token`, `${n} tokens`);
  const run = async (mode, extraMsg) => {
    tkModal(null);
    const j = mode === 'del' ? await tkCall({ op: 'delete', tokens: codes }, L(`${n} token dihapus`, `${n} tokens deleted`))
      : await tkCall({ op: 'update', mode: mode === 'on' ? 'aktif' : 'nonaktif', tokens: codes }, extraMsg);
    if (j) { if (mode === 'del') codes.forEach(c => TK.pick.delete(c)); render(); }
  };
  if (op === 'on') {
    const reset = ts.filter(t => t.jenis === 'personal' && ['busy', 'done'].includes(tkStat(t))).length;
    return tkConfirm({ title: L('Aktifkan kembali?', 'Activate again?'), msg: L(`${name} akan bisa dipakai lagi.`, `${name} will be usable again.`) + (reset ? ' ' + L(`${reset} token personal di antaranya akan direset, jadi bisa dipakai untuk satu tes baru dari awal. Hasil yang sudah masuk tetap tersimpan.`, `${reset} personal tokens among them will be reset for one new test from the start. Existing results stay saved.`) : ''),
      ok: L('Aktifkan', 'Activate'), fn: () => run('on', L(`${n} token aktif kembali`, `${n} tokens active again`)) });
  }
  if (op === 'off') return tkConfirm({ title: L('Nonaktifkan token?', 'Deactivate token?'), msg: L(`${name} tidak akan bisa dipakai lagi sampai diaktifkan kembali. Riwayat dan hasil tes tetap tersimpan.`, `${name} can't be used until activated again. History and results stay saved.`),
    ok: L('Nonaktifkan', 'Deactivate'), fn: () => run('off', L(`${n} token dinonaktifkan`, `${n} tokens deactivated`)) });
  if (op === 'del') {
    const used = ts.filter(t => tkUsed(t) > 0 || ['busy', 'done'].includes(tkStat(t))).length;
    return tkConfirm({ title: L('Hapus token?', 'Delete token?'), danger: true,
      msg: L(`${name} akan dihapus permanen dari tab Token${ts.some(t => t.klien) ? ' dan dari daftar token klien' : ''}.`, `${name} will be permanently removed from the Token tab${ts.some(t => t.klien) ? ' and from the client token list' : ''}.`)
        + (used ? ' ' + L(`<b>${used === n && n === 1 ? 'Token ini' : used + ' token'} sudah pernah dipakai.</b> Hasil tesnya tidak ikut terhapus, tapi riwayat tokennya hilang dan dashboard klien tidak lagi menampilkan hasilnya. Sebaiknya nonaktifkan saja.`, `<b>${used === n && n === 1 ? 'This token has' : used + ' tokens have'} been used.</b> Results stay, but the token history is lost and client dashboards will no longer show those results. Deactivating is safer.`) : ''),
      ok: L('Hapus', 'Delete'), extra: used ? [{ label: L('Nonaktifkan saja', 'Deactivate instead'), fn: () => run('off', L(`${n} token dinonaktifkan`, `${n} tokens deactivated`)) }] : [], fn: () => run('del') });
  }
}

  const lines = [head.map(q).join(';')].concat(rows.map(t => [t.token, tkLink(t.token), J[t.jenis] ? J[t.jenis].name : t.jenis, S2[tkStat(t)].name, tkClient(t.klien), t.label, t.jenis === 'personal' ? 1 : t.kuota || L('tanpa batas', 'unlimited'), tkUsed(t), t.berlaku, t.catatan, d(t.dibuat), d(t.selesai), (tkHist(t)[0] || {}).name || ''].map(q).join(';')));

const KL_RESERVED = ['admin', 'api', 'assets', 'klien', 'tim', 'layanan', 'teslengkap', 'tesmini', 'tesmindset', 'index', 'pandangan-kerja', 'pandangan-kerja-hasil', 'logo-klien', 'apps-script', 'robots', 'sitemap', 'favicon', 'public-workshops', 'private-workshops', 'tes', 'test', 'dashboard', 'login', 'mengapa', 'www', 'hasil', 'token', 'readme'];
const KL_WORDS = ['Kopi', 'Senja', 'Hujan', 'Bintang', 'Pagi', 'Laut', 'Bulan', 'Angin', 'Gunung', 'Pelangi', 'Embun', 'Daun', 'Awan', 'Ombak', 'Rimba', 'Teduh', 'Cahaya', 'Sungai'];
const klRand = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const klPass = () => `${KL_WORDS[klRand(KL_WORDS.length)]}-${1000 + klRand(9000)}-${KL_WORDS[klRand(KL_WORDS.length)]}`;
const klSlugify = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').split(/[^A-Za-z0-9]+/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join('').slice(0, 40);
function klSlugErr(slug, except) {
  if (!/^[A-Za-z0-9][A-Za-z0-9-]{1,38}[A-Za-z0-9]$/.test(slug)) return L('Alamat 3 sampai 40 karakter: huruf, angka, atau strip.', 'Address must be 3 to 40 characters: letters, numbers, or dashes.');
  if (KL_RESERVED.includes(slug.toLowerCase())) return L(`Alamat ${slug} tidak bisa dipakai.`, `The address ${slug} can't be used.`);
  if (TK.clients.some(c => c.klien.toLowerCase() === slug.toLowerCase() && c.klien !== except)) return L(`Alamat ${slug} sudah dipakai klien lain.`, `The address ${slug} is already taken.`);
  return '';
}
const klGet = slug => TK.clients.find(c => c.klien.toLowerCase() === String(slug || '').toLowerCase());
const klLink = slug => `${String(CONFIG.site || 'https://www.mengapa.me').replace(/\/+$/, '')}/${slug}`;
const klToks = k => (TK.list || []).filter(t => t.klien && t.klien.toLowerCase() === k.klien.toLowerCase());
const klRes = k => { const set = new Set(k.tokens || []); return S.items.filter(x => x.kind === 'lengkap' && set.has(x.token)).sort((a, b) => b.t - a.t); };
const KL_COL = ['#C25B4A', '#4F86BF', '#6F9150', '#B8892A', '#7B5EA7', '#2F8F86', '#C46A2E'];
function klLogo(k, cls = '') {
  const ini = String(k.nama || k.klien).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const col = KL_COL[[...k.klien].reduce((a, c) => a + c.charCodeAt(0), 0) % KL_COL.length];
  const badge = `<span class="kl-ini ${cls}" style="--c:${col}">${esc(ini || '?')}</span>`;
  if (k.logo) return `<img class="kl-img ${cls}" src="${esc(k.logo)}" alt="${esc(k.nama)}">`;
  if (k.klien.toLowerCase() === 'hkgold') return `<img class="kl-img ${cls}" src="/logo-klien/hkgold.png" alt="${esc(k.nama)}">`;
  return badge;
}

function klReadFields(f, m, target) {
  if (!f) return;
  const e = f.elements; if (!e.k_nama) return;
  const tn = target && target.name;
  if (tn === 'k_klien') m.slugTouched = !!e.k_klien.value.trim();
  if (tn === 'k_username') m.userTouched = !!e.k_username.value.trim();
  m.nama = e.k_nama.value;
  if (!m.slugTouched) e.k_klien.value = klSlugify(m.nama);
  m.klien = e.k_klien.value.trim();
  if (!m.userTouched) e.k_username.value = m.klien ? 'admin_' + m.klien.toLowerCase() : '';
  m.username = e.k_username.value.trim(); m.password = e.k_password.value.trim();

}
function klFieldsErr(m) {
  if (!String(m.nama || '').trim()) return L('Isi nama klien.', 'Enter the client name.');
  const e = klSlugErr(m.klien || ''); if (e) return e;
  if (!String(m.username || '').trim()) return L('Isi username.', 'Enter a username.');
  if (String(m.password || '').trim().length < 6) return L('Password minimal 6 karakter.', 'Password must be at least 6 characters.');
  return '';

/* ---------- logo: kecilkan di browser lalu upload ---------- */
function klPrepLogo(file) {
  return new Promise((resolve, reject) => {
    if (!/^image\/(png|jpeg|webp|svg\+xml)$/.test(file.type)) return reject(new Error(L('Format harus PNG, JPG, WebP, atau SVG.', 'Use PNG, JPG, WebP, or SVG.')));
    if (file.size > 8e6) return reject(new Error(L('File terlalu besar (maks 8 MB).', 'File too large (max 8 MB).')));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const W = img.naturalWidth || 600, H = img.naturalHeight || 240, s = Math.min(1, 720 / W, 288 / H, file.type === 'image/svg+xml' ? 4 : 1);
      const sc = file.type === 'image/svg+xml' ? Math.min(720 / W, 288 / H) : s;
      const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(W * sc)); cv.height = Math.max(1, Math.round(H * sc));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      let out = cv.toDataURL('image/png');
      if (out.length > 1.2e6) out = cv.toDataURL('image/webp', 0.9);
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(L('Gambar tidak bisa dibaca.', 'Could not read the image.'))); };
    img.src = url;
  });
}
async function klUpload(k, file) {
  const drop = document.getElementById('kldrop'); if (drop) drop.classList.add('busy');
  try {
    const image = await klPrepLogo(file);
    const j = await tkCall({ op: 'logo', klien: k.klien, image, old: k.logo || '' }, L('Logo tersimpan', 'Logo saved'));
    if (j) render();
  } catch (e) { toast(e.message); }
  if (drop) drop.classList.remove('busy');
}

function listHtml(items) {
  const all = items;

  if (!items.length) return `<div class="empty">${S.items.length ? L('Tidak ada hasil yang cocok dengan pencarian atau filter.', 'No results match your search or filters.') : L('Belum ada data tes.', 'No test data yet.')}</div>`;
  const today = dayKey(Date.now()), yest = dayKey(Date.now() - 864e5);
  let last = '', out = '';
  const groupOf = x => S.sort === 'type' ? x.kind : S.sort === 'date' ? dayKey(x.t) : S.sort === 'dom' ? (domOf(x)[0] || '-') : S.sort === 'name' ? (String(x.name).trim()[0] || '#').toUpperCase() : '';
  const groupLabel = (g, x) => S.sort === 'type' ? `${testName(g)} · ${all.filter(y => y.kind === g).length}` : S.sort === 'date' ? (g === today ? L('Hari ini', 'Today') : g === yest ? L('Kemarin', 'Yesterday') : fmtDate(x.t))
    : S.sort === 'dom' ? (TEMPS[g] ? `<i class="gd" style="background:${TEMPS[g].color}"></i>${TEMPS[g].name} · ${all.filter(y => domOf(y)[0] === g).length}` : L('Growth Mindset', 'Growth Mindset')) : esc(g);
  const total = items.length; items = items.slice(0, S.limit);
  items.forEach(x => {
    const dk = groupOf(x);
    if (dk && dk !== last) { out += `${last ? '</section>' : ''}<section class="grp"><div class="day">${groupLabel(dk, x)}</div>`; last = dk; }
    out += `${S.selMode ? `<div class="tk-row${S.pick.has(x.key) ? ' picked' : ''}"><label class="tk-ck"><input type="checkbox" data-rpick="${esc(x.key)}"${S.pick.has(x.key) ? ' checked' : ''}></label>` : ''}<button class="it${S.sel === x.key ? ' on' : ''}" data-key="${esc(x.key)}">
      ${avatar(x)}
      <span class="it-main"><b>${esc(x.name)}</b><small>${SLUG ? (x.age ? `${esc(x.age)} ${L('tahun', 'years')}` : '') : `${yrsShort(x.age)}<em class="kind k-${x.kind}">${kindName(x.kind)}</em>`}${x.legacy ? `<em class="old">${L('Arsip', 'Archive')}</em>` : ''}${!SLUG && x.token ? ' · ' + esc(x.token) : ''}</small></span>
      <span class="it-res"><b>${esc(x.title)}${!SLUG && x.p && x.s ? ` <span class="code2">(${ab(x.p)}${ab(x.s)})</span>` : ''}</b>${x.subHtml || `<small>${esc(x.sub)}</small>`}</span>
      <span class="it-meta">${x.trashed ? `<span class="tleft${daysLeft(x) <= 3 ? ' soon' : ''}">${L(`${daysLeft(x)} hr lagi`, `${daysLeft(x)}d left`)}</span>` : S.sort === 'date' ? fmtTime(x.t) : fmtDate(x.t)}${x.flag ? `<i class="dot ${x.flag === 'Tinggi' ? 'hi' : ''}" title="${L('Prioritas follow up', 'Follow-up priority')}: ${levelName(x.flag)}"></i>` : ''}</span>
    </button>${S.selMode ? '</div>' : ''}`;
  });
  out += last ? '</section>' : '';
  if (total > items.length) out += `<button class="more" id="more">${L(`Tampilkan ${Math.min(80, total - items.length)} lagi`, `Show ${Math.min(80, total - items.length)} more`)} <small>(${items.length}/${total})</small></button>`;
  return out;
}

function bars(rows, max) {

}

/* Median durasi pengerjaan per jenis tes. Abaikan data lama (tanpa durasi) dan sesi di atas 60 menit (ditinggal di tengah jalan). */
function medDur(B, k) {
  const v = B.filter(x => x.kind === k && !x.legacy && x.dur > 0 && x.dur <= 3600).map(x => x.dur).sort((a, b) => a - b);
  if (!v.length) return null;
  const m = v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2;
  return { v: m, n: v.length };
}
const fmtMed = s => s < 60 ? `${Math.round(s)} ${L('dtk', 's')}` : `${Math.floor(s / 60)}${L(' mnt', 'm')} ${String(Math.round(s % 60)).padStart(2, '0')}${L(' dtk', 's')}`;

function csv() {
  const rows = visible();
  if (!rows.length) { toast(L('Tidak ada data untuk diunduh', 'No data to download')); return; }
  const q = v => { const t = String(v == null ? '' : v); return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const d2 = t => { const d = new Date(t); return t ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` : ''; };
  const t2 = t => { const d = new Date(t); return t ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : ''; };
  const sc = (x, k) => x.a ? x.a.scores.t[k] : x.mini ? x.mini[k] : '';
  const head = [L('Tanggal', 'Date'), L('Jam', 'Time'), L('Jenis tes', 'Test type'), L('Nama', 'Name'), L('Usia', 'Age'), L('Hasil', 'Result'), L('Keterangan', 'Details'),
    ...ORDER.map(k => `${L('Skor', 'Score')} ${TEMPS[k].name}`), L('Skor Mindset', 'Mindset score'), L('Kode hasil', 'Result code'),
    ...(SLUG ? [] : ['WhatsApp', L('Prioritas follow up', 'Follow-up priority'), L('Tahu dari', 'Heard from'), 'Ref', 'UTM', 'Token', L('Lokasi', 'Location')]),
    L('Durasi (detik)', 'Duration (s)'), L('Sumber data', 'Data source')];
  const lines = [head.map(q).join(';')].concat(rows.map(x => [d2(x.t), t2(x.t), testName(x.kind), x.name, x.age, x.title, x.sub, ...ORDER.map(k => sc(x, k)), x.gm ? x.gm.total : '', x.id,
    ...(SLUG ? [] : [x.wa, x.flag ? levelName(x.flag) : '', x.src, x.ref, x.utm, x.token, x.place]),
    x.dur || '', x.legacy ? L('Web lama', 'Old web app') : L('Web baru', 'New web app')].map(q).join(';')));
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const n = new Date(), stamp = `${n.getFullYear()}${pad(n.getMonth() + 1)}${pad(n.getDate())}`;
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `${SLUG || 'mengapa'}-hasil-tes-${stamp}.csv` });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(L(`${rows.length} baris diunduh`, `${rows.length} rows downloaded`));
}

function toast(m) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = Object.assign(document.createElement('div'), { className: 'toast', textContent: m }); document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

  $app.querySelectorAll('[data-rpick]').forEach(c => c.addEventListener('change', () => { c.checked ? S.pick.add(c.dataset.rpick) : S.pick.delete(c.dataset.rpick); c.closest('.tk-row').classList.toggle('picked', c.checked); bindBulk(); }));
  bindBulk();
  const more = document.getElementById('more');
  if (_io) { _io.disconnect(); _io = null; }
  if (more) {
    const go = () => { S.limit += 80; renderList(); };
    more.addEventListener('click', go);
    if ('IntersectionObserver' in window) { _io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) go(); }, { rootMargin: '300px' }); _io.observe(more); }
  }
  $app.querySelectorAll('.it').forEach(b => b.addEventListener('click', () => {
    S.sel = b.dataset.key;
    $app.querySelectorAll('.it.on').forEach(x => x.classList.remove('on')); b.classList.add('on');
    const d = document.getElementById('detail'); d.innerHTML = detail(findItem(S.sel)); d.scrollTop = 0;
    document.querySelector('.shell').classList.add('has-sel'); bindCommon(d);
    if (matchMedia('(max-width: 767px)').matches) history.pushState({ d: 1 }, '');
  }));
}

function render() {
  document.title = SLUG ? `Dashboard · ${S.clientName || CLIENT}` : 'Dashboard · Mengapa';
  if (SLUG && S.found === false) {
    document.title = 'Halaman tidak ditemukan · Mengapa';
    $app.innerHTML = `<main class="login"><div class="login-card nf"><div class="login-top">${mengapaLogo}${langToggle()}</div><h1>${L('Halaman tidak ditemukan', 'Page not found')}</h1><p class="muted">${L(`Alamat mengapa.me/${esc(CLIENT)} tidak terdaftar atau sudah tidak aktif. Cek lagi link yang kamu terima.`, `The address mengapa.me/${esc(CLIENT)} isn't registered or is no longer active. Please check the link you received.`)}</p><a class="btn block" href="/">${L('Ke beranda Mengapa', 'Go to Mengapa home')}</a></div></main>`;
    bindCommon($app); return;
  }
  if (SLUG && !S.session && S.found === null && !S.clientName) {
    $app.innerHTML = `<main class="login"><div class="empty"><span class="spin"></span></div></main>`; return;
  }
  if (!S.session) {
    $app.innerHTML = login();
    bindCommon($app);
    const f = document.getElementById('lf');
    document.getElementById('eye').addEventListener('click', e => {
      const pw = document.getElementById('pw'), show = pw.type === 'password', b = e.currentTarget;
      pw.type = show ? 'text' : 'password'; b.innerHTML = EYE[show ? 1 : 0];
      b.title = b.ariaLabel = show ? L('Sembunyikan password', 'Hide password') : L('Tampilkan password', 'Show password'); pw.focus();
    });
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('lbtn'), er = document.getElementById('lerr');
      btn.disabled = true; btn.textContent = L('Memeriksa…', 'Checking…'); er.hidden = true;
      try {
        const j = await api({ action: 'login', user: f.elements.user.value, pass: f.elements.pass.value });
        S.session = j.session; session.set(j.session, j.hours || 12); S.err = ''; if (SLUG && j.nama) { S.clientName = j.nama; S.clientLogo = j.logo || ''; ls.set(SKEY + ':nama', j.nama); ls.set(SKEY + ':logo', S.clientLogo); } load();
      } catch (err) { er.hidden = false; er.textContent = err.message; btn.disabled = false; btn.textContent = L('Masuk', 'Sign in'); }
    });
    return;
  }
  const qFocused = document.activeElement && document.activeElement.id === 'q';
  if (!render.keepLimit) S.limit = 80;
  const tkFocused = document.activeElement && document.activeElement.id === 'tkq';
  $app.innerHTML = app();
  const tkv = !SLUG && (S.view === 'token' || S.view === 'klien');
  $app.querySelector('[data-act=reload]').addEventListener('click', () => { if (tkv) { load(); tkLoad(); } else load(); });
  $app.querySelector('[data-act=csv]').addEventListener('click', () => tkv ? tkCsv() : csv());
  $app.querySelector('[data-act=logout]').addEventListener('click', logout);
  $app.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    if (S.view === b.dataset.view) return;
    S.view = b.dataset.view; ls.set('mengapa:admin:view', S.view); window.scrollTo(0, 0);
    if (S.view !== 'hasil' && !TK.list && !TK.loading && tkAuthed()) tkLoad(); else render();
  }));
  if (tkv) {
    if (S.view === 'klien') klBind(); else tkBind();
    if (tkFocused) { const q = document.getElementById('tkq'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
    return;
  }
  bindCommon($app); bindList();
  $app.querySelectorAll('[data-klclear]').forEach(b => b.addEventListener('click', () => { S.kl = null; render(); }));
  $app.querySelectorAll('[data-src]').forEach(b => b.addEventListener('click', () => { S.src = b.dataset.src; if (S.src === 'old' || S.src === 'trash') S.tab = 'all'; S.sel = ''; S.pick.clear(); S.selMode = false; render(); }));
  $app.querySelectorAll('[data-trashempty]').forEach(b => b.addEventListener('click', () => trashDelete([], true)));
  if (!SLUG) tkBindModal();
  $app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { S.tab = b.dataset.tab; render(); }));
  const tog = (set, v) => { set.has(v) ? set.delete(v) : set.add(v); render(); };
  $app.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => tog(S.f, b.dataset.f)));
  $app.querySelectorAll('[data-temp]').forEach(b => b.addEventListener('click', () => tog(S.temps, b.dataset.temp)));
  $app.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => tog(S.cats, b.dataset.cat)));
  $app.querySelectorAll('[data-range]').forEach(b => b.addEventListener('click', () => { S.range = b.dataset.range; render(); }));
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on('from', 'change', e => { S.from = e.target.value; render(); });
  on('to', 'change', e => { S.to = e.target.value; render(); });
  on('sort', 'change', e => { S.sort = e.target.value; S.dir = DEFDIR[S.sort]; ls.set('mengapa:admin:sort', S.sort); ls.set('mengapa:admin:dir', S.dir); render(); });
  on('dir', 'click', () => { S.dir = -S.dir; ls.set('mengapa:admin:dir', S.dir); render(); });
  on('fbtn', 'click', () => { S.panel = !S.panel; render(); });
  on('fdone', 'click', () => { S.panel = false; render(); });
  on('freset', 'click', () => { S.temps.clear(); S.cats.clear(); S.f.clear(); S.range = 'all'; S.from = S.to = ''; render(); });
  $app.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
    const [t, v] = b.dataset.rm.split(':');
    if (t === 't') S.temps.delete(v); else if (t === 'c') S.cats.delete(v); else if (t === 'f') S.f.delete(v); else { S.range = 'all'; S.from = S.to = ''; }
    render();
  }));
  const q = document.getElementById('q');
  q.addEventListener('input', () => { S.q = q.value; S.limit = 80; renderList(); });
  if (qFocused) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

{ const q = (new URLSearchParams(location.search).get('lang') || '').toLowerCase(); setLang(q === 'en' || q === 'id' ? q : ls.get(LKEY) || 'id'); }
function closeDetail() {
  S.sel = ''; const sh = document.querySelector('.shell'); if (!sh) return;
  sh.classList.remove('has-sel'); $app.querySelectorAll('.it.on').forEach(x => x.classList.remove('on'));
  const d = document.getElementById('detail'); if (d) d.innerHTML = detail(null);
}
window.addEventListener('popstate', () => { if (S.view === 'klien' && TK.ksel) klClose(); else if (S.view === 'token' && TK.sel) tkClose(); else if (S.sel) closeDetail(); });
if (SLUG && !S.session && S.found === null) {
  api({ action: 'info' }).then(j => { S.found = true; S.clientName = j.nama || S.clientName; S.clientLogo = j.logo || ''; ls.set(SKEY + ':nama', S.clientName); ls.set(SKEY + ':logo', S.clientLogo); render(); })
    .catch(e => { S.found = e.message === 'notfound' ? false : true; render(); });
}
render();
if (S.session) { load(); if (S.view !== 'hasil' && tkAuthed()) tkLoad(); }

swipeInit($app);

</script>
</body>
</html>
