/* ===== i18n.js ===== */
/* Bahasa: Indonesia (default) dan Inggris.
   - Konten (soal, hasil, kombinasi) diganti di level data (content_en.js).
   - Teks tampilan statis diterjemahkan lewat kamus UI (ui_en.js) setelah render.
   - Teks dinamis memakai L('teks indonesia', 'english text').
   Data yang dikirim ke Google Sheet selalu dalam bahasa Indonesia. */



let LANG = 'id';
const L = (id, en) => (LANG === 'en' ? en : id);

const C = { TEMPS, COMBOS, FIELD_INSIGHTS, USE, MINI_PROFILE, GM_PILLARS, GM_CATEGORIES, GM_STEP, FUN_FACTS, FULL_BENEFITS, GM_SCALE, MINI_ROWS, GM_ITEMS, ROWS };
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function snap(target, shape) {
  if (Array.isArray(shape)) return JSON.parse(JSON.stringify(target));
  const o = {};
  Object.keys(shape).forEach(k => { o[k] = isObj(shape[k]) ? snap(target[k], shape[k]) : JSON.parse(JSON.stringify(target[k])); });
  return o;
}
function deepSet(target, src) {
  Object.keys(src).forEach(k => {
    if (isObj(src[k]) && isObj(target[k])) deepSet(target[k], src[k]);
    else target[k] = Array.isArray(src[k]) ? [...src[k]] : src[k];
  });
}
const OBJ = ['TEMPS', 'COMBOS', 'FIELD_INSIGHTS', 'USE', 'MINI_PROFILE', 'GM_PILLARS', 'GM_CATEGORIES', 'GM_STEP'];
const ARR = ['FUN_FACTS', 'FULL_BENEFITS', 'GM_SCALE'];
const ID = {};
OBJ.forEach(k => { ID[k] = snap(C[k], EN[k]); });
ARR.forEach(k => { ID[k] = [...C[k]]; });
ID.MINI = C.MINI_ROWS.map(r => ({ q: r.q, ...Object.fromEntries(r.options.map(o => [o.type, o.text])) }));
ID.GM_ITEMS = C.GM_ITEMS.map(x => x.q);

function applyContent(lang) {
  const src = lang === 'en' ? EN : ID;
  OBJ.forEach(k => deepSet(C[k], src[k]));
  ARR.forEach(k => C[k].splice(0, C[k].length, ...src[k]));
  C.MINI_ROWS.forEach((r, i) => { r.q = src.MINI[i].q; r.options.forEach(o => { o.text = src.MINI[i][o.type]; }); });
  C.GM_ITEMS.forEach((x, i) => { x.q = src.GM_ITEMS[i]; });
  C.ROWS.forEach(r => r.options.forEach(o => { o.word = lang === 'en' ? o.en : o.wid; o.hint = lang === 'en' ? o.de : o.hid; }));
}

function setLang(lang) {
  LANG = lang === 'en' ? 'en' : 'id';
  applyContent(LANG);
  document.documentElement.lang = LANG;
}
// Jalankan fn dalam bahasa tertentu (dipakai untuk data Sheet yang selalu Indonesia)
function withLang(lang, fn) {
  const prev = LANG;
  if (prev === lang) return fn();
  setLang(lang);
  try { return fn(); } finally { setLang(prev); }
}

const norm = s => s.replace(/\s+/g, ' ').trim();
function tr(s) {
  if (LANG !== 'en' || !s) return s;
  const k = norm(s);
  return UI[k] !== undefined ? UI[k] : s;
}
// Terjemahkan semua teks statis di dalam root
function translateDom(root) {
  if (LANG !== 'en') return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => (n.parentNode && /^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)) || !n.nodeValue.trim() ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const raw = n.nodeValue, k = norm(raw);
    if (UI[k] !== undefined) n.nodeValue = raw.replace(/^(\s*)[\s\S]*?(\s*)$/, `$1${UI[k]}$2`);
  });
  root.querySelectorAll('[placeholder],[aria-label],[alt],[title]').forEach(el => {
    ['placeholder', 'aria-label', 'alt', 'title'].forEach(a => { const v = el.getAttribute(a); if (v && UI[norm(v)] !== undefined) el.setAttribute(a, UI[norm(v)]); });
  });
}

/* ===== scoring.js ===== */
/* Logika skor & analisis. Tidak ada tampilan di sini, jadi gampang dites. */


function tally(answers) {
  const s = { S: 0, C: 0, M: 0, P: 0 };
  const w = { S: 0, C: 0, M: 0, P: 0 };
  answers.forEach((type, i) => {
    if (!type || !(type in s)) return;
    if (i < 20) s[type]++; else w[type]++;
  });
  const t = {};
  ORDER.forEach(k => { t[k] = s[k] + w[k]; });
  return { s, w, t };
}

// Urutan: total tertinggi, lalu kekuatan terbanyak, lalu kelemahan tersedikit, lalu urutan baku
function rank(sc) {
  return [...ORDER].sort((a, b) =>
    (sc.t[b] - sc.t[a]) || (sc.s[b] - sc.s[a]) || (sc.w[a] - sc.w[b]) || (ORDER.indexOf(a) - ORDER.indexOf(b)));
}

function analyze(answers, cfg = CONFIG) {
  const sc = tally(answers);
  const ranking = rank(sc);
  const [p, s, third] = ranking;
  const comboKey = p + s;
  const combo = COMBOS[comboKey];
  const name = k => TEMPS[k].name;

  // ---- skor seri (kasus khusus)
  // Semua pasangan dominan+sekunder yang sah menurut skor total
  const top = ORDER.filter(k => sc.t[k] === sc.t[p]);
  const pairs = [];
  top.forEach(x => {
    const rest = ORDER.filter(k => k !== x);
    const m = Math.max(...rest.map(k => sc.t[k]));
    rest.filter(k => sc.t[k] === m).forEach(y => pairs.push(x + y));
  });
  const alts = pairs.filter(k => k !== comboKey);
  const coDominant = top.length > 1 ? top : [p];
  const coSecondary = top.length === 1 ? ORDER.filter(k => k !== p && sc.t[k] === sc.t[s]) : [];
  const tieType = top.length === 4 ? 'empat_sama' : top.length === 3 ? 'tiga_teratas_sama' : top.length === 2 ? 'dominan_seri'
    : coSecondary.length === 3 ? 'tiga_terbawah_sama' : coSecondary.length === 2 ? 'sekunder_seri' : '';
  const list = arr => arr.map(name).join(', ').replace(/, ([^,]*)$/, L(' dan $1', ' and $1'));
  const ties = [];
  if (tieType === 'dominan_seri') {
    ties.push(L(`Skor ${name(p)} dan ${name(s)} sama (${sc.t[p]}). Dua sisi ini sama kuat, jadi polamu bisa terbaca sebagai ${combo.name} atau ${COMBOS[s + p].name}. `, `${name(p)} and ${name(s)} have the same score (${sc.t[p]}). Both sides are equally strong, so your pattern can be read as ${combo.name} or ${COMBOS[s + p].name}. `) +
      (sc.s[p] > sc.s[s] ? L(`${combo.name} kami tampilkan lebih dulu karena kekuatan ${name(p)} yang kamu pilih lebih banyak.`, `We show ${combo.name} first because you picked more ${name(p)} strengths.`) : L('Urutan di halaman ini hanya urutan tampil.', 'The order on this page is display order only.')));
  } else if (tieType === 'sekunder_seri') {
    ties.push(L(`Skor ${list(coSecondary)} sama (${sc.t[s]}), jadi sisi sekundermu bisa keduanya. Polamu bisa juga terbaca sebagai ${COMBOS[p + coSecondary.find(k => k !== s)].name}.`, `${list(coSecondary)} have the same score (${sc.t[s]}), so your secondary side could be either. Your pattern can also be read as ${COMBOS[p + coSecondary.find(k => k !== s)].name}.`));
  } else if (tieType === 'tiga_terbawah_sama') {
    ties.push(L(`${name(p)} jelas dominan, tapi tiga sisi lainnya punya skor sama (${sc.t[s]}). Sisi sekundermu belum menonjol, jadi ${name(s)} di sini hanya urutan tampil.`, `${name(p)} is clearly primary, but the other three sides have the same score (${sc.t[s]}). Your secondary side doesn’t stand out yet, so ${name(s)} here is display order only.`));
  } else if (tieType === 'tiga_teratas_sama') {
    ties.push(L(`${list(top)} punya skor tertinggi yang sama (${sc.t[p]}). Polamu belum mengerucut ke dua sisi, jadi kombinasi di halaman ini hanya salah satu cara membacanya.`, `${list(top)} share the same top score (${sc.t[p]}). Your pattern hasn’t narrowed to two sides yet, so the combination on this page is just one way to read it.`));
  } else if (tieType === 'empat_sama') {
    ties.push(L(`Keempat temperamen punya skor sama (${sc.t[p]}). Kamu memakai keempat sisi hampir sama rata, jadi kombinasi di halaman ini hanya salah satu cara membacanya.`, `All four temperaments have the same score (${sc.t[p]}). You use all four sides almost equally, so the combination on this page is just one way to read it.`));
  }

  // ---- insight lapangan
  const hit = ORDER.filter(k => sc.t[k] > cfg.fieldThreshold);
  const insights = hit.map(k => {
    let key = k;
    if (k === 'P' && hit.includes('S')) key = 'SP';
    else if (k === 'P' && hit.includes('C')) key = 'CP';
    return { type: k, key, score: sc.t[k], ...FIELD_INSIGHTS[key] };
  }).sort((a, b) => b.score - a.score);

  // ---- penanda pendalaman
  const flags = [];
  ORDER.forEach(k => {
    if (sc.t[k] > cfg.extremeScore) {
      flags.push({ code: 'extreme', level: 'tinggi', type: k,
        internal: L(`Skor ${name(k)} sangat tinggi (${sc.t[k]}/40)`, `Very high ${name(k)} score (${sc.t[k]}/40)`),
        user: L(`Skor ${name(k)} kamu sangat tinggi (${sc.t[k]} dari 40). Pola sekuat ini menarik untuk dibahas: apakah ini memang dirimu, atau ada sisi yang terpaksa kuat karena keadaan.`, `Your ${name(k)} score is very high (${sc.t[k]} out of 40). A pattern this strong is worth exploring: is this really you, or a side that had to become strong because of circumstances?`) });
    }
  });
  ORDER.forEach(k => {
    if (sc.w[k] - sc.s[k] >= cfg.weaknessGap) {
      const hi = sc.w[k] - sc.s[k] >= (cfg.weaknessGapHigh || 5);
      flags.push({ code: 'gap', level: hi ? 'tinggi' : 'sedang', type: k,
        internal: L(`Kelemahan lebih banyak dari kekuatan di ${name(k)}: kekuatan ${sc.s[k]}, kelemahan ${sc.w[k]} (selisih ${sc.w[k] - sc.s[k]})`, `More weaknesses than strengths in ${name(k)}: ${sc.s[k]} strengths, ${sc.w[k]} weaknesses (gap of ${sc.w[k] - sc.s[k]})`),
        user: L(`Di sisi ${name(k)}, kelemahan yang kamu pilih lebih banyak daripada kekuatannya (${sc.w[k]} banding ${sc.s[k]}). Pola seperti ini sering berkaitan dengan cara kita memandang diri sendiri atau pengalaman yang membentuk kita, dan paling enak dibahas langsung.`, `On your ${name(k)} side, you picked more weaknesses than strengths (${sc.w[k]} to ${sc.s[k]}). A pattern like this often relates to how we see ourselves or the experiences that shaped us, and is best discussed in person.`) });
    }
  });
  // Beberapa sisi dengan kelemahan > kekuatan: cukup satu kalimat untuk peserta, supaya tidak terasa menumpuk
  const gaps = flags.filter(f => f.code === 'gap');
  if (gaps.length > 1) {
    const sides = gaps.map(f => name(f.type)).join(', ').replace(/, ([^,]*)$/, L(' dan $1', ' and $1'));
    const txt = L(`Di sisi ${sides}, kelemahan yang kamu pilih lebih banyak daripada kekuatannya. Pola seperti ini sering berkaitan dengan cara kita memandang diri sendiri atau pengalaman yang membentuk kita, dan paling enak dibahas langsung.`, `On your ${sides} sides, you picked more weaknesses than strengths. A pattern like this often relates to how we see ourselves or the experiences that shaped us, and is best discussed in person.`);
    gaps.forEach(f => { f.user = txt; });
  }
  const imbalance = ORDER.reduce((a, k) => a + Math.abs(sc.s[k] - sc.w[k]), 0) / 2;
  if (imbalance >= cfg.imbalanceIndex && !flags.some(f => f.code === 'gap')) {
    flags.push({ code: 'imbalance', level: 'sedang',
      internal: L(`Indeks ketidakseimbangan K/L tinggi (${imbalance})`, `High strength/weakness imbalance index (${imbalance})`),
      user: L('Kekuatan dan kelemahan yang kamu pilih tidak tersebar seimbang di tiap temperamen. Biasanya ada cerita di balik pola seperti ini.', 'The strengths and weaknesses you picked are not evenly spread across the temperaments. There is usually a story behind a pattern like this.') });
  }
  if (combo && combo.natural === false) {
    flags.push({ code: 'opposite', level: 'sedang',
      internal: L(`Kombinasi berlawanan ${name(p)}/${name(s)} (indikasi topeng)`, `Opposite combination ${name(p)}/${name(s)} (possible mask)`),
      user: L(`${name(p)} dan ${name(s)} adalah pasangan yang berlawanan. Kadang ini tanda ada satu sisi yang terbentuk karena peran atau tuntutan lingkungan, bukan sifat bawaan.`, `${name(p)} and ${name(s)} are opposites. Sometimes this means one side was shaped by a role or by expectations around you, rather than being natural.`) });
  }
  if (sc.t[s] - sc.t[third] <= cfg.closeThird && sc.t[third] >= cfg.closeThirdMin) {
    flags.push({ code: 'triad', level: 'sedang',
      internal: L(`Tiga temperamen berdekatan (${name(p)} ${sc.t[p]}, ${name(s)} ${sc.t[s]}, ${name(third)} ${sc.t[third]})`, `Three temperaments close together (${name(p)} ${sc.t[p]}, ${name(s)} ${sc.t[s]}, ${name(third)} ${sc.t[third]})`),
      user: L(`Skor ${name(p)}, ${name(s)}, dan ${name(third)} kamu berdekatan. Pola tiga temperamen seperti ini menarik untuk dicek: mana yang bawaan, mana yang terbentuk karena peran.`, `Your ${name(p)}, ${name(s)}, and ${name(third)} scores are close together. A three-temperament pattern like this is worth checking: which is natural, and which was shaped by a role?`) });
  }
  const level = flags.some(f => f.level === 'tinggi') ? 'Tinggi' : flags.length ? 'Sedang' : '';

  // ---- kata yang dipilih
  const picks = { strengths: [], weaknesses: [] };
  answers.forEach((type, i) => {
    const opt = ROWS[i] && ROWS[i].options.find(o => o.type === type);
    if (!opt) return;
    (i < 20 ? picks.strengths : picks.weaknesses).push({ type, word: opt.word });
  });

  return { scores: sc, ranking, primary: p, secondary: s, third, comboKey, combo, ties, alts, tieType, coDominant, coSecondary, insights, flags, level, imbalance, picks };
}

/* ---------- Growth Mindset ----------
   answers: 15 angka 1-5 (urutan GM_ITEMS). Pernyataan fixed dibalik: 6 - jawaban.
   Skor pilar dan total dinormalisasi ke 0-100: (rata-rata - 1) / 4 * 100 */
function analyzeMindset(answers) {
  const pts = GM_ITEMS.map((it, i) => { const v = Number(answers[i]) || 0; return it.f ? 6 - v : v; });
  const pct = arr => Math.round(((arr.reduce((a, b) => a + b, 0) / arr.length) - 1) / 4 * 100);
  const pillars = {};
  GM_PILLAR_ORDER.forEach(k => { pillars[k] = pct(pts.filter((_, i) => GM_ITEMS[i].pillar === k)); });
  const total = pct(pts);
  const category = total >= 75 ? 'growth' : total >= 50 ? 'transition' : 'fixed';
  const level = v => v >= 75 ? 'hi' : v >= 50 ? 'mid' : 'lo';
  const sorted = [...GM_PILLAR_ORDER].sort((a, b) => pillars[b] - pillars[a]);
  const top = pillars[sorted[0]], bottom = pillars[sorted[4]];
  const strongest = top === bottom ? [] : GM_PILLAR_ORDER.filter(k => pillars[k] === top);
  const weakest = top === bottom ? [] : GM_PILLAR_ORDER.filter(k => pillars[k] === bottom);
  // Pemicu fixed: pernyataan fixed yang disetujui (4 atau 5)
  const triggers = GM_ITEMS.map((it, i) => ({ ...it, v: Number(answers[i]) })).filter(x => x.f && x.v >= 4);
  // Pola "growth di kepala, belum di reaksi"
  const reaction = Math.round(['failure', 'challenge', 'criticism', 'others'].reduce((a, k) => a + pillars[k], 0) / 4);
  const beliefGap = pillars.talent - reaction;
  const patterns = [];
  if (beliefGap >= 20) patterns.push('head');
  if (total >= 90) patterns.push('veryhigh');
  return { pillars, total, category, level, sorted, strongest, weakest, triggers, reaction, beliefGap, patterns };
}

// Ilustrasi kombinasi: simbol dominan besar + simbol sekunder mengorbit
function comboArt(p, s, size = 220, uid = 'a') {

/* ---------------- Kartu share 1080 x 1920 (IG Story) ---------------- */
function svgToImage(svg) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
      svg.includes('xmlns') ? svg : svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"'));
  });
}

function wrap(ctx, text, maxW) {
  const words = text.split(' '); const lines = []; let line = '';
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  });
  if (line) lines.push(line);
  return lines;
}

  ['S', 'C', 'M', 'P'].forEach((k, i) => {

    ctx.fillText(T.name, x0, y);

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// Mode klien: halaman klien.html (contoh mengapa.me/HKGold). Slug diambil dari alamat.
const CLIENT = document.body.dataset.client ? decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0] || '') : '';
const SLUG = CLIENT.toLowerCase();
const API = '/api/admin', SKEY = 'mengapa:admin:sesi' + (SLUG ? ':' + SLUG : ''), LKEY = 'mengapa:lang';
const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* abaikan */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* abaikan */ } },
};
const session = {
  get() { try { const v = JSON.parse(ls.get(SKEY)); return v && v.exp > Date.now() ? v.s : ''; } catch (e) { return ''; } },
  set(s, hours) { ls.set(SKEY, JSON.stringify({ s, exp: Date.now() + hours * 3600e3 })); },
  clear() { ls.del(SKEY); },
};

const S = { clientName: ls.get(SKEY + ':nama') || '', session: session.get(), rows: null, items: [], at: '', tab: 'all', q: '', f: new Set(), sel: '', loading: false, err: '',
  limit: 80, src: 'new', sort: ls.get('mengapa:admin:sort') || 'date', dir: Number(ls.get('mengapa:admin:dir')) || -1, temps: new Set(), cats: new Set(), range: 'all', from: '', to: '', panel: false };
const kindName = k => ({ lengkap: L('Lengkap', 'Full'), mini: 'Mini', mindset: 'Mindset' })[k];
const testName = k => ({ lengkap: L('Tes Karakter Lengkap', 'Full Character Test'), mini: L('Tes Karakter Mini', 'Mini Character Test'), mindset: 'Growth Mindset Test' })[k];
const levelName = v => v === 'Tinggi' ? L('Tinggi', 'High') : v === 'Sedang' ? L('Sedang', 'Medium') : v;
const MON = () => L('Jan Feb Mar Apr Mei Jun Jul Agu Sep Okt Nov Des', 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec').split(' ');
const pad = n => String(n).padStart(2, '0');
const fmtDate = t => { const d = new Date(t); return `${d.getDate()} ${MON()[d.getMonth()]} ${d.getFullYear()}`; };
const fmtTime = t => { const d = new Date(t); return LANG === 'en' ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : `${pad(d.getHours())}.${pad(d.getMinutes())}`; };
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const waNum = v => { let d = String(v || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '62' + d.slice(1); else if (d.startsWith('8')) d = '62' + d; return d; };
const waPretty = d => d ? '+' + d.replace(/^(\d{2})(\d{3})(\d{4})(\d+)$/, '$1 $2 $3 $4') : '';
const fmtDur = s => { if (!s) return ''; const m = Math.floor(s / 60), r = s % 60; return m ? `${m} ${L('menit', 'min')}${r ? ` ${r} ${L('detik', 'sec')}` : ''}` : `${s} ${L('detik', 'sec')}`; };
const ab = k => L({ S: 'S', C: 'K', M: 'M', P: 'P' }[k], k); // singkatan: ID S K M P, EN S C M P
const yrs = a => a ? `${esc(a)} ${L('tahun', 'years')}` : '';
const yrsShort = a => a ? `${esc(a)} ${L('th', 'y')} · ` : '';

/* ---------- normalisasi baris Sheet ---------- */
let _en2w = null, _en2wLang = '';
function EN2WORD() {
  if (_en2w && _en2wLang === LANG) return _en2w;
  _en2w = {}; _en2wLang = LANG;
  ROWS.forEach(row => row.options.forEach(o => { if (o.en) _en2w[o.en.toLowerCase()] = o.word; }));
  return _en2w;
}
// Skor ringkas di daftar: "S 17" per temperamen, garis bawah = porsi kekuatan (tegas) vs kelemahan (pudar)
function scoreChips(t, sMap, wMap, max) {
  const top = [...ORDER].sort((a, b) => t[b] - t[a]).slice(0, 2);
  return `<span class="scs">${ORDER.map(k => {
    const tip = sMap ? `${TEMPS[k].name}: ${t[k]} (${L('kekuatan', 'strengths')} ${sMap[k]}, ${L('kelemahan', 'weaknesses')} ${wMap[k]})` : `${TEMPS[k].name}: ${t[k]}/${max}`;
    const pct = sMap && t[k] ? Math.round(sMap[k] / t[k] * 100) : 100;
    return `<span class="sc${top.includes(k) && t[k] ? ' lead' : ''}" title="${esc(tip)}" style="--c:${TEMPS[k].color};--p:${pct}%"><b>${ab(k)}</b>${t[k]}${sMap && t[k] ? '<i></i>' : ''}</span>`;
  }).join('')}</span>`;
}
function normRow(r, kind) {
  const t = Date.parse(r.waktu_iso) || Date.parse(r.diterima_server) || Date.parse(r.tanggal_tes) || 0;
  const it = {
    kind, key: kind + ':' + r.id, id: r.id || '', name: r.nama || L('(tanpa nama)', '(no name)'), age: r.usia, dob: r.tanggal_lahir, wa: waNum(r.whatsapp),
    guardian: r.nama_wali, src: r.sumber, ref: r.ref, utm: [r.utm_source, r.utm_medium, r.utm_campaign].filter(Boolean).join(' / '),
    token: r.token || '', t, dur: Number(r.durasi_detik) || 0, tooFast: r.terlalu_cepat === 'YA', place: [r.ip_kota, r.ip_negara].filter(Boolean).join(', '),
  };
  const ans = String(r.jawaban || '');
  const T4 = { S: 'sanguinis', C: 'koleris', M: 'melankolis', P: 'plegmatis' };
  const legacy = kind === 'lengkap' && r.sumber_data === 'web lama';
  try {
    if (legacy) {
      // Web app lama: urutan jawaban tidak tersimpan, jadi skor disusun ulang dari jumlah kekuatan/kelemahan per temperamen.
      const n = (k, part) => Math.max(0, Number(r[`${T4[k]}_${part}`]) || 0);
      const syn = [...ORDER.flatMap(k => Array(n(k, 'kekuatan')).fill(k)), ...ORDER.flatMap(k => Array(n(k, 'kelemahan')).fill(k))];
      while (syn.length < 40) syn.push(ORDER[syn.length % 4]);
      const a = analyze(syn.slice(0, 40));
      ORDER.forEach(k => { a.scores.s[k] = n(k, 'kekuatan'); a.scores.w[k] = n(k, 'kelemahan'); a.scores.t[k] = n(k, 'kekuatan') + n(k, 'kelemahan'); });
      const wordOf = en => (EN2WORD()[String(en).trim().toLowerCase()] || en);
      const list = (k, part) => String(r[`${T4[k]}_sifat_${part}`] || '').split(',').map(w => w.trim()).filter(Boolean).map(w => ({ type: k, word: wordOf(w) }));
      a.picks = { strengths: ORDER.flatMap(k => list(k, 'kekuatan')), weaknesses: ORDER.flatMap(k => list(k, 'kelemahan')) };
      it.a = a; it.legacy = true;
      it.title = a.combo.name; it.sub = SLUG ? `${TEMPS[a.primary].name} + ${TEMPS[a.secondary].name}` : `${ab(a.primary)} + ${ab(a.secondary)}`; it.subHtml = SLUG ? '' : scoreChips(a.scores.t, a.scores.s, a.scores.w);
      it.p = a.primary; it.s = a.secondary; it.flag = SLUG ? '' : a.level;
    } else if (kind === 'lengkap' && /^[SCMP]{40}$/.test(ans)) {
      const a = analyze(ans.split('')); it.a = a;
      it.title = a.combo.name; it.sub = SLUG ? `${TEMPS[a.primary].name} + ${TEMPS[a.secondary].name}` : `${ab(a.primary)} + ${ab(a.secondary)}`; it.subHtml = SLUG ? '' : scoreChips(a.scores.t, a.scores.s, a.scores.w);
      it.p = a.primary; it.s = a.secondary; it.flag = SLUG ? '' : a.level;
    } else if (kind === 'mini' && /^[SCMP]{10}$/.test(ans)) {
      const c = { S: 0, C: 0, M: 0, P: 0 }; ans.split('').forEach(k => c[k]++);
      const max = Math.max(...Object.values(c)), top = ORDER.filter(k => c[k] === max);
      it.mini = c; it.top = top; it.p = top[0]; it.subHtml = SLUG ? '' : scoreChips(c, null, null, 10);
      it.title = top.map(k => TEMPS[k].name).join(' / '); it.sub = top.length > 1 ? L('Dominan seri', 'Tied primary') : L('Dominan', 'Primary');
    } else if (kind === 'mindset' && /^[1-5]{15}$/.test(ans)) {
      const a = analyzeMindset(ans.split('')); it.gm = a;
      it.title = GM_CATEGORIES[a.category].name; it.sub = `${L('Skor', 'Score')} ${a.total}/100`;
    } else { it.title = r.kombinasi || r.dominan || r.kategori || '-'; it.sub = L('Data jawaban tidak lengkap', 'Incomplete answer data'); }
  } catch (e) { it.title = '-'; it.sub = L('Gagal membaca jawaban', 'Could not read answers'); }
  it.hay = [it.name, it.id, it.wa, it.token, it.ref, it.src, it.title, it.sub, it.legacy ? 'lama legacy' : ''].join(' ').toLowerCase();
  return it;
}
function rebuild() {
  if (!S.rows) return;
  S.items = [...S.rows.hasil.map(r => normRow(r, 'lengkap')), ...S.rows.mini.map(r => normRow(r, 'mini')), ...S.rows.mindset.map(r => normRow(r, 'mindset'))]
    .filter(x => x.id).sort((a, b) => b.t - a.t);
}

/* ---------- API ---------- */
async function api(body) {
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(SLUG ? { ...body, client: SLUG } : body) });
  let j = {}; try { j = await res.json(); } catch (e) { /* abaikan */ }
  if (res.status === 401) { logout(); throw new Error(L('Sesi berakhir, silakan masuk lagi.', 'Session expired, please sign in again.')); }
  if (!j.ok) throw new Error(j.error === 'Username atau password salah' ? L(j.error, 'Wrong username or password') : (j.error || L('Gagal memuat data', 'Could not load data')));
  return j;
}
async function load() {
  S.loading = true; S.err = ''; render();
  try { const j = await api({ action: 'data', session: S.session }); S.rows = j; S.at = j.at; if (j.nama) { S.clientName = j.nama; ls.set(SKEY + ':nama', j.nama); } rebuild(); }
  catch (e) { S.err = e.message; }
  S.loading = false; render();
}
function logout() { session.clear(); S.session = ''; S.rows = null; S.items = []; S.sel = ''; render(); }

/* ---------- filter & urutan ---------- */
const FILTERS = () => SLUG ? [] : [
  { k: 'deep', label: L('Perlu follow up', 'Needs follow-up'), test: x => !!x.flag },
  { k: 'wa', label: L('Ada WhatsApp', 'Has WhatsApp'), test: x => !!x.wa },
  { k: 'minor', label: L('Di bawah 18', 'Under 18'), test: x => Number(x.age) > 0 && Number(x.age) < 18 },
];
const RANGES = () => [['all', L('Semua', 'All time')], ['today', L('Hari ini', 'Today')], ['7', L('7 hari', '7 days')], ['30', L('30 hari', '30 days')], ['month', L('Bulan ini', 'This month')], ['custom', L('Pilih tanggal', 'Custom')]];
const SORTS = () => [['date', L('Tanggal tes', 'Test date')], ['type', L('Jenis tes', 'Test type')], ['name', L('Nama', 'Name')], ['dom', L('Karakter dominan', 'Primary temperament')], ['age', L('Usia', 'Age')], ['score', L('Skor', 'Score')]];
const DEFDIR = { type: 1, date: -1, name: 1, dom: 1, age: 1, score: -1 };
const dirLabel = () => ({
  date: [L('Terlama dulu', 'Oldest first'), L('Terbaru dulu', 'Newest first')],
  type: [L('Lengkap dulu', 'Full first'), L('Mindset dulu', 'Mindset first')],
  name: [L('A ke Z', 'A to Z'), L('Z ke A', 'Z to A')],
  dom: [L('S, K, M, P', 'S, C, M, P'), L('P, M, K, S', 'P, M, C, S')],
  age: [L('Termuda dulu', 'Youngest first'), L('Tertua dulu', 'Oldest first')],
  score: [L('Terendah dulu', 'Lowest first'), L('Tertinggi dulu', 'Highest first')],
})[S.sort][S.dir === 1 ? 0 : 1];
const sod = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
function rangeBounds() {
  const now = Date.now();
  switch (S.range) {
    case 'today': return [sod(now), Infinity];
    case '7': return [sod(now - 6 * 864e5), Infinity];
    case '30': return [sod(now - 29 * 864e5), Infinity];
    case 'month': { const d = new Date(); return [new Date(d.getFullYear(), d.getMonth(), 1).getTime(), Infinity]; }
    case 'custom': return [S.from ? new Date(S.from + 'T00:00:00').getTime() : -Infinity, S.to ? new Date(S.to + 'T23:59:59').getTime() : Infinity];
    default: return [-Infinity, Infinity];
  }
}
const domOf = x => x.kind === 'mini' ? (x.top || []) : x.p ? [x.p] : [];
const scoreOf = x => x.a ? x.a.scores.t[x.p] : x.mini ? x.mini[x.p] : x.gm ? x.gm.total : -1;
function base() {
  const q = S.q.trim().toLowerCase(), F = FILTERS(), [t0, t1] = rangeBounds();
  return S.items.filter(x => (S.src === 'all' || (S.src === 'old') === !!x.legacy) && (!q || q.split(/\s+/).every(w => x.hay.includes(w)))
    && [...S.f].every(k => { const f = F.find(f => f.k === k); return !f || f.test(x); })
    && (!S.temps.size || domOf(x).some(k => S.temps.has(k)))
    && (!S.cats.size || (x.gm && S.cats.has(x.gm.category)))
    && x.t >= t0 && x.t <= t1);
}
function sorted(arr) {
  const d = S.dir, name = (a, b) => String(a.name).localeCompare(String(b.name), 'id', { sensitivity: 'base' });
  const cmp = {
    date: (a, b) => (a.t - b.t) * d,
    type: (a, b) => (KORDER.indexOf(a.kind) - KORDER.indexOf(b.kind)) * d || b.t - a.t,
    name: (a, b) => name(a, b) * d || b.t - a.t,
    age: (a, b) => ((Number(a.age) || 999) - (Number(b.age) || 999)) * d || name(a, b),
    dom: (a, b) => ((ORDER.indexOf(domOf(a)[0]) + 1 || 9) - (ORDER.indexOf(domOf(b)[0]) + 1 || 9)) * d || name(a, b),
    score: (a, b) => (scoreOf(a) - scoreOf(b)) * d || name(a, b),
  }[S.sort];
  return [...arr].sort(cmp);
}
const KORDER = ['lengkap', 'mini', 'mindset'];
const visible = () => sorted(base().filter(x => S.tab === 'all' || x.kind === S.tab));
const rangeOn = () => S.range !== 'all' && (S.range !== 'custom' || S.from || S.to);
const activeCount = () => S.temps.size + S.cats.size + S.f.size + (rangeOn() ? 1 : 0);
const srcTotal = () => S.items.filter(x => S.src === 'all' || (S.src === 'old') === !!x.legacy).length;
const countText = n => L(`${n} dari ${srcTotal()} hasil`, `${n} of ${srcTotal()} results`);

/* ---------- tampilan ---------- */
const mengapaLogo = `<span class="brand"><img src="${LOGO_ICON}" alt="" height="30"><img src="${LOGO_WORD}" alt="Mengapa" height="17"></span>`;
const clientLogo = () => `<img class="client-logo" src="/logo-klien/${encodeURIComponent(SLUG)}.png" alt="${esc(S.clientName || CLIENT)}" onerror="this.replaceWith(Object.assign(document.createElement('b'),{className:'client-name',textContent:this.alt}))">`;
const logoHtml = mengapaLogo;
const headLogo = () => SLUG ? `${clientLogo()}<span class="by">${L('bersama', 'with')} ${mengapaLogo}</span>` : mengapaLogo;
const langToggle = () => `<div class="lang" role="group" aria-label="${L('Bahasa', 'Language')}"><button data-lang="id" aria-pressed="${LANG === 'id'}">ID</button><button data-lang="en" aria-pressed="${LANG === 'en'}">EN</button></div>`;

const EYE = [
  '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6A17.4 17.4 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
];

function avatar(x, size = 44) {
  if (x.kind === 'lengkap' && x.p) return `<span class="av duo" style="background:${TEMPS[x.p].soft}">${glyph(x.p, size * .6)}<span class="sec" style="border-color:${TEMPS[x.s].color}">${glyph(x.s, 15)}</span></span>`;
  if (x.kind === 'mini' && x.p) return `<span class="av" style="background:${TEMPS[x.p].soft}">${glyph(x.p, size * .62)}</span>`;
  if (x.kind === 'mindset' && x.gm) return `<span class="av ring" style="--v:${x.gm.total}"><b>${x.gm.total}</b></span>`;
  return `<span class="av">${esc(initials(x.name))}</span>`;
}

function listHtml(items) {
  const all = items;
  if (S.loading && !S.items.length) return `<div class="empty"><span class="spin"></span>${L('Memuat data…', 'Loading data…')}</div>`;
  if (!items.length) return `<div class="empty">${S.items.length ? L('Tidak ada hasil yang cocok dengan pencarian atau filter.', 'No results match your search or filters.') : L('Belum ada data tes.', 'No test data yet.')}</div>`;
  const today = dayKey(Date.now()), yest = dayKey(Date.now() - 864e5);
  let last = '', out = '';
  const groupOf = x => S.sort === 'type' ? x.kind : S.sort === 'date' ? dayKey(x.t) : S.sort === 'dom' ? (domOf(x)[0] || '-') : S.sort === 'name' ? (String(x.name).trim()[0] || '#').toUpperCase() : '';
  const groupLabel = (g, x) => S.sort === 'type' ? `${testName(g)} · ${all.filter(y => y.kind === g).length}` : S.sort === 'date' ? (g === today ? L('Hari ini', 'Today') : g === yest ? L('Kemarin', 'Yesterday') : fmtDate(x.t))
    : S.sort === 'dom' ? (TEMPS[g] ? `<i class="gd" style="background:${TEMPS[g].color}"></i>${TEMPS[g].name} · ${all.filter(y => domOf(y)[0] === g).length}` : L('Growth Mindset', 'Growth Mindset')) : esc(g);
  const total = items.length; items = items.slice(0, S.limit);
  items.forEach(x => {
    const dk = groupOf(x);
    if (dk && dk !== last) { out += `${last ? '</section>' : ''}<section class="grp"><div class="day">${groupLabel(dk, x)}</div>`; last = dk; }
    out += `<button class="it${S.sel === x.key ? ' on' : ''}" data-key="${esc(x.key)}">
      ${avatar(x)}
      <span class="it-main"><b>${esc(x.name)}</b><small>${SLUG ? (x.age ? `${esc(x.age)} ${L('tahun', 'years')}` : '') : `${yrsShort(x.age)}<em class="kind k-${x.kind}">${kindName(x.kind)}</em>`}${x.legacy ? `<em class="old">${L('Arsip', 'Archive')}</em>` : ''}${!SLUG && x.token ? ' · ' + esc(x.token) : ''}</small></span>
      <span class="it-res"><b>${esc(x.title)}${!SLUG && x.p && x.s ? ` <span class="code2">(${ab(x.p)}${ab(x.s)})</span>` : ''}</b>${x.subHtml || `<small>${esc(x.sub)}</small>`}</span>
      <span class="it-meta">${S.sort === 'date' ? fmtTime(x.t) : fmtDate(x.t)}${x.flag ? `<i class="dot ${x.flag === 'Tinggi' ? 'hi' : ''}" title="${L('Prioritas follow up', 'Follow-up priority')}: ${levelName(x.flag)}"></i>` : ''}</span>
    </button>`;
  });
  out += last ? '</section>' : '';
  if (total > items.length) out += `<button class="more" id="more">${L(`Tampilkan ${Math.min(80, total - items.length)} lagi`, `Show ${Math.min(80, total - items.length)} more`)} <small>(${items.length}/${total})</small></button>`;
  return out;
}

function bars(rows, max) {
  return rows.map(r => `<div class="bar"><span>${esc(r.label)}</span><div class="rail"><i style="width:${Math.max(2, r.v / max * 100)}%;background:${r.color}"></i></div><b>${r.v}</b></div>`).join('');
}

const FLAG_BASIS = () => ({
  extreme: L('Skor satu temperamen di atas 20 dari 40. Dari pengalaman lapangan Mengapa, skor sekuat ini sering terkait sisi yang "terpaksa" kuat karena keadaan atau pengalaman tertentu, termasuk kemungkinan trauma.', 'One temperament scores above 20 of 40. In Mengapa field experience, a score this strong often relates to a side that had to become strong because of circumstances, including possible trauma.'),

  imbalance: L('Kekuatan dan kelemahan tersebar tidak seimbang di keempat temperamen (indeks ketidakseimbangan 8 atau lebih).', 'Strengths and weaknesses are unevenly spread across the four temperaments (imbalance index 8 or more).'),
  opposite: L('Dominan dan sekunder adalah pasangan berlawanan (Sanguinis-Melankolis atau Koleris-Plegmatis). Menurut Florence Littauer, kombinasi ini jarang alami dan sering menandakan "topeng": satu sisi terbentuk karena peran atau tuntutan lingkungan.', 'Primary and secondary are opposites (Sanguine-Melancholy or Choleric-Phlegmatic). According to Florence Littauer, this combination is rarely natural and often signals a "mask": one side shaped by a role or expectations.'),
  triad: L('Tiga temperamen skornya berdekatan (selisih 2 atau kurang, skor 9 ke atas). Menurut konsep topeng Littauer, ini layak dicek: mana yang bawaan, mana yang terbentuk karena peran.', 'Three temperaments score close together (within 2, at 9 or above). Based on Littauer\'s mask concept, this is worth checking: which is natural and which was shaped by a role.'),
});
function shownToParticipant(x) {
  const tag = t => `<p class="seen-tag">${t}</p>`;
  if (x.kind === 'lengkap' && x.a) {
    const a = x.a, sc = a.scores, maxT = Math.max(...ORDER.map(k => sc.t[k])), minT = Math.min(...ORDER.map(k => sc.t[k]));
    const comfort = ORDER.filter(k => sc.t[k] === maxT && maxT !== minT), grow = ORDER.filter(k => sc.t[k] === minT && maxT !== minT);
    return `<section class="box seen"><h3>${L('Yang dilihat peserta', 'What the participant saw')}</h3>
      ${tag(L('Penjelasan kombinasi', 'Combination explanation'))}<p><b>${esc(a.combo.name)}</b>. ${esc(a.combo.tagline)} ${esc(a.combo.about)}</p>
      ${comfort.length ? `${tag(L('Cara membaca hasil', 'How to read the result'))}<p>${L('Karakter dominan', 'Primary trait')}: <b>${comfort.map(k => TEMPS[k].name).join(', ')}</b> · ${L('Ruang tumbuh terbesar', 'Biggest growth area')}: <b>${grow.map(k => TEMPS[k].name).join(', ')}</b></p>` : ''}
      ${a.insights.length ? `${tag(L('Insight tambahan', 'More insights'))}<ul>${a.insights.map(i => `<li><b>${esc(i.title)}.</b> ${esc(i.text)}</li>`).join('')}</ul>` : ''}
      ${a.ties.length ? `${tag(L('Catatan skor seri', 'Tie note'))}${a.ties.map(t => `<p>${esc(t)}</p>`).join('')}` : ''}
      ${a.flags.length ? `${tag(L('Kartu "Ada pola menarik di hasilmu"', '"There is an interesting pattern" card'))}<ul>${[...new Set(a.flags.map(f => f.user))].map(t => `<li>${esc(t)}</li>`).join('')}</ul><p class="muted small">${L('Diarahkan ke konsultasi via Instagram atau WhatsApp.', 'Directed to a consultation via Instagram or WhatsApp.')}</p>`
        : `${tag(L('Ajakan penutup', 'Closing invitation'))}<p class="muted small">${L('Kartu "Siap keluar dari jebakan karakter?" dengan ajakan konsultasi via Instagram atau WhatsApp.', '"Ready to break out of the character trap?" card with a consultation invite via Instagram or WhatsApp.')}</p>`}
    </section>`;
  }
  if (x.kind === 'mini' && x.mini) {
    const pr = MINI_PROFILE[x.p];
    return `<section class="box seen"><h3>${L('Yang dilihat peserta', 'What the participant saw')}</h3>
      ${tag(L('Temperamen dominan', 'Primary temperament'))}<p><b>${esc(TEMPS[x.p].name)}</b>. ${esc(TEMPS[x.p].essence)}</p>
      ${tag(L('Kekuatan dan yang perlu diwaspadai', 'Strengths and watch-outs'))}<ul>${pr.powers.map(t => `<li>${esc(t)}</li>`).join('')}${pr.watch.map(t => `<li class="neg">${esc(t)}</li>`).join('')}</ul>
      <p class="muted small">${L('Diajak mengambil Tes Karakter Lengkap via Instagram atau WhatsApp.', 'Invited to take the Full Character Test via Instagram or WhatsApp.')}</p>
    </section>`;
  }
  if (x.kind === 'mindset' && x.gm) {
    const a = x.gm, focus = a.weakest.length ? a.weakest : [a.sorted[4]];
    return `<section class="box seen"><h3>${L('Yang dilihat peserta', 'What the participant saw')}</h3>
      ${tag(L('Penjelasan kategori', 'Category explanation'))}<p>${esc(GM_CATEGORIES[a.category].about)}</p>
      ${tag(L('Penjelasan per pilar', 'Per-pillar explanation'))}<ul>${GM_PILLAR_ORDER.map(k => `<li><b>${esc(GM_PILLARS[k].name)} (${a.pillars[k]}).</b> ${esc(GM_PILLARS[k][a.level(a.pillars[k])])}</li>`).join('')}</ul>
      ${tag(L('Langkah kecil minggu ini', 'One small step this week'))}<p>${esc(GM_STEP[focus[0]])}</p>
      <p class="muted small">${L('Diajak Tes Karakter Lengkap atau sesi coaching via Instagram atau WhatsApp.', 'Invited to the Full Character Test or a coaching session via Instagram or WhatsApp.')}</p>
    </section>`;
  }
  return '';
}
function detailLengkap(x) {

  const traits = k => ({ s: a.picks.strengths.filter(w => w.type === k).map(w => w.word), w: a.picks.weaknesses.filter(w => w.type === k).map(w => w.word) });
  return `
    <section class="hero" style="--soft:${P.soft}">
      <div class="hero-art">${comboArt(a.primary, a.secondary, 132, 'd' + x.id)}</div>
      <div><small class="eyebrow">${P.name} + ${Sx.name}</small><h2>${esc(a.combo.name)}</h2><p class="muted">${esc(a.combo.tagline)}</p>
        ${a.alts.length ? `<p class="note">${L('Bisa juga terbaca sebagai', 'Can also be read as')}: ${a.alts.map(k => COMBOS[k].name).join(', ')}</p>` : ''}</div>
    </section>
    ${!SLUG && a.flags.length ? `<section class="box warn"><h3>${L('Perlu follow up', 'Needs follow-up')} · ${esc(levelName(a.level))}</h3><ul class="flaglist">${a.flags.map(f => `<li><b>${esc(f.internal)}</b><span>${esc(FLAG_BASIS()[f.code] || '')}</span></li>`).join('')}</ul></section>` : ''}
    <section class="box"><h3>${L('Gambaran singkat', 'Quick profile')}</h3>
      <div class="prof">
        <div><h4>${L('Kekuatan utama', 'Key strengths')}</h4><ul>${a.combo.powers.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
        <div><h4>${L('Perlu diwaspadai', 'Watch out for')}</h4><ul>${a.combo.watch.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
        <div><h4>${L('Kebutuhan emosional', 'Emotional needs')}</h4><ul>${P.needs.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
        <div><h4>${L('Biasanya bersinar di', 'Usually shines in')}</h4><p>${esc(a.combo.thrive)}</p></div>
      </div>
    </section>
    <section class="box"><h3>${L('Lembar skor', 'Score sheet')}</h3>
      <table class="sheet"><thead><tr><th></th><th>${L('Kekuatan', 'Strengths')}</th><th>${L('Kelemahan', 'Weaknesses')}</th><th>Total</th></tr></thead><tbody>
      ${ORDER.map(k => `<tr><td><span class="sw" style="background:${TEMPS[k].color}"></span>${TEMPS[k].name}</td><td>${sc.s[k]}</td><td class="${sc.w[k] - sc.s[k] >= 3 ? 'alert' : ''}">${sc.w[k]}</td><td><b>${sc.t[k]}</b></td></tr>`).join('')}

    </section>
    <section class="box"><h3>${L('Sifat yang dipilih', 'Selected traits')}</h3>
      <div class="words">${ORDER.map(k => { const w = traits(k); return `<div class="wcol" style="--c:${TEMPS[k].color};--soft:${TEMPS[k].soft}">
        <h4>${TEMPS[k].name}</h4>
        <p><small>${L('Kekuatan', 'Strengths')} (${w.s.length})</small>${w.s.map(t => `<span class="chip">${esc(t)}</span>`).join('') || '<span class="none">-</span>'}</p>
        <p><small>${L('Kelemahan', 'Weaknesses')} (${w.w.length})</small>${w.w.map(t => `<span class="chip neg">${esc(t)}</span>`).join('') || '<span class="none">-</span>'}</p>
      </div>`; }).join('')}</div>
    </section>
    ${a.insights.length ? `<section class="box"><h3>${L('Insight lapangan', 'Field insights')}</h3><ul>${a.insights.map(i => `<li><b>${esc(i.title)}</b> (${i.score})</li>`).join('')}</ul></section>` : ''}
    ${a.ties.length ? `<section class="box"><h3>${L('Catatan skor seri', 'Tie notes')}</h3>${a.ties.map(t => `<p>${esc(t)}</p>`).join('')}</section>` : ''}`;
}

    ${x.tooFast ? `<div class="box warn small"><p>${L(`Dikerjakan sangat cepat (${fmtDur(x.dur)}). Hasil mungkin kurang akurat.`, `Completed very quickly (${fmtDur(x.dur)}). The result may be less accurate.`)}</p></div>` : ''}

      ${row(L('Tahu dari', 'Heard from'), esc(x.src))}${row('Ref', esc(x.ref))}${row('UTM', esc(x.utm))}${row(L('Lokasi', 'Location'), esc(x.place))}${row(L('Kode hasil', 'Result code'), `<span class="mono">${esc(x.id)}</span>`)}

function toolsHtml(B) {
  const showCats = !SLUG && (S.tab === 'all' || S.tab === 'mindset');
  const showTemps = S.tab !== 'mindset';
  const tCount = k => B.filter(x => domOf(x).includes(k)).length;
  const cCount = k => B.filter(x => x.gm && x.gm.category === k).length;
  const pills = [];
  S.temps.forEach(k => pills.push([`t:${k}`, TEMPS[k].name, TEMPS[k].color]));
  S.cats.forEach(k => pills.push([`c:${k}`, GM_CATEGORIES[k].name]));
  if (rangeOn()) pills.push(['r', S.range === 'custom' ? `${S.from ? fmtDate(S.from + 'T00:00:00') : '…'} – ${S.to ? fmtDate(S.to + 'T00:00:00') : '…'}` : RANGES().find(r => r[0] === S.range)[1]]);
  S.f.forEach(k => { const f = FILTERS().find(f => f.k === k); if (f) pills.push([`f:${k}`, f.label]); });
  return `
    <div class="toolrow">
      <label class="sortsel"><span>${L('Urutkan', 'Sort')}</span><select id="sort" aria-label="${L('Urutkan berdasarkan', 'Sort by')}">${SORTS().filter(o => !(SLUG && o[0] === 'score' && false)).map(o => `<option value="${o[0]}"${S.sort === o[0] ? ' selected' : ''}>${o[1]}</option>`).join('')}</select></label>
      <button class="dirbtn" id="dir" title="${L('Balik urutan', 'Reverse order')}">${S.dir === 1 ? ICON.sortUp : ICON.sortDown}<span>${dirLabel()}</span></button>
      <button class="filterbtn${S.panel ? ' on' : ''}" id="fbtn" aria-expanded="${S.panel}">${ICON.filter}<span>Filter</span>${activeCount() ? `<b>${activeCount()}</b>` : ''}</button>
    </div>
    ${S.panel ? `<div class="fpanel">
      ${showTemps ? `<div class="fsec"><h5>${L('Karakter dominan', 'Primary temperament')}</h5><div class="tchips">${ORDER.map(k => `<button data-temp="${k}" aria-pressed="${S.temps.has(k)}" style="--c:${TEMPS[k].color};--soft:${TEMPS[k].soft}">${glyph(k, 22)}<span>${TEMPS[k].name}</span><small>${tCount(k)}</small></button>`).join('')}</div></div>` : ''}
      ${showCats ? `<div class="fsec"><h5>${L('Kategori mindset', 'Mindset category')}</h5><div class="chips">${['fixed', 'transition', 'growth'].map(k => `<button data-cat="${k}" aria-pressed="${S.cats.has(k)}">${GM_CATEGORIES[k].name} <small>${cCount(k)}</small></button>`).join('')}</div></div>` : ''}

        <div class="chips">${RANGES().map(r => `<button data-range="${r[0]}" aria-pressed="${S.range === r[0]}">${r[1]}</button>`).join('')}</div>
        ${S.range === 'custom' ? `<div class="dates"><label><span>${L('Dari', 'From')}</span><input type="date" id="from" value="${S.from}" max="${S.to || ''}"></label><label><span>${L('Sampai', 'To')}</span><input type="date" id="to" value="${S.to}" min="${S.from || ''}"></label></div>` : ''}
      </div>
      ${FILTERS().length ? `<div class="fsec"><h5>${L('Lainnya', 'Other')}</h5><div class="chips">${FILTERS().map(f => `<button data-f="${f.k}" aria-pressed="${S.f.has(f.k)}">${f.label}</button>`).join('')}</div></div>` : ''}
      <div class="factions">${activeCount() ? `<button class="linkbtn" id="freset">${L('Reset semua filter', 'Clear all filters')}</button>` : '<span></span>'}<button class="btn" id="fdone">${L("Tampilkan", "Show")} ${B.filter(x => S.tab === "all" || x.kind === S.tab).length} ${L("hasil", "results")}</button></div>

}

function app() {

  const c = k => B.filter(x => k === 'all' || x.kind === k).length;
  const week = B.filter(x => Date.now() - x.t < 7 * 864e5).length;
  const filtered = activeCount() > 0 || S.q.trim();
  const nOld = S.items.filter(x => x.legacy).length, nNew = S.items.length - nOld;
  return `
  <div class="shell${sel ? ' has-sel' : ''}">

    ${S.err ? `<div class="banner">${esc(S.err)}</div>` : ''}
    ${nOld ? `<div class="srcbar"><div class="src" role="tablist">${[['new', L('Web baru', 'New web app'), nNew], ['old', L('Arsip<span class="hm"> web lama</span>', 'Archive<span class="hm"> (old web app)</span>'), nOld], ['all', L('Semua', 'All'), nNew + nOld]].map(o => `<button data-src="${o[0]}" aria-pressed="${S.src === o[0]}">${o[1]}<small>${o[2]}</small></button>`).join('')}</div>
      ${S.src === 'old' ? `<p class="srcnote">${L('Hasil dari web app lama, sebelum November 2026. Tidak dihitung di data web baru.', 'Results from the old web app, before November 2026. Not counted in the new web app data.')}</p>` : ''}</div>` : ''}
    <section class="stats${SLUG ? ' five' : ''}">
      <div><b>${B.length}</b><span>${filtered ? L('Hasil sesuai filter', 'Matching results') : L('Total tes', 'Total tests')}</span></div>
      ${SLUG ? ORDER.map(k => `<div style="--c:${TEMPS[k].color}"><b>${B.filter(x => x.p === k).length}</b><span>${L('Dominan', 'Primary')} ${TEMPS[k].name}</span></div>`).join('') + '</section><section hidden>' : ''}
      <div><b>${week}</b><span>${L('7 hari terakhir', 'Last 7 days')}</span></div>
      <div><b>${B.filter(x => x.flag).length}</b><span>${L('Perlu follow up', 'Needs follow-up')}</span></div>
      <div><b>${B.filter(x => x.wa).length}</b><span>${L('Ada WhatsApp', 'Has WhatsApp')}</span></div>
    </section>
    <div class="main">
      <aside class="list-pane">
        <div class="tools">
          <div class="seg"${SLUG || S.src === 'old' ? ' hidden' : ''}>${['all', 'lengkap', 'mini', 'mindset'].map(k => `<button data-tab="${k}" aria-pressed="${S.tab === k}">${k === 'all' ? L('Semua', 'All') : ({ lengkap: L('Tes Lengkap', 'Full test'), mini: L('Tes Mini', 'Mini test'), mindset: L('Tes Mindset', 'Mindset test') })[k]}<small>${c(k)}</small></button>`).join('')}</div>
          <div class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="${SLUG ? L('Cari nama, kode, token…', 'Search name, code, token…') : L('Cari nama, kode, WA, token…', 'Search name, code, WhatsApp, token…')}" value="${esc(S.q)}" autocomplete="off"></div>
          ${toolsHtml(B)}
        </div>
        <div class="list" id="list">${listHtml(items)}</div>
        <div class="foot-row"><p class="count">${countText(items.length)}</p>${!SLUG ? `<p class="legend">${L('Prioritas follow up', 'Follow-up priority')}:<span><i class="dot hi"></i>${L('Tinggi', 'High')}</span><span><i class="dot"></i>${L('Sedang', 'Medium')}</span></p>` : ''}</div>
      </aside>
      <article class="detail" id="detail">${detail(sel)}</article>
    </div>
  </div>`;
}

function toast(m) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = Object.assign(document.createElement('div'), { className: 'toast', textContent: m }); document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

function bindCommon(root) {
  root.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); toast(L('Disalin', 'Copied')); } catch (e) { toast(b.dataset.copy); }
  }));
  root.querySelectorAll('[data-act=close]').forEach(b => b.addEventListener('click', closeDetail));
  root.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.lang === LANG) return;
    setLang(b.dataset.lang); ls.set(LKEY, LANG); rebuild(); render();
  }));
}

function renderList() {
  document.getElementById('list').innerHTML = listHtml(visible());
  document.querySelector('.count').textContent = countText(visible().length);
  bindList();
}
let _io = null;
function bindList() {
  const more = document.getElementById('more');
  if (_io) { _io.disconnect(); _io = null; }
  if (more) {
    const go = () => { S.limit += 80; renderList(); };
    more.addEventListener('click', go);
    if ('IntersectionObserver' in window) { _io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) go(); }, { rootMargin: '300px' }); _io.observe(more); }
  }
  $app.querySelectorAll('.it').forEach(b => b.addEventListener('click', () => {
    S.sel = b.dataset.key;
    $app.querySelectorAll('.it.on').forEach(x => x.classList.remove('on')); b.classList.add('on');
    const d = document.getElementById('detail'); d.innerHTML = detail(S.items.find(x => x.key === S.sel)); d.scrollTop = 0;
    document.querySelector('.shell').classList.add('has-sel'); bindCommon(d);
    if (matchMedia('(max-width: 767px)').matches) history.pushState({ d: 1 }, '');
  }));
}

function render() {
  document.title = SLUG ? `Dashboard · ${S.clientName || CLIENT}` : 'Dashboard · Mengapa';
  if (!S.session) {
    $app.innerHTML = login();
    bindCommon($app);
    const f = document.getElementById('lf');
    document.getElementById('eye').addEventListener('click', e => {
      const pw = document.getElementById('pw'), show = pw.type === 'password', b = e.currentTarget;
      pw.type = show ? 'text' : 'password'; b.innerHTML = EYE[show ? 1 : 0];
      b.title = b.ariaLabel = show ? L('Sembunyikan password', 'Hide password') : L('Tampilkan password', 'Show password'); pw.focus();
    });
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('lbtn'), er = document.getElementById('lerr');
      btn.disabled = true; btn.textContent = L('Memeriksa…', 'Checking…'); er.hidden = true;
      try {
        const j = await api({ action: 'login', user: f.elements.user.value, pass: f.elements.pass.value });
        S.session = j.session; session.set(j.session, j.hours || 12); S.err = ''; load();
      } catch (err) { er.hidden = false; er.textContent = err.message; btn.disabled = false; btn.textContent = L('Masuk', 'Sign in'); }
    });
    return;
  }
  const qFocused = document.activeElement && document.activeElement.id === 'q';
  if (!render.keepLimit) S.limit = 80;
  $app.innerHTML = app();
  bindCommon($app); bindList();
  $app.querySelector('[data-act=reload]').addEventListener('click', load);
  $app.querySelector('[data-act=logout]').addEventListener('click', logout);
  $app.querySelectorAll('[data-src]').forEach(b => b.addEventListener('click', () => { S.src = b.dataset.src; if (S.src === 'old') S.tab = 'all'; S.sel = ''; render(); }));
  $app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { S.tab = b.dataset.tab; render(); }));
  const tog = (set, v) => { set.has(v) ? set.delete(v) : set.add(v); render(); };
  $app.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => tog(S.f, b.dataset.f)));
  $app.querySelectorAll('[data-temp]').forEach(b => b.addEventListener('click', () => tog(S.temps, b.dataset.temp)));
  $app.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => tog(S.cats, b.dataset.cat)));
  $app.querySelectorAll('[data-range]').forEach(b => b.addEventListener('click', () => { S.range = b.dataset.range; render(); }));
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on('from', 'change', e => { S.from = e.target.value; render(); });
  on('to', 'change', e => { S.to = e.target.value; render(); });
  on('sort', 'change', e => { S.sort = e.target.value; S.dir = DEFDIR[S.sort]; ls.set('mengapa:admin:sort', S.sort); ls.set('mengapa:admin:dir', S.dir); render(); });
  on('dir', 'click', () => { S.dir = -S.dir; ls.set('mengapa:admin:dir', S.dir); render(); });
  on('fbtn', 'click', () => { S.panel = !S.panel; render(); });
  on('fdone', 'click', () => { S.panel = false; render(); });
  on('freset', 'click', () => { S.temps.clear(); S.cats.clear(); S.f.clear(); S.range = 'all'; S.from = S.to = ''; render(); });
  $app.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
    const [t, v] = b.dataset.rm.split(':');
    if (t === 't') S.temps.delete(v); else if (t === 'c') S.cats.delete(v); else if (t === 'f') S.f.delete(v); else { S.range = 'all'; S.from = S.to = ''; }
    render();
  }));
  const q = document.getElementById('q');
  q.addEventListener('input', () => { S.q = q.value; S.limit = 80; renderList(); });
  if (qFocused) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

{ const q = (new URLSearchParams(location.search).get('lang') || '').toLowerCase(); setLang(q === 'en' || q === 'id' ? q : ls.get(LKEY) || 'id'); }
function closeDetail() {
  S.sel = ''; const sh = document.querySelector('.shell'); if (!sh) return;
  sh.classList.remove('has-sel'); $app.querySelectorAll('.it.on').forEach(x => x.classList.remove('on'));
  const d = document.getElementById('detail'); if (d) d.innerHTML = detail(null);
}
window.addEventListener('popstate', () => { if (S.sel) closeDetail(); });
render();
if (S.session) load();

</script>
</body>
</html>
