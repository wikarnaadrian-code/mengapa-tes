  <style>
/* ============ MENGAPA · Tes 4 Temperamen ============ */
:root {
  --bg: #FBF7EC;
  --paper: #FFFDF9;
  --ink: #1F3A36;
  --ink-2: #3A3631;
  --muted: #6B645B;
  --faint: #9A9287;
  --line: #E6DED1;
  --line-2: #D8CEBF;
  --S: #E5BE2E; --C: #BC4235; --M: #538FCB; --P: #88A261;
  --radius: 20px;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(28,26,23,.04), 0 8px 28px rgba(28,26,23,.06);
  --ease: cubic-bezier(.2,.7,.2,1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
img, svg { display: block; }
:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 3px; border-radius: 10px; }

/* ---------- layout ---------- */
.screen { min-height: 100svh; display: flex; flex-direction: column; animation: enter .45s var(--ease) both; }
.wrap { width: 100%; max-width: 640px; margin: 0 auto; padding: 0 22px; }
.wrap.wide { max-width: 760px; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; gap: 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
.brand img.li { height: 38px; width: auto; }
.brand img.lw { height: 21px; width: auto; margin-top: 3px; }
.wordmark { font-weight: 700; letter-spacing: .32em; font-size: 13px; }
.top .muted-link { font-size: 13px; color: var(--muted); text-decoration: none; }

.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; letter-spacing: -.01em; line-height: 1.12; margin: 0; }
h1 { font-size: clamp(38px, 9vw, 60px); }
h1 em, h2 em { font-style: italic; font-weight: 400; }
h2 { font-size: clamp(26px, 6vw, 34px); }
h3 { font-size: 21px; }
.lead { font-size: 17px; color: var(--ink-2); max-width: 34em; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
p { margin: 0; }
.stack > * + * { margin-top: var(--gap, 16px); }

/* ---------- buttons ---------- */
.btn {
  appearance: none; border: 0; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 54px; padding: 0 26px; border-radius: 999px;
  background: var(--ink); color: var(--paper); font-weight: 600; font-size: 16px;
  transition: transform .15s var(--ease), background .2s, opacity .2s;
}
.btn:hover { background: #142825; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .35; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-2); }
.btn.ghost:hover { background: rgba(28,26,23,.04); }
.btn.wa { background: #1F8F55; }
.btn.wa:hover { background: #187446; }
.btn .arrow { transition: transform .2s var(--ease); }
.btn:hover .arrow { transform: translateX(3px); }
.linkbtn { background: none; border: 0; padding: 8px 4px; cursor: pointer; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- cards ---------- */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.divider { height: 1px; background: var(--line); margin: 28px 0; border: 0; }

/* ---------- home ---------- */
.hero { padding: 14px 0 0; }
.hero h1 { margin: 10px 0 12px; }
.hero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 22px; font-size: 14px; color: var(--muted); }
.facts span::before { content: "●"; font-size: 7px; vertical-align: 3px; margin-right: 8px; color: var(--faint); }
.temps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 18px; }
.temp { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.temp .glyph { margin-bottom: 10px; }
.temp b { display: block; font-family: var(--serif); font-size: 19px; font-weight: 600; }
.temp small { display: block; color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 2px; }
.combos-strip { display: flex; gap: 12px; overflow-x: auto; padding: 6px 2px 14px; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 14px -22px 0; padding-left: 22px; padding-right: 22px; }
.combos-strip::-webkit-scrollbar { display: none; }
.mini { flex: 0 0 132px; scroll-snap-align: start; text-align: center; }
.mini .combo-art { margin: 0 auto 6px; }
.mini b { display: block; font-family: var(--serif); font-size: 15px; font-weight: 600; line-height: 1.2; }
.mini small { font-size: 11.5px; color: var(--muted); }
.resume { display: flex; gap: 14px; align-items: center; justify-content: space-between; margin-top: 20px; }
footer.foot { margin-top: auto; padding: 28px 0 22px; font-size: 13px; color: var(--muted); text-align: center; }
footer.foot .tag { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--ink-2); display: block; margin-bottom: 6px; }

/* ---------- steps (guide/profile/consent) ---------- */
.stepper { display: flex; gap: 6px; margin: 2px 0 18px; }
.stepper i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
.stepper i.on { background: var(--ink); }
.howto { list-style: none; padding: 0; margin: 24px 0 0; counter-reset: s; }
.howto li { counter-increment: s; position: relative; padding: 0 0 18px 50px; color: var(--ink-2); }
.howto li::before { content: counter(s); position: absolute; left: 0; top: -2px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--paper); border: 1px solid var(--line-2); }
.howto b { color: var(--ink); }
.demo { margin-top: 8px; }
.demo .opt { pointer-events: none; }

.field { margin-top: 14px; }
.field label { display: block; font-weight: 600; font-size: 14.5px; margin-bottom: 7px; }
.field .opt-tag { font-weight: 500; color: var(--faint); }
.input {
  width: 100%; min-height: 54px; padding: 14px 16px; border-radius: 14px; font-size: 16px;
  background: var(--paper); border: 1.5px solid var(--line-2); transition: border-color .2s, box-shadow .2s;
}
.input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 4px rgba(28,26,23,.07); }

.sheet thead th .glyph { margin: 0 auto 5px; }
.sheet thead th span { display: block; line-height: 1.2; white-space: nowrap; }
@media (min-width: 480px) { .sheet thead th { font-size: 13px; } .sheet tbody th { font-size: 13px !important; width: 90px !important; } }
.sheet tbody th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); width: 66px; padding-left: 2px; }
.sheet td { font-size: 18px; font-weight: 600; border-bottom: 1px solid var(--line); }
.sheet td.dom, .sheet td.sec, .sheet th.dom, .sheet th.sec { background: var(--soft); }
.sheet thead th.dom, .sheet thead th.sec { border-radius: 12px 12px 0 0; }
.sheet tr.tot td { font-size: 24px; font-weight: 700; border-bottom: 0; position: relative; padding-bottom: 16px; }
.sheet tr.tot td.dom, .sheet tr.tot td.sec { border-radius: 0 0 12px 12px; }
.sheet tr.tot th { color: var(--ink); }
.sheet tr.tot td i { position: absolute; left: 8px; bottom: 7px; height: 4px; border-radius: 4px; max-width: calc(100% - 16px); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
@media (min-width: 700px) { .cols { grid-template-columns: repeat(4, 1fr); } }
.col { background: var(--paper); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 16px; padding: 14px 14px 10px; }
.col-head { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.col-head .glyph { flex: 0 0 auto; }
.col-head div { flex: 1; min-width: 0; line-height: 1.2; }
.col-head b { display: block; font-size: 14.5px; }
.col-head small { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--deep); }
.col-head strong { font-size: 24px; font-variant-numeric: tabular-nums; }
.col-part { padding: 10px 0 4px; }
.col-part + .col-part { border-top: 1px dashed var(--line-2); }
.col-lbl { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.col-lbl span { color: var(--ink); font-size: 13px; letter-spacing: 0; }
.words { list-style: none; margin: 0; padding: 0; }
.words li { font-size: 14px; line-height: 1.35; padding: 3px 0 3px 12px; position: relative; color: var(--ink-2); }
.words li::before { content: ""; position: absolute; left: 0; top: 10px; width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
.none { font-size: 13px; color: var(--faint); font-style: italic; padding: 2px 0 6px; }

.uses { display: grid; gap: 10px; margin-top: 18px; }
.use { display: flex; gap: 12px; align-items: flex-start; background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 14px; padding: 14px; }
.use .glyph { flex: 0 0 auto; margin-top: 2px; }
.use div { flex: 1; min-width: 0; }
.use b { display: block; font-size: 15px; }
.use b small { display: inline-block; margin-left: 8px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--deep); background: var(--soft); padding: 2px 8px; border-radius: 999px; vertical-align: 1px; }
.use p { font-size: 14.5px; color: var(--ink-2); margin-top: 2px; line-height: 1.45; }
.use strong { font-size: 20px; font-variant-numeric: tabular-nums; color: var(--muted); }

/* ---------- print / PDF ---------- */
@media print {
  @page { margin: 14mm; }
  body { background: #fff; }
  .no-print, .testbar, .toast { display: none !important; }
  .screen { min-height: 0; animation: none; }
  .card { box-shadow: none; break-inside: avoid; }
  .col, .sheet { break-inside: avoid; }
  .block { break-inside: avoid; margin-top: 26px; }
  .deep { background: #fff; color: var(--ink); border: 1.5px solid var(--ink); }
  .deep h2, .deep p, .deep li { color: var(--ink); }
  .bar .rail i, .res-hero .combo-art { animation: none; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* kontak setara: Instagram + WhatsApp */
.contact-lead { margin: 18px 0 8px; font-size: 14px; font-weight: 600; opacity: .85; }
.contact-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.contact-lead + .contact-row { margin-top: 0; }
.contact-row .btn { min-height: 52px; font-size: 15px; padding: 0 10px; white-space: nowrap; gap: 8px; }
.btn.ig { background: linear-gradient(45deg, #F58529, #DD2A7B 55%, #8134AF); color: #fff; }
.btn.ig:hover { filter: brightness(1.06); background: linear-gradient(45deg, #F58529, #DD2A7B 55%, #8134AF); }
.code-note { margin-top: 12px; text-align: center; opacity: .8; line-height: 1.5; }
.share-row.one { grid-template-columns: 1fr; }
.testbar .row .lang { margin-left: auto; }
.testbar .row .lang button { padding: 4px 8px; font-size: 11px; }
@media (max-width: 360px) { .contact-row .btn { font-size: 14px; } }
.testbar .count { white-space: nowrap; }
.testbar .section-tag { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

</style>
</head>

f, or to meet the needs of others."},{"t":"S","id":"Supel","en":"Sociable","d":"Memandang kebersamaan sebagai kesempatan untuk bersikap manis dan menghibur (senang dan mudah bergaul).","de":"One who sees being with others as an opportunity to be cute and entertaining rather than as a challenge or business opportunity."},{"t":"C","id":"Berkemauan kuat","en":"Strong-Willed","d":"Yakin dengan caranya sendiri dan berkeinginan kuat (ambisius).","de":"One who is determined to have their own ways."}],[{"t":"M","id":"Tenggang rasa","en":"Considerate","d":"Menghargai keperluan dan perasaan orang lain.","de":"Having regard for the needs and feelings of others."},{"t":"P","id":"Terkendali","en":"Controlled","d":"Mempunyai perasaan emosional tapi jarang memperlihatkannya.","de":"Has emotional feelings but rarely displays them."},{"t":"C","id":"Kompetitif","en":"Competitive","d":"Membuat setiap situasi, kejadian atau permainan menjadi kontes dan selalu bermain untuk menang.","de":"Turns every situation, happening, or game into a contest and always plays to win!"},{"t":"S","id":"Meyakinkan","en":"Convincing","d":"Bisa mengambil hati dan meyakinkan orang lain melalui pesona kepribadiannya.","de":"Can win you over to anything through the sheer charm of their personalities."}],[{"t":"S","id":"Menyegarkan","en":"Refreshing","d":"Menambah energi dan membuat orang lain merasa senang.","de":"Renews and stimulates or makes others feel good."},{"t":"M","id":"Penuh hormat","en":"Respectful","d":"Memperlakukan orang lain dengan rasa segan, penuh kehormatan dan penghargaan.","de":"Treats others with deference, honor, and esteem."},{"t":"P","id":"Menahan diri","en":"Reserved","d":"Menahan diri dalam menunjukkan emosi atau antusiasme.","de":"Self-restraint in expression of emotion or enthusiasm."},{"t":"C","id":"Banyak akal","en":"Resourceful","d":"Bisa bertindak cepat dan efektif dalam semua situasi.","de":"Able to act quickly and effectively in virtually all situations."}],[{"t":"P","id":"Mudah puas","en":"Satisfied","d":"Mudah menerima keadaan atau situasi (mudah puas).","de":"A person who easily accepts any circumstance or situation."},{"t":"M","id":"Peka","en":"Sensitive","d":"Secara intens memperhatikan orang lain dan apa yang terjadi.","de":"Intensively cares about others and what happens."},{"t":"C","id":"Mandiri","en":"Self-Reliant","d":"Mandiri dan bisa sepenuhnya mengandalkan kemampuan, penilaian, dan sumber daya sendiri.","de":"An independent person who can fully rely on their own capabilities, judgment, and resources."},{"t":"S","id":"Bersemangat","en":"Spirited","d":"Penuh kehidupan dan gairah.","de":"Full of life and excitement."}],[{"t":"M","id":"Perencana","en":"Planner","d":"Suka menyusun rencana yang rinci sebelum memulai suatu pekerjaan dan lebih memilih terlibat dalam tahap perencanaan daripada pelaksanaan.","de":"Prefers to work out a detailed arrangement beforehand for the accomplishment of project or goal, and prefers involvement with the planning stages and the finished product rather than the carrying out of the task."},{"t":"P","id":"Sabar","en":"Patient","d":"Tidak terpengaruh oleh keterlambatan, tetap tenang dan toleran (sabar).","de":"Unmoved by delay, remains calm and tolerant."},{"t":"C","id":"Yakin berhasil","en":"Positive","d":"Yakin semuanya akan beres kalau dia yang memimpin.","de":"Knows it will turn out right if they are in charge."},{"t":"S","id":"Promotor","en":"Promoter","d":"Mendorong atau memaksa orang lain untuk ikut, bergabung, atau berinvestasi melalui pesona kepribadiannya.","de":"Urges or compels others to go along, join, or invest through the charm of their own personalities."}],[{"t":"C","id":"Mantap","en":"Sure","d":"Yakin, jarang ragu-ragu atau goyah.","de":"Confident, rarely hesitates or wavers."},{"t":"S","id":"Spontan","en":"Spontaneous","d":"Memilih hidup atau kegiatan yang impulsif, tidak direncanakan atau dipikirkan lebih dulu.","de":"Prefers all of life to be impulsive, unpremeditated activity, not restricted by plans."},{"t":"M","id":"Terjadwal","en":"Scheduled","d":"Merencanakan semua aktivitas, tidak menyukai rencananya terganggu.","de":"Makes and lives according to a daily plan, dislikes their plans to be interrupted."},{"t":"P","id":"Pendiam","en":"Shy","d":"Jarang memulai percakapan.","de":"Quiet, doesn't easily instigate a conversation."}],[{"t":"M","id":"Teratur","en":"Orderly","d":"Mengatur segala-galanya secara metodis dan sistematis.","de":"A person who has a methodical, systematic arrangement of things."},{"t":"P","id":"Akomodatif","en":"Obliging","d":"Cepat mengikuti cara orang lain.","de":"Accommodating. One who is quick to do it another's way."},{"t":"C","id":"Blak-blakan","en":"Outspoken","d":"Bicara terang-terangan dan tanpa menahan diri.","de":"Speaks frankly and without reserve."},{"t":"S","id":"Optimis","en":"Optimistic","d":"Periang dan meyakinkan dirinya dan orang lain bahwa segala-galanya akan beres.","de":"Sunny disposition who convinces themselves and others that everything will turn out all right."}],[{"t":"P","id":"Ramah","en":"Friendly","d":"Lebih sering merespons daripada memulai, jarang membuka percakapan lebih dulu.","de":"A responder rather than an initiator, seldom starts a conversation."},{"t":"M","id":"Setia","en":"Faithful","d":"Secara konsisten bisa diandalkan, teguh, setia dan mengabdi kadang-kadang tanpa alasan.","de":"Consistently reliable, steadfast, loyal, and devoted sometimes beyond reason."},{"t":"S","id":"Lucu","en":"Funny","d":"Punya rasa humor yang tinggi dan bisa membuat cerita apa saja menjadi menarik dan menyenangkan.","de":"Sparkling sense of humor that can make virtually any story into a hilarious event."},{"t":"C","id":"Berwibawa","en":"Forceful","d":"Mendominasi dan menyebabkan orang lain tidak berani untuk melawan.","de":"A commanding personality whom others would hesitate to take a stand against."}],[{"t":"C","id":"Berani ambil risiko","en":"Daring","d":"Berani mengambil risiko dan tidak kenal takut.","de":"Willing to take risks; fearless, bold."},{"t":"S","id":"Menyenangkan","en":"Delightful","d":"Teman yang menyenangkan.","de":"A person who is upbeat and fun to be with."},{"t":"P","id":"Diplomatis","en":"Diplomatic","d":"Bijaksana, perasa, dan sabar dalam berurusan dengan orang lain.","de":"Deals with people tactfully, sensitively, and patiently."},{"t":"M","id":"Rinci","en":"Detailed","d":"Melakukan segala-galanya secara berurutan dan punya ingatan yang kuat tentang segala hal yang terjadi.","de":"Does everything in proper order with a clear memory of all the things that happen."}],[{"t":"S","id":"Ceria","en":"Cheerful","d":"Memiliki semangat tinggi dan membagikan kebahagiaan pada orang lain.","de":"Consistently in good spirits and promoting happiness in others."},{"t":"P","id":"Konsisten","en":"Consistent","d":"Memiliki keseimbangan emosional yang baik dan respon yang bisa diprediksi.","de":"Stays emotionally on an even keel, responding as one might expect."},{"t":"M","id":"Berbudaya","en":"Cultured","d":"Tertarik pada hal-hal yang bersifat intelektual dan artistik, seperti seni, musik, dan sastra.","de":"One whose interests involve both intellectual and artistic pursuits, such as theater, symphony, ballet."},{"t":"C","id":"Percaya diri","en":"Confident","d":"Percaya diri dan yakin akan kemampuan dan suksesnya sendiri.","de":"Self-assured and certain of own ability and success."}],[{"t":"M","id":"Idealis","en":"Idealistic","d":"Membayangkan segala sesuatu dalam bentuk yang sempurna dan memiliki kebutuhan untuk mencapai standar tersebut.","de":"Visualizes things in their perfect form, and has a need to measure up to that standar themselves."},{"t":"C","id":"Berdikari","en":"Independent","d":"Mandiri, penuh kepercayaan terhadap kemampuan diri sendiri, dan cenderung tidak memerlukan bantuan.","de":"Self-sufficient, self-supporting, self-confident, and seems to have little need of help."},{"t":"P","id":"Tidak menyinggung","en":"Inoffensive","d":"Tidak pernah mengatakan atau menyebabkan apapun yang tidak menyenangkan.","de":"A person who never says or causes anything unpleasant or objectionable."},{"t":"S","id":"Menginspirasi","en":"Inspiring","d":"Mendorong orang lain untuk bekerja, bergabung, atau terlibat, dan membuat segala sesuatu menjadi menyenangkan.","de":"Encourages others to work, join, or be involved, and makes the whole thing fun."}],[{"t":"S","id":"Terbuka dengan perasaan","en":"Demonstrative","d":"Menunjukkan emosinya secara terang-terangan, terutama rasa sayang, dan tidak ragu-ragu untuk menyentuh orang lain ketika bicara.","de":"Openly expresses emotion, especially affection and doesn't hesitate to touch others while speaking to them."},{"t":"C","id":"Tegas memutuskan","en":"Decisive","d":"Mempunyai kemampuan membuat penilaian yang cepat dan mengambil keputusan.","de":"A person with quick, conclusive, judgment-making ability."},{"t":"P","id":"Humor kering","en":"Dry Humor","d":"Memiliki humor yang kering, biasanya berupa kalimat singkat yang bisa bersifat sarkastik.","de":"Exhibits 'dry wit', usually one-liners which can be sarcastic in nature."},{"t":"M","id":"Mendalam","en":"Deep","d":"Intensif, introspektif, dan tidak suka basa-basi.","de":"Intense and often introspective with a distaste for surface conversation and pursuits."}],[{"t":"P","id":"Penengah","en":"Mediator","d":"Secara konsisten berperan untuk merukunkan pertikaian supaya bisa menghindari konflik.","de":"Consistently finds themselves in the role of reconciling differences in order to avoid conflict."},{"t":"M","id":"Berjiwa seni","en":"Musical","d":"Ikut serta atau punya apresiasi mendalam tentang musik. Punya komitmen terhadap musik sebagai bentuk seni, bukan hanya kesenangan pertunjukan (senang seni).","de":"Participates in or has a deep appreciation for music, is committed to music as an art form, rather than the fun of performance."},{"t":"C","id":"Penggerak","en":"Mover","d":"Terdorong oleh keperluan untuk produktif, pemimpin yang diikuti orang lain, merasa sulit untuk duduk diam (sulit untuk santai).","de":"Driven by a need to be productive, is a leader whom others follow, finds it difficult to sit still."},{"t":"S","id":"Mudah berbaur","en":"Mixes Easily","d":"Menyukai pesta dan tidak sabar untuk bertemu dengan setiap orang dalam ruangan. Bisa merasa kenal atau dekat dengan semua orang (mudah bergaul).","de":"Loves a party and can't wait to meet everyone in the room, never meets a stranger."}],[{"t":"M","id":"Penuh perhatian","en":"Thoughtful","d":"Penuh perhatian, ingat akan kejadian-kejadian spesial, dan mudah berbuat baik terhadap orang lain.","de":"A considerate person who remembers special occasions and is quick to make a kind gesture."},{"t":"C","id":"Gigih","en":"Tenacious","d":"Memegang teguh, dengan keras kepala, dan tidak mau melepaskan sampai tujuan tercapai.","de":"Holds on firmly, stubbornly, and won't let go until the goal is accomplished."},{"t":"S","id":"Suka bicara","en":"Talker","d":"Terus menerus bicara, biasanya menceritakan kisah yang lucu dan menghibur, dan merasa perlu mengisi kesunyian supaya membuat orang lain merasa senang.","de":"Constantly talking, generally telling funny stories and entertaining everyone around, feeling the need to fill the silence in order to make others comfortable."},{"t":"P","id":"Toleran","en":"Tolerant","d":"Mudah menerima pemikiran dan cara-cara orang lain tanpa perlu mengubahnya.","de":"Easily accepts the thoughts and ways of others without the need to disagree with or change them."}],[{"t":"P","id":"Pendengar","en":"Listener","d":"Selalu bersedia mendengar apa yang orang lain katakan.","de":"Always seems willing to hear what you have to say."},{"t":"M","id":"Loyal","en":"Loyal","d":"Setia kepada seseorang, gagasan, atau pekerjaan, kadang-kadang tanpa alasan.","de":"Faithful to a person, ideal, or job, sometimes beyond reason."},{"t":"C","id":"Pemimpin","en":"Leader","d":"Suka memberi pengarahan karena terdorong untuk memimpin, sering merasa sulit percaya atas kinerja orang lain, dan bisa membuat orang lain mengikutinya.","de":"A natural born director, who is driven to be in charge, and often finds it difficult to believe that anyone else can do the job as well."},{"t":"S","id":"Lincah","en":"Lively","d":"Penuh kehidupan dan semangat.","de":"Full of life, vigorous, energetic."}],[{"t":"P","id":"Merasa cukup","en":"Contented","d":"Mudah puas dengan apa yang dimilikinya, jarang iri hati.","de":"Easily satisfied with what they have, rarely envious."},{"t":"C","id":"Komandan","en":"Chief","d":"Pemimpin dan mengharapkan orang lain mengikutinya.","de":"Commands leadership and expects people to follow."},{"t":"M","id":"Pembuat daftar","en":"Chartmaker","d":"Mengatur hidup, tugas dan memecahkan masalah dengan membuat daftar, formulir, atau grafik.","de":"Organizes life, tasks, and problem solving by making lists, forms, or graphs."},{"t":"S","id":"Menggemaskan","en":"Cute","d":"Sangat dicintai, pusat perhatian, dan menggemaskan.","de":"Precious, adorable, center of attention."}],[{"t":"M","id":"Perfeksionis","en":"Perfectionist","d":"Mempunyai standar yang tinggi kepada diri sendiri dan orang lain dan selalu melakukan segala hal dengan berurutan, sistematis, dan semestinya.","de":"Places high standars on themselves, and often on others, desiring that everything be in proper order at all times."},{"t":"P","id":"Enak diajak bergaul","en":"Pleasant","d":"Mudah bergaul, bersifat terbuka, mudah diajak bicara.","de":"Easygoing, easy to be around, easy to talk with."},{"t":"C","id":"Produktif","en":"Productive","d":"Harus terus menerus bekerja atau mencapai sesuatu, sering merasa sulit beristirahat.","de":"Must constantly be working or achieving, often finds it very difficult to rest."},{"t":"S","id":"Populer","en":"Popular","d":"Disenangi banyak orang dan diingini kehadirannya.","de":"Life of the party and therefore much desired as a party guest."}],[{"t":"S","id":"Energik","en":"Bouncy","d":"Kepribadian yang hidup, penuh energi.","de":"A bubbly, lively personality, full of energy."},{"t":"C","id":"Pemberani","en":"Bold","d":"Tidak kenal takut, berani terus terang, tidak takut akan risiko.","de":"Fearless, daring, forward, unafraid of risk."},{"t":"M","id":"Tahu aturan","en":"Behaved","d":"Secara konsisten ingin membawa dirinya di dalam batas-batas yang menurutnya wajar atau semestinya.","de":"Consistently desires to conduct themselves within the realm of what they feel is proper."},{"t":"P","id":"Seimbang","en":"Balanced","d":"Stabil, tidak mudah terpengaruh dengan situasi, cenderung mengambil jalan tengah, dan memiliki emosi yang tidak naik turun.","de":"Stable, middle-of-the-road personality, not subject to sharp highs or lows."}],[{"t":"P","id":"Datar","en":"Blank","d":"Memperlihatkan sedikit ekspresi wajah atau emosi.","de":"A person who shows little facial expression or emotion."},{"t":"M","id":"Pemalu","en":"Bashful","d":"Menghindari perhatian, akibat rasa malu (pemalu).","de":"Shrinks from getting attention, resulting from self-consciousness."},{"t":"S","id":"Mencolok","en":"Brassy","d":"Suka pamer, memperlihatkan hal-hal yang gemerlap, dan cenderung suka bicara (bawel).","de":"Showy, flashy, comes on strong, too loud."},{"t":"C","id":"Suka memerintah","en":"Bossy","d":"Suka memerintah, mendominasi, kadang-kadang membuat orang lain kesal.","de":"Commanding, domineering, sometimes overbearing in adult relationships."}],[{"t":"S","id":"Tidak disiplin","en":"Undisciplined","d":"Tidak teratur dalam kebanyakan bidang kehidupannya.","de":"A person whose lack of order permeates most every area of their lives."},{"t":"C","id":"Kurang simpati","en":"Unsympathetic","d":"Merasa sulit mengenali masalah, kondisi hati, atau perasaan orang lain.","de":"Finds it difficult to relate to the problems or hurts of others."},{"t":"P","id":"Tidak antusias","en":"Unenthusiastic","d":"Cenderung tidak bergairah, sering merasa bahwa bagaimanapun juga tidak akan berhasil.","de":"Tends to not get excited, often feeling it won't work anyway."},{"t":"M","id":"Sulit memaafkan","en":"Unforgiving","d":"Sulit memaafkan dan sulit melupakan sakit hati atau ketidakadilan yang terjadi kepada mereka.","de":"One who has difficulty forgiving or forgetting a hurt or injustice done to them, tends to hold onto a grudge."}],[{"t":"P","id":"Enggan ikut campur","en":"Reticent","d":"Tidak bersedia atau menolak ikut terlibat, terutama kalau rumit.","de":"Unwilling or struggles against getting involved, especially when complex."},{"t":"M","id":"Menyimpan kesal","en":"Resentful","d":"Sering memendam rasa tidak senang karena merasa tersinggung.","de":"Often holds ill feelings as a result of real or imagined offenses."},{"t":"C","id":"Menolak cara lain","en":"Resistant","d":"Melawan atau menolak untuk menerima cara lain yang bukan caranya sendiri.","de":"Strives, works against, or hesitates to accept any other way but their own."},{"t":"S","id":"Suka mengulang cerita","en":"Repetitious","d":"Menceritakan kembali untuk menghibur tanpa menyadari sudah menceritakannya beberapa kali sebelumnya dan terus menerus memerlukan sesuatu untuk dikatakan.","de":"Retells stories and incidents to entertain you without realizing they have already told the story several times before, is constantly needing something to say."}],[{"t":"M","id":"Rewel","en":"Fussy","d":"Bersikeras tentang persoalan atau perincian sepele dan minta perhatian besar.","de":"Insistent over petty matters or details, calling for great attention to trivial details."},{"t":"P","id":"Mudah cemas","en":"Fearful","d":"Sering mengalami perasaan sangat khawatir, sedih, atau gelisah dan takut sesuatu hal yang tidak diinginkan akan terjadi.","de":"Often experiences feelings of deep concern, apprehension, or anxiousness."},{"t":"S","id":"Pelupa","en":"Forgetful","d":"Punya daya ingat yang lemah yang biasanya berkaitan dengan kurang disiplin dan tidak mau repot-repot mencatat (pelupa).","de":"Lack of memory which is usually tied to a lack function permutations(arr) {
  if (arr.length <= 1) return [arr];
  return arr.flatMap((x, i) => permutations([...arr.slice(0, i), ...arr.slice(i + 1)]).map(p => [x, ...p]));
}

/* ===== i18n.js ===== */
/* Bahasa: Indonesia (default) dan Inggris.
   - Konten (soal, hasil, kombinasi) diganti di level data (content_en.js).
   - Teks tampilan statis diterjemahkan lewat kamus UI (ui_en.js) setelah render.
   - Teks dinamis memakai L('teks indonesia', 'english text').
   Data yang dikirim ke Google Sheet selalu dalam bahasa Indonesia. */



let LANG = 'id';
const L = (id, en) => (LANG === 'en' ? en : id);

const C = { TEMPS, COMBOS, FIELD_INSIGHTS, USE, MINI_PROFILE, GM_PILLARS, GM_CATEGORIES, GM_STEP, FUN_FACTS, FULL_BENEFITS, GM_SCALE, MINI_ROWS, GM_ITEMS, ROWS };
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function snap(target, shape) {
  if (Array.isArray(shape)) return JSON.parse(JSON.stringify(target));
  const o = {};
  Object.keys(shape).forEach(k => { o[k] = isObj(shape[k]) ? snap(target[k], shape[k]) : JSON.parse(JSON.stringify(target[k])); });
  return o;
}
function deepSet(target, src) {
  Object.keys(src).forEach(k => {
    if (isObj(src[k]) && isObj(target[k])) deepSet(target[k], src[k]);
    else target[k] = Array.isArray(src[k]) ? [...src[k]] : src[k];
  });
}
const OBJ = ['TEMPS', 'COMBOS', 'FIELD_INSIGHTS', 'USE', 'MINI_PROFILE', 'GM_PILLARS', 'GM_CATEGORIES', 'GM_STEP'];
const ARR = ['FUN_FACTS', 'FULL_BENEFITS', 'GM_SCALE'];
const ID = {};
OBJ.forEach(k => { ID[k] = snap(C[k], EN[k]); });
ARR.forEach(k => { ID[k] = [...C[k]]; });
ID.MINI = C.MINI_ROWS.map(r => ({ q: r.q, ...Object.fromEntries(r.options.map(o => [o.type, o.text])) }));
ID.GM_ITEMS = C.GM_ITEMS.map(x => x.q);

function applyContent(lang) {
  const src = lang === 'en' ? EN : ID;
  OBJ.forEach(k => deepSet(C[k], src[k]));
  ARR.forEach(k => C[k].splice(0, C[k].length, ...src[k]));
  C.MINI_ROWS.forEach((r, i) => { r.q = src.MINI[i].q; r.options.forEach(o => { o.text = src.MINI[i][o.type]; }); });
  C.GM_ITEMS.forEach((x, i) => { x.q = src.GM_ITEMS[i]; });
  C.ROWS.forEach(r => r.options.forEach(o => { o.word = lang === 'en' ? o.en : o.wid; o.hint = lang === 'en' ? o.de : o.hid; }));
}

function setLang(lang) {
  LANG = lang === 'en' ? 'en' : 'id';
  applyContent(LANG);
  document.documentElement.lang = LANG;
}
// Jalankan fn dalam bahasa tertentu (dipakai untuk data Sheet yang selalu Indonesia)
function withLang(lang, fn) {
  const prev = LANG;
  if (prev === lang) return fn();
  setLang(lang);
  try { return fn(); } finally { setLang(prev); }
}

const norm = s => s.replace(/\s+/g, ' ').trim();
function tr(s) {
  if (LANG !== 'en' || !s) return s;
  const k = norm(s);
  return UI[k] !== undefined ? UI[k] : s;
}
// Terjemahkan semua teks statis di dalam root
function translateDom(root) {
  if (LANG !== 'en') return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => (n.parentNode && /^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)) || !n.nodeValue.trim() ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const raw = n.nodeValue, k = norm(raw);
    if (UI[k] !== undefined) n.nodeValue = raw.replace(/^(\s*)[\s\S]*?(\s*)$/, `$1${UI[k]}$2`);
  });
  root.querySelectorAll('[placeholder],[aria-label],[alt],[title]').forEach(el => {
    ['placeholder', 'aria-label', 'alt', 'title'].forEach(a => { const v = el.getAttribute(a); if (v && UI[norm(v)] !== undefined) el.setAttribute(a, UI[norm(v)]); });
  });
}

/* ===== scoring.js ===== */
/* Logika skor & analisis. Tidak ada tampilan di sini, jadi gampang dites. */


function tally(answers) {
  const s = { S: 0, C: 0, M: 0, P: 0 };
  const w = { S: 0, C: 0, M: 0, P: 0 };
  answers.forEach((type, i) => {
    if (!type || !(type in s)) return;
    if (i < 20) s[type]++; else w[type]++;
  });
  const t = {};
  ORDER.forEach(k => { t[k] = s[k] + w[k]; });
  return { s, w, t };
}

// Urutan: total tertinggi, lalu kekuatan terbanyak, lalu kelemahan tersedikit, lalu urutan baku
function rank(sc) {
  return [...ORDER].sort((a, b) =>
    (sc.t[b] - sc.t[a]) || (sc.s[b] - sc.s[a]) || (sc.w[a] - sc.w[b]) || (ORDER.indexOf(a) - ORDER.indexOf(b)));
}

function analyze(answers, cfg = CONFIG) {
  const sc = tally(answers);
  const ranking = rank(sc);
  const [p, s, third] = ranking;
  const comboKey = p + s;
  const combo = COMBOS[comboKey];
  const name = k => TEMPS[k].name;

  // ---- skor seri (kasus khusus)
  // Semua pasangan dominan+sekunder yang sah menurut skor total
  const top = ORDER.filter(k => sc.t[k] === sc.t[p]);
  const pairs = [];
  top.forEach(x => {
    const rest = ORDER.filter(k => k !== x);
    const m = Math.max(...rest.map(k => sc.t[k]));
    rest.filter(k => sc.t[k] === m).forEach(y => pairs.push(x + y));
  });
  const alts = pairs.filter(k => k !== comboKey);
  const coDominant = top.length > 1 ? top : [p];
  const coSecondary = top.length === 1 ? ORDER.filter(k => k !== p && sc.t[k] === sc.t[s]) : [];
  const tieType = top.length === 4 ? 'empat_sama' : top.length === 3 ? 'tiga_teratas_sama' : top.length === 2 ? 'dominan_seri'
    : coSecondary.length === 3 ? 'tiga_terbawah_sama' : coSecondary.length === 2 ? 'sekunder_seri' : '';
  const list = arr => arr.map(name).join(', ').replace(/, ([^,]*)$/, L(' dan $1', ' and $1'));
  const ties = [];
  if (tieType === 'dominan_seri') {
    ties.push(L(`Skor ${name(p)} dan ${name(s)} sama (${sc.t[p]}). Dua sisi ini sama kuat, jadi polamu bisa terbaca sebagai ${combo.name} atau ${COMBOS[s + p].name}. `, `${name(p)} and ${name(s)} have the same score (${sc.t[p]}). Both sides are equally strong, so your pattern can be read as ${combo.name} or ${COMBOS[s + p].name}. `) +
      (sc.s[p] > sc.s[s] ? L(`${combo.name} kami tampilkan lebih dulu karena kekuatan ${name(p)} yang kamu pilih lebih banyak.`, `We show ${combo.name} first because you picked more ${name(p)} strengths.`) : L('Urutan di halaman ini hanya urutan tampil.', 'The order on this page is display order only.')));
  } else if (tieType === 'sekunder_seri') {
    ties.push(L(`Skor ${list(coSecondary)} sama (${sc.t[s]}), jadi sisi sekundermu bisa keduanya. Polamu bisa juga terbaca sebagai ${COMBOS[p + coSecondary.find(k => k !== s)].name}.`, `${list(coSecondary)} have the same score (${sc.t[s]}), so your secondary side could be either. Your pattern can also be read as ${COMBOS[p + coSecondary.find(k => k !== s)].name}.`));
  } else if (tieType === 'tiga_terbawah_sama') {
    ties.push(L(`${name(p)} jelas dominan, tapi tiga sisi lainnya punya skor sama (${sc.t[s]}). Sisi sekundermu belum menonjol, jadi ${name(s)} di sini hanya urutan tampil.`, `${name(p)} is clearly primary, but the other three sides have the same score (${sc.t[s]}). Your secondary side doesn’t stand out yet, so ${name(s)} here is display order only.`));
  } else if (tieType === 'tiga_teratas_sama') {
    ties.push(L(`${list(top)} punya skor tertinggi yang sama (${sc.t[p]}). Polamu belum mengerucut ke dua sisi, jadi kombinasi di halaman ini hanya salah satu cara membacanya.`, `${list(top)} share the same top score (${sc.t[p]}). Your pattern hasn’t narrowed to two sides yet, so the combination on this page is just one way to read it.`));
  } else if (tieType === 'empat_sama') {
    ties.push(L(`Keempat temperamen punya skor sama (${sc.t[p]}). Kamu memakai keempat sisi hampir sama rata, jadi kombinasi di halaman ini hanya salah satu cara membacanya.`, `All four temperaments have the same score (${sc.t[p]}). You use all four sides almost equally, so the combination on this page is just one way to read it.`));
  }

  // ---- insight lapangan
  const hit = ORDER.filter(k => sc.t[k] > cfg.fieldThreshold);
  const insights = hit.map(k => {
    let key = k;
    if (k === 'P' && hit.includes('S')) key = 'SP';
    else if (k === 'P' && hit.includes('C')) key = 'CP';
    return { type: k, key, score: sc.t[k], ...FIELD_INSIGHTS[key] };
  }).sort((a, b) => b.score - a.score);

  // ---- penanda pendalaman
  const flags = [];
  ORDER.forEach(k => {
    if (sc.t[k] > cfg.extremeScore) {
      flags.push({ code: 'extreme', level: 'tinggi', type: k,
        internal: `Skor ${name(k)} sangat tinggi (${sc.t[k]}/40)`,
        user: L(`Skor ${name(k)} kamu sangat tinggi (${sc.t[k]} dari 40). Pola sekuat ini menarik untuk dibahas: apakah ini memang dirimu, atau ada sisi yang terpaksa kuat karena keadaan.`, `Your ${name(k)} score is very high (${sc.t[k]} out of 40). A pattern this strong is worth exploring: is this really you, or a side that had to become strong because of circumstances?`) });
    }
  });
  ORDER.forEach(k => {
    if (sc.w[k] - sc.s[k] >= cfg.weaknessGap) {
      flags.push({ code: 'gap', level: 'tinggi', type: k,
        internal: `Kelemahan jauh > kekuatan di ${name(k)} (K${sc.s[k]} / L${sc.w[k]})`,
        user: L(`Di sisi ${name(k)}, kelemahan yang kamu pilih jauh lebih banyak daripada kekuatannya. Ini bisa berkaitan dengan cara kamu memandang diri sendiri atau pengalaman tertentu, dan paling enak dibahas langsung.`, `On your ${name(k)} side, you picked far more weaknesses than strengths. This can relate to how you see yourself or to certain experiences, and is best discussed in person.`) });
    }
  });
  const imbalance = ORDER.reduce((a, k) => a + Math.abs(sc.s[k] - sc.w[k]), 0) / 2;
  if (imbalance >= cfg.imbalanceIndex && !flags.some(f => f.code === 'gap')) {
    flags.push({ code: 'imbalance', level: 'sedang',
      internal: `Indeks ketidakseimbangan K/L tinggi (${imbalance})`,
      user: L('Kekuatan dan kelemahan yang kamu pilih tidak tersebar seimbang di tiap temperamen. Biasanya ada cerita di balik pola seperti ini.', 'The strengths and weaknesses you picked are not evenly spread across the temperaments. There is usually a story behind a pattern like this.') });
  }
  if (combo && combo.natural === false) {
    flags.push({ code: 'opposite', level: 'sedang',
      internal: `Kombinasi berlawanan ${name(p)}/${name(s)} (indikasi topeng)`,
      user: L(`${name(p)} dan ${name(s)} adalah pasangan yang berlawanan. Kadang ini tanda ada satu sisi yang terbentuk karena peran atau tuntutan lingkungan, bukan sifat bawaan.`, `${name(p)} and ${name(s)} are opposites. Sometimes this means one side was shaped by a role or by expectations around you, rather than being natural.`) });
  }
  if (sc.t[s] - sc.t[third] <= cfg.closeThird && sc.t[third] >= cfg.closeThirdMin) {
    flags.push({ code: 'triad', level: 'sedang',
      internal: `Tiga temperamen berdekatan (${name(p)} ${sc.t[p]}, ${name(s)} ${sc.t[s]}, ${name(third)} ${sc.t[third]})`,
      user: L(`Skor ${name(p)}, ${name(s)}, dan ${name(third)} kamu berdekatan. Pola tiga temperamen seperti ini menarik untuk dicek: mana yang bawaan, mana yang terbentuk karena peran.`, `Your ${name(p)}, ${name(s)}, and ${name(third)} scores are close together. A three-temperament pattern like this is worth checking: which is natural, and which was shaped by a role?`) });
  }
  const level = flags.some(f => f.level === 'tinggi') ? 'Tinggi' : flags.length ? 'Sedang' : '';

  // ---- kata yang dipilih
  const picks = { strengths: [], weaknesses: [] };
  answers.forEach((type, i) => {
    const opt = ROWS[i] && ROWS[i].options.find(o => o.type === type);
    if (!opt) return;
    (i < 20 ? picks.strengths : picks.weaknesses).push({ type, word: opt.word });
  });

  return { scores: sc, ranking, primary: p, secondary: s, third, comboKey, combo, ties, alts, tieType, coDominant, coSecondary, insights, flags, level, imbalance, picks };
}

/* ---------- Growth Mindset ----------
   answers: 15 angka 1-5 (urutan GM_ITEMS). Pernyataan fixed dibalik: 6 - jawaban.
   Skor pilar dan total dinormalisasi ke 0-100: (rata-rata - 1) / 4 * 100 */
function analyzeMindset(answers) {
  const pts = GM_ITEMS.map((it, i) => { const v = Number(answers[i]) || 0; return it.f ? 6 - v : v; });
  const pct = arr => Math.round(((arr.reduce((a, b) => a + b, 0) / arr.length) - 1) / 4 * 100);
  const pillars = {};
  GM_PILLAR_ORDER.forEach(k => { pillars[k] = pct(pts.filter((_, i) => GM_ITEMS[i].pillar === k)); });
  const total = pct(pts);
  const category = total >= 75 ? 'growth' : total >= 50 ? 'transition' : 'fixed';
  const level = v => v >= 75 ? 'hi' : v >= 50 ? 'mid' : 'lo';
  const sorted = [...GM_PILLAR_ORDER].sort((a, b) => pillars[b] - pillars[a]);
  const top = pillars[sorted[0]], bottom = pillars[sorted[4]];
  const strongest = top === bottom ? [] : GM_PILLAR_ORDER.filter(k => pillars[k] === top);
  const weakest = top === bottom ? [] : GM_PILLAR_ORDER.filter(k => pillars[k] === bottom);
  // Pemicu fixed: pernyataan fixed yang disetujui (4 atau 5)
  const triggers = GM_ITEMS.map((it, i) => ({ ...it, v: Number(answers[i]) })).filter(x => x.f && x.v >= 4);
  // Pola "growth di kepala, belum di reaksi"
  const reaction = Math.round(['failure', 'challenge', 'criticism', 'others'].reduce((a, k) => a + pillars[k], 0) / 4);
  const beliefGap = pillars.talent - reaction;
  const patterns = [];
  if (beliefGap >= 20) patterns.push('head');
  if (total >= 90) patterns.push('veryhigh');
  return { pillars, total, category, level, sorted, strongest, weakest, triggers, reaction, beliefGap, patterns };
}

/* ---------------- Kartu share 1080 x 1920 (IG Story) ---------------- */
function svgToImage(svg) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
      svg.includes('xmlns') ? svg : svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"'));
  });
}

function wrap(ctx, text, maxW) {
  const words = text.split(' '); const lines = []; let line = '';
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  });
  if (line) lines.push(line);
  return lines;
}

}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

(() => {

  document.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); }, { passive: true });
  document.addEventListener('touchend', e => {
    if (x0 === null) return;

function miniAnalyze(ans) {
  const t = { S: 0, C: 0, M: 0, P: 0 };
  ans.forEach(x => { if (x in t) t[x]++; });
  const ranking = [...ORDER].sort((a, b) => (t[b] - t[a]) || (ORDER.indexOf(a) - ORDER.indexOf(b)));
  const top = ORDER.filter(k => t[k] === t[ranking[0]]);
  return { t, ranking, primary: ranking[0], top };
}

      let bad = false;
      bad = err('name', name.length < 2 ? 'Tulis namamu dulu ya.' : '') || bad;
      bad = err('dob', !dob.value ? 'Isi tanggal lahirmu.' : a == null || a < 0 || a > 110 ? 'Tanggal lahir belum valid.' : a < CONFIG.minAge ? L(`Tes ini untuk usia ${CONFIG.minAge} tahun ke atas.`, `This test is for ages ${CONFIG.minAge} and up.`) : '') || bad;
      const minor = a != null && a >= CONFIG.minAge && a < CONFIG.adultAge;
      bad = err('guardian', minor && guardian.length < 2 ? 'Peserta di bawah 18 tahun wajib menyertakan nama orang tua/wali.' : minor && !f.elements.gconsent.checked ? 'Centang izin orang tua/wali dulu ya.' : '') || bad;
      bad = err('wa', f.elements.wa.value.trim() && !validWA(wa) ? 'Nomor WhatsApp belum valid. Contoh: 0812 3456 7890' : '') || bad;
      if (bad) { const firstBad = f.querySelector('.bad'); firstBad && firstBad.focus(); return; }
      const src = f.querySelector('.pill[aria-pressed="true"]');
      state.profile = {
        name, dob: dob.value, age: a, wa, guardian: a < CONFIG.adultAge ? guardian : '',
        source: src ? src.dataset.src : '', hp: f.elements.website.value ? 1 : 0,
      };
      state.consent = { ...state.consent, guardian: minor ? true : null, contact: !!wa };
      save();
      if (state.mode === 'mini') { if (!state.miniStartedAt) state.miniStartedAt = Date.now(); go('mtest'); return; }
      if (state.mode === 'gm') { if (!state.gmStartedAt) state.gmStartedAt = Date.now(); go('gmtest'); return; }
      go('guide');
    });
  },
  consent() {
    on('back', () => history.back());
    const f = document.getElementById('cf');
    f.addEventListener('submit', e => {
      e.preventDefault();
      const el = document.getElementById('e-consent');
      if (!f.elements.agree.checked) { el.hidden = false; el.textContent = tr('Centang persetujuan dulu untuk lanjut.'); return; }
      state.consent = { ...state.consent, agreed: { ...(state.consent.agreed || {}), [state.mode]: true }, at: new Date().toISOString(), version: CONFIG.consentVersion };
      save(); go('profile');
    });
  },
  test() {
    let locked = false;
    $app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      if (locked) return; locked = true;
      choose(b.dataset.type, b);
    }));
    on('prev', () => {
      if (state.index > 0) { state.index--; save(); render(); }
      else go('guide');
    });
    on('skipnext', () => { state.index++; save(); render(); });
  },
  mtest() {
    let locked = false;
    $app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      if (locked) return; locked = true;
      const i = state.miniIndex;
      state.miniAnswers[i] = b.dataset.type; save();
      $app.querySelectorAll('.opt').forEach(o => { o.classList.toggle('sel', o === b); o.setAttribute('aria-checked', String(o === b)); });
      const bar = $app.querySelector('.track i'); if (bar) bar.style.width = (miniAnswered() * 10) + '%';
      setTimeout(() => {
        const n = state.miniAnswers.findIndex(x => !x);
        if (n === -1) { finishMini(); return; }
        state.miniIndex = i < 9 ? i + 1 : n; save(); render();
      }, 240);
    }));
    on('prev', () => { if (state.miniIndex > 0) { state.miniIndex--; save(); render(); } else go('profile'); });
  },
  gmtest() {
    let locked = false;
    $app.querySelectorAll('.lk').forEach(b => b.addEventListener('click', () => {
      if (locked) return; locked = true;
      const i = state.gmIndex;
      state.gmAnswers[i] = Number(b.dataset.v); save();
      $app.querySelectorAll('.lk').forEach(o => { o.classList.toggle('sel', o === b); o.setAttribute('aria-checked', String(o === b)); });
      const bar = $app.querySelector('.track i'); if (bar) bar.style.width = (gmAnswered() / 15 * 100) + '%';
      setTimeout(() => {
        const n = state.gmAnswers.findIndex(x => !x);
        if (n === -1) { finishGm(); return; }
        state.gmIndex = i < 14 ? i + 1 : n; save(); render();
      }, 240);
    }));
    on('prev', () => { if (state.gmIndex > 0) { state.gmIndex--; save(); render(); } else go('profile'); });
    on('skipnext', () => { state.gmIndex++; save(); render(); });
  },
  gmresult() {
    on('home', () => go('home'));
    on('pdf', () => window.print());
    on('share', async btn => {
      btn.disabled = true;
      try {
        const r = state.gmResult, a = analyzeMindset(r.answers), cat = GM_CATEGORIES[a.category];
        const blob = await gmCard({ nickname: nickname(r.profile.name), dateLabel: fmtDate(r.finishedAt), total: a.total, cat,
          pillars: GM_PILLAR_ORDER.map(k => ({ name: GM_PILLARS[k].name, color: GM_PILLARS[k].color, v: a.pillars[k] })) });
        await deliverImage(blob, 'mengapa-growth-mindset.png');

      finally { btn.disabled = false; }
    });
    on('again', () => { state.mode = 'gm'; resetGm(); save(); go('consent'); });
  },
  mresult() {
    on('home', () => go('home'));
    on('pdf', () => window.print());
    on('full', () => go('token'));
    on('again', () => { state.mode = 'mini'; resetMini(); save(); go('consent'); });
    on('share', async btn => {
      btn.disabled = true;
      try {
        const r = state.miniResult, a = miniAnalyze(r.answers), P = TEMPS[a.primary];
        const blob = await shareCard({ mini: true, profile: { nickname: nickname(r.profile.name) }, dateLabel: fmtDate(r.finishedAt),
          analysis: { primary: a.primary, secondary: a.primary, combo: { name: P.name, tagline: `${P.title}. ${P.motto}` }, scores: { t: a.t } } });
        await deliverImage(blob, `mengapa-mini-${P.name.toLowerCase()}.png`, L(`Temperamen dominanku ${P.name}. Kamu yang mana? ${CONFIG.site}`, `My primary temperament is ${P.name}. What's yours? ${CONFIG.site}`));
      } catch (e) { if (e && e.name !== 'AbortError') toast('Gagal membuat gambar. Coba lagi ya.'); }
      finally { btn.disabled = false; }
    });
  },
  interlude() { on('cont', () => { state.interludeSeen = true; state.index = 20; go('test', false); }); },
  calc() {},
  result() {
    on('home', () => go('home'));
    on('pdf', () => window.print());
    on('share', async btn => {
      btn.disabled = true;
      try {
        const r = state.result, a = analyze(r.answers);
        const blob = await shareCard({ profile: { nickname: nickname(r.profile.name) }, analysis: a, dateLabel: fmtDate(r.finishedAt) });
        await deliverImage(blob, `mengapa-${a.combo.name.toLowerCase().replace(/\s+/g, '-')}.png`, L(`Hasil tesku: ${a.combo.name} (${TEMPS[a.primary].name} + ${TEMPS[a.secondary].name}). Kamu yang mana? ${CONFIG.site}`, `My result: ${a.combo.name} (${TEMPS[a.primary].name} + ${TEMPS[a.secondary].name}). What's yours? ${CONFIG.site}`));
      } catch (e) {
        if (e && e.name !== 'AbortError') toast('Gagal membuat gambar. Coba lagi ya.');
      } finally { btn.disabled = false; }
    });
  },
};
async function deliverImage(blob, filename) {
  const file = new File([blob], filename, { type: 'image/png' });
  const phone = matchMedia('(pointer:coarse)').matches;
  if (phone && navigator.canShare && navigator.canShare({ files: [file] })) {
    await navigator.share({ files: [file] });
  } else {
    const url = URL.createObjectURL(blob);
    const link = Object.assign(document.createElement('a'), { href: url, download: filename });
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Gambar tersimpan.');
  }
}
function on(act, fn) { $app.querySelectorAll(`[data-act="${act}"]`).forEach(el => el.addEventListener('click', e => fn(el, e))); }

/* ---------- memilih jawaban ---------- */
function choose(type, btn) {
  const i = state.index;
  state.answers[i] = type;
  save();
  $app.querySelectorAll('.opt').forEach(o => { const on = o === btn; o.classList.toggle('sel', on); o.setAttribute('aria-checked', String(on)); });
  const bar = $app.querySelector('.track i'); if (bar) bar.style.width = (answered() / 40 * 100) + '%';
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) { /* abaikan */ } }
  setTimeout(() => {
    if (i === 19 && !state.interludeSeen) { state.index = 20; go('interlude', false); return; }
    const nextEmpty = state.answers.findIndex(x => !x);
    if (nextEmpty === -1) { finish(); return; }
    state.index = i < 39 ? i + 1 : nextEmpty;
    save(); render();
  }, 240);
}

document.addEventListener('keydown', e => {
  if (!['test', 'mtest', 'gmtest'].includes(state.screen) || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 5) { const b = $app.querySelectorAll('.opt, .lk')[n - 1]; b && b.click(); }
  if (e.key === 'ArrowLeft' || e.key === 'Backspace') { const b = $app.querySelector('[data-act="prev"]'); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
});

/* ---------- selesai ---------- */
function finish() {
  const now = Date.now();
  const r = {
    id: makeId(), answers: [...state.answers], profile: { ...state.profile }, consent: { ...state.consent },
    startedAt: state.startedAt, finishedAt: now, meta: { ...state.meta }, token: state.token,
  };
  const preview = state.preview;
  state.result = r; state.tokenOk = false; state.token = ''; state.preview = false; state.calcNext = 'result';
  resetFull(); clearConsent('full'); save();
  go('calc', false);
  if (!preview) submit(withLang('id', () => buildPayload(r)));
  setTimeout(() => { history.replaceState({ s: 'result' }, ''); go('result', false); }, 1600);
}

function finishGm() {
  const now = Date.now();
  const r = { id: makeId(), answers: [...state.gmAnswers], profile: { ...state.profile }, consent: { ...state.consent },
    startedAt: state.gmStartedAt, finishedAt: now, meta: { ...state.meta } };
  state.gmResult = r; state.calcNext = 'gmresult'; resetGm(); clearConsent('gm'); save();
  go('calc', false);
  submit(withLang('id', () => buildGmPayload(r)));
  setTimeout(() => { history.replaceState({ s: 'gmresult' }, ''); go('gmresult', false); }, 1400);
}
function buildGmPayload(r) {
  const a = analyzeMindset(r.answers), d = new Date(r.finishedAt), pad = n => String(n).padStart(2, '0');

    kategori: GM_CATEGORIES[a.category].name, skor_total: a.total,
    pilar_mindset_dasar: a.pillars.talent, pilar_kegagalan: a.pillars.failure, pilar_tantangan: a.pillars.challenge,

    pola_growth_di_kepala: a.patterns.includes('head') ? 'YA' : 'TIDAK',
    jumlah_pemicu_fixed: a.triggers.length,

    durasi_detik: dur,

    ref: r.meta.ref || '', utm_source: r.meta.utm_source || '', utm_medium: r.meta.utm_medium || '',
    utm_campaign: r.meta.utm_campaign || '', referrer: r.meta.referrer || '',
    perangkat: navigator.userAgent.slice(0, 180),

  return { row, hp: r.profile.hp || 0 };
}

function finishMini() {
  const now = Date.now();
  const r = {
    id: makeId(), answers: [...state.miniAnswers], profile: { ...state.profile }, consent: { ...state.consent },
    startedAt: state.miniStartedAt, finishedAt: now, meta: { ...state.meta },
  };
  state.miniResult = r; state.calcNext = 'mresult'; resetMini(); clearConsent('mini'); save();
  go('calc', false);
  submit(withLang('id', () => buildMiniPayload(r)));
  setTimeout(() => { history.replaceState({ s: 'mresult' }, ''); go('mresult', false); }, 1400);
}

function buildMiniPayload(r) {
  const a = miniAnalyze(r.answers), d = new Date(r.finishedAt), pad = n => String(n).padStart(2, '0');
  const row = {
    id: r.id, jenis_tes: 'mini',

    sanguinis: a.t.S, koleris: a.t.C, melankolis: a.t.M, plegmatis: a.t.P,

    perangkat: navigator.userAgent.slice(0, 180),

}

function buildPayload(r) {
  const a = analyze(r.answers), sc = a.scores, d = new Date(r.finishedAt);
  const dur = r.startedAt ? Math.round((r.finishedAt - r.startedAt) / 1000) : '';
  const pad = n => String(n).padStart(2, '0');
  const row = {
    id: r.id, jenis_tes: 'lengkap', token: r.token || '',
    waktu_iso: d.toISOString(),
    tanggal_tes: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
    jam_tes: `${pad(d.getHours())}:${pad(d.getMinutes())}`,
    zona_waktu: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
    nama: r.profile.name, tanggal_lahir: r.profile.dob, usia: r.profile.age,
    whatsapp: r.profile.wa || '', boleh_dihubungi: r.consent.contact ? 'YA' : 'TIDAK',
    nama_wali: r.profile.guardian || '', sumber: r.profile.source || '',
    dominan: TEMPS[a.primary].name, sekunder: TEMPS[a.secondary].name,
    kombinasi: a.combo.name, kode_kombinasi: a.comboKey, kombinasi_alami: a.combo.natural ? 'YA' : 'TIDAK',
  };
  ORDER.forEach(k => {
    const n = TEMPS[k].name.toLowerCase();
    row[`${n}_kekuatan`] = sc.s[k]; row[`${n}_kelemahan`] = sc.w[k]; row[`${n}_total`] = sc.t[k];
    row[`${n}_kata_kekuatan`] = a.picks.strengths.filter(x => x.type === k).map(x => x.word).join(', ');
    row[`${n}_kata_kelemahan`] = a.picks.weaknesses.filter(x => x.type === k).map(x => x.word).join(', ');
  });
  Object.assign(row, {
    pendalaman: a.level || '',
    alasan_pendalaman: a.flags.map(f => f.internal).join(' | '),
    indeks_ketidakseimbangan: a.imbalance,
    insight_lapangan: a.insights.map(x => `${x.title} (${x.score})`).join(' | '),
    jenis_seri: a.tieType, kombinasi_alternatif: a.alts.join(', '),
    catatan_seri: a.ties.join(' | '),
    jawaban: r.answers.join(''),
    durasi_detik: dur,
    terlalu_cepat: dur !== '' && dur < CONFIG.tooFastSeconds ? 'YA' : 'TIDAK',
    versi_tes: CONFIG.testVersion, versi_persetujuan: r.consent.version, persetujuan_waktu: r.consent.at,
    ref: r.meta.ref || '', utm_source: r.meta.utm_source || '', utm_medium: r.meta.utm_medium || '',
    utm_campaign: r.meta.utm_campaign || '', referrer: r.meta.referrer || '',
    perangkat: navigator.userAgent.slice(0, 180),
  });
  return { row, hp: r.profile.hp || 0, session: state.session };
}

/* ---------- kirim ke Google Sheet (via /api/submit), dengan antrean ulang ---------- */
async function post(payload) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 12000);
  try {
    const res = await fetch(CONFIG.submitEndpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload), signal: ctl.signal, keepalive: true,
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json().catch(() => ({}));
    if (j.ok === false && j.error === 'token') return true; // token ditolak server: jangan dicoba ulang terus
    if (j.ok === false) throw new Error(j.error || 'gagal');
    return true;
  } finally { clearTimeout(t); }
}
async function checkToken(tok) {
  if (!state.session) { state.session = makeId() + makeId().slice(4); save(); }
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 12000);
  try {
    if (location.protocol === 'file:') throw new Error('lokal');
    const res = await fetch(CONFIG.submitEndpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'token', token: tok, session: state.session }), signal: ctl.signal,
    });
    const j = await res.json();
    if (typeof j.ok !== 'boolean') throw new Error('bukan server tes');
    return j.ok ? { ok: true } : { ok: false, reason: j.reason || 'server' };
  } catch (e) {
    // Server belum terpasang (preview): token contoh boleh dipakai, hasil tidak disimpan
    const prod = /(^|\.)mengapa\.me$|\.vercel\.app$/.test(location.hostname);
    if (!prod && CONFIG.previewToken && tok === CONFIG.previewToken) return { ok: true, preview: true };
    return { ok: false, reason: 'network' };
  } finally { clearTimeout(t); }
}
async function submit(payload) {
  if (location.protocol === 'file:') { queue(payload); return; }
  try { await post(payload); } catch (e) { queue(payload); }
}
function queue(p) {
  const q = store.get(QKEY) || [];
  if (!q.some(x => x.row.id === p.row.id)) q.push(p);
  store.set(QKEY, q.slice(-20));
}
async function flush() {
  if (location.protocol === 'file:') return;
  const q = store.get(QKEY) || [];
  if (!q.length) return;
  const left = [];
  for (const p of q) { try { await post(p); } catch (e) { left.push(p); } }
  store.set(QKEY, left);
}

/* ---------- mulai ---------- */
{ const q = (params.get('lang') || '').toLowerCase(); const saved = store.get('mengapa:lang'); setLang(q === 'en' || q === 'id' ? q : saved || 'id'); if (q) store.set('mengapa:lang', LANG); }
if (state.screen === 'calc') state.screen = state.calcNext || 'home';
if (state.screen === 'interlude') state.screen = 'test';
if (state.screen === 'test' && !(state.tokenOk && agreed('full'))) state.screen = 'home';
if (state.screen === 'mtest' && !agreed('mini')) state.screen = 'home';
if (state.screen === 'gmtest' && !agreed('gm')) state.screen = 'home';
if (state.screen === 'gmresult' && !state.gmResult) state.screen = 'home';
if (state.screen === 'result' && !state.result) state.screen = 'home';
if (state.screen === 'mresult' && !state.miniResult) state.screen = 'home';
if (!['result', 'mresult', 'test', 'mtest', 'gmresult', 'gmtest'].includes(state.screen)) state.screen = 'home';
if (URL_TOKEN && !(state.tokenOk && state.token === URL_TOKEN)) state.screen = 'token';
history.replaceState({ s: state.screen }, '');
render();
setTimeout(flush, 1500);
window.addEventListener('online', flush);
