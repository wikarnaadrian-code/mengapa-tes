  const oMix = Object.entries(oCount).filter(([k]) => k.includes('+')).sort((a, b) => b[1] - a[1]);
  const oNone = oCount['Belum terlihat'] || 0;
  return { n, oavg: Object.fromEntries(WO_ORDER.map(d => [d, oavg(d)])), oSingles, oMix, oMixN: oMix.reduce((s, [, v]) => s + v, 0), oNone,
    avg: Object.fromEntries(PK_ORDER.map(d => [d, avg(d)])), singles, ties, tieList: Object.entries(domCount).filter(([k]) => k.includes('&')).sort((a, b) => b[1] - a[1]) };
}

function byJob(xs) {
  const g = {};
  xs.forEach(x => { const k = jobKey(x.job); (g[k] = g[k] || { name: x.job, xs: [] }).xs.push(x); });
  return Object.values(g).map(o => ({ ...o, s: summary(o.xs) })).sort((a, b) => b.xs.length - a.xs.length || a.name.localeCompare(b.name));
}

const th = (k, label, cls = '') => `<th class="${cls}"><button data-sort="${k}" aria-pressed="${S.sort === k}">${label}${S.sort === k ? (S.dir > 0 ? ' ↑' : ' ↓') : ''}</button></th>`;
const cell = (x, d) => `<td class="num c-${d}${x.a.dominant.includes(d) ? ' hi' : ''}" data-l="${PK_DIMS[d].name}" style="--c:${PK_DIMS[d].color}">${pkNum(x.a.avg[d])}</td>`;

const kKey = x => x.a.dominant.length === 1 ? x.a.dominant[0] : 'X';
const oKey = x => x.o.dominant.length === 1 ? x.o.dominant[0] : 'X';
const distRow = (label, sub, n, total, max, color) => `<div class="pka-row" style="--c:${color}"><span>${label}${sub ? `<small>${sub}</small>` : ''}</span><div class="pka-rail"><i style="width:${max ? n / max * 100 : 0}%"></i></div><b>${n}</b><em>${pct(n, total)}%</em></div>`;
const oPill = x => `<span class="pka-dom pka-ori"${x.o.dominant.length === 1 ? ` style="--c:${WO_DIMS[x.o.dominant[0]].color}"` : ''}>${esc(x.ori)}</span>`;

function app() {
  const all = S.rows || [], bs = base(), xs = filtered(), s = summary(bs), jobs = byJob(all), groups = byJob(bs);
  const days = [...new Set(all.map(x => dayOf(x.iso)).filter(Boolean))];
  const domCnt = {}, oriCnt = {}; bs.forEach(x => { domCnt[x.dom] = (domCnt[x.dom] || 0) + 1; oriCnt[x.ori] = (oriCnt[x.ori] || 0) + 1; });
  const domOpts = [...PK_ORDER.map(d => PK_DIMS[d].name), ...Object.keys(domCnt).filter(k => k.includes('&')).sort()];
  const oriOpts = [...WO_ORDER.map(d => WO_DIMS[d].name), ...Object.keys(oriCnt).filter(k => !WO_ORDER.some(d => WO_DIMS[d].name === k)).sort()];
  const scope = [S.job ? (jobs.find(j => jobKey(j.name) === S.job) || {}).name : '', S.day !== 'all' ? S.day : ''].filter(Boolean).join(' · ');
  const maxDom = Math.max(1, ...s.singles.map(o => o.n), s.ties), maxOri = Math.max(1, ...s.oSingles.map(o => o.n), s.oMixN, s.oNone);
  // tabel silang komitmen × orientasi
  const KR = [...PK_ORDER, 'X'], OC = [...WO_ORDER, 'X'], cross = {}; bs.forEach(x => { const k = kKey(x) + oKey(x); cross[k] = (cross[k] || 0) + 1; });
  const crossMax = Math.max(1, ...Object.values(cross));
  const kLabel = k => k === 'X' ? 'Seri' : PK_DIMS[k].name, oLabel = k => k === 'X' ? 'Kombinasi / lainnya' : WO_DIMS[k].name;
  return `
  <div class="pka">
    <header class="pka-top">
      <div class="pk-brand">${logoHtml}<span class="pk-x">×</span>${hkLogo}</div>
      <div class="pka-actions">
        <span class="pka-status" id="status">${S.loading ? 'Memuat…' : S.at ? `Diperbarui ${new Date(S.at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}` : ''}</span>
        <button class="btn ghost sm" data-act="reload" id="reloadbtn"${S.loading ? ' disabled' : ''}>${S.loading ? '<span class="spin-s"></span>Memuat…' : 'Muat ulang'}</button>
        <button class="btn ghost sm" data-act="csv">Unduh CSV</button>
        <button class="btn ghost sm" data-act="logout">Keluar</button>
      </div>
    </header>
    <div class="pka-head">
      <h1>Hasil Tes Pandangan Kerja</h1>
      ${S.err ? `<p class="err">${esc(S.err)}</p>` : ''}
    </div>

    <div class="pka-filters">
      <span class="pka-flabel">Tampilkan data</span>
      <select class="input" id="fjob" aria-label="Jabatan"><option value="">Semua jabatan (${all.length})</option>${jobs.map(j => `<option value="${esc(jobKey(j.name))}" ${S.job === jobKey(j.name) ? 'selected' : ''}>${esc(j.name)} (${j.xs.length})</option>`).join('')}</select>
      ${days.length > 1 ? `<select class="input" id="fday" aria-label="Tanggal"><option value="all">Semua tanggal</option>${days.map(d => `<option ${S.day === d ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select>` : ''}
      ${S.job || S.day !== 'all' ? '<button class="linkbtn" data-act="clearTop">Tampilkan semua</button>' : ''}
    </div>

    <section class="pka-kpi one">
      <div class="pka-card"><small>Peserta</small><b>${s.n}</b><span>${all.length !== s.n ? `${esc(scope)} · ${pct(s.n, all.length)}% dari ${all.length}` : 'total masuk'}</span></div>
    </section>
    <div class="pka-sec">Bagian 1 · Alasan bertahan <small>rata-rata skala 1 sampai 5</small></div>
    <section class="pka-kpi three">
      ${PK_ORDER.map(d => `<div class="pka-card" style="--c:${PK_DIMS[d].color};--soft:${PK_DIMS[d].soft}"><small><i class="pk-dot"></i>${PK_DIMS[d].name}</small><b>${s.n ? pkNum(s.avg[d]) : '-'}</b><span>${s.n ? pkLevel(s.avg[d]) : ''}</span></div>`).join('')}
    </section>
    <div class="pka-sec">Bagian 2 · Cara memandang pekerjaan <small>rata-rata skala 0 sampai 3</small></div>
    <section class="pka-kpi three">
      ${WO_ORDER.map(d => { const o = s.oSingles.find(x => x.d === d); return `<div class="pka-card" style="--c:${WO_DIMS[d].color};--soft:${WO_DIMS[d].soft}"><small><i class="pk-dot"></i><em>${WO_DIMS[d].name}</em> · ${WO_DIMS[d].sub}</small><b>${s.n ? pkNum(s.oavg[d]) : '-'}</b><span>${s.n ? `${o.n} orang paling mirip (${pct(o.n, s.n)}%)` : ''}</span></div>`; }).join('')}
    </section>

    <div class="pka-grid">
      <section class="pka-card pka-panel">
        <h2>Komitmen dominan</h2>
        <p class="muted small">Bagian 1. Komitmen dengan rata-rata tertinggi tiap peserta.</p>
        <div class="pka-dist">
          ${s.singles.map(o => distRow(o.label, `"${PK_DIMS[o.d].quote}"`, o.n, s.n, maxDom, PK_DIMS[o.d].color)).join('')}
          ${s.ties ? distRow('Seri', s.tieList.map(([k, v]) => `${esc(k)} (${v})`).join(', '), s.ties, s.n, maxDom, '#9A9A96') : ''}
        </div>
      </section>
      <section class="pka-card pka-panel">
        <h2>Orientasi dominan</h2>
        <p class="muted small">Bagian 2. Gambaran yang dinilai paling mirip oleh tiap peserta.</p>
        <div class="pka-dist">
          ${s.oSingles.map(o => distRow(`<em>${o.label}</em>`, WO_DIMS[o.d].sub, o.n, s.n, maxOri, WO_DIMS[o.d].color)).join('')}
          ${s.oMixN ? distRow('Kombinasi', s.oMix.map(([k, v]) => `${esc(k)} (${v})`).join(', '), s.oMixN, s.n, maxOri, '#9A9A96') : ''}
          ${s.oNone ? distRow('Belum terlihat', 'semua gambaran dinilai tidak mirip', s.oNone, s.n, maxOri, '#C9C9C4') : ''}
        </div>
      </section>
    </div>

    <section class="pka-card pka-panel">
      <h2>Komitmen × orientasi</h2>
      <p class="muted small">Jumlah peserta per kombinasi komitmen dominan (baris) dan orientasi dominan (kolom), dengan persen dari ${s.n} peserta. Klik angka untuk melihat orangnya di daftar peserta.</p>
      <div class="pka-scroll"><table class="pka-t pka-x">
        <thead><tr><th></th>${OC.map(c => `<th class="num" style="--c:${c === 'X' ? '#9A9A96' : WO_DIMS[c].color}">${c === 'X' ? oLabel(c) : `<em>${oLabel(c)}</em>`}</th>`).join('')}<th class="num">Total</th></tr></thead>
        <tbody>${KR.map(r => { const tot = OC.reduce((t, c) => t + (cross[r + c] || 0), 0); if (r === 'X' && !tot) return ''; return `<tr><td><b style="color:${r === 'X' ? 'inherit' : PK_DIMS[r].color}">${kLabel(r)}</b></td>${OC.map(c => { const v = cross[r + c] || 0; return `<td class="num"><button class="pka-cell" ${v ? `data-cross="${r}${c}"` : 'disabled'} style="--a:${v / crossMax}">${v ? `<b>${v}</b><small>${pct(v, s.n)}%</small>` : '<span>-</span>'}</button></td>`; }).join('')}<td class="num"><b>${tot}</b> <small class="muted">${pct(tot, s.n)}%</small></td></tr>`; }).join('')}</tbody>
      </table></div>
    </section>

    <section class="pka-card pka-panel">
      <h2>Per jabatan</h2>
      <div class="pka-scroll"><table class="pka-t">
        <thead><tr><th>Jabatan</th><th class="num">Peserta</th>${PK_ORDER.map(d => `<th class="num">${PK_DIMS[d].name}</th>`).join('')}<th>Komitmen terbanyak</th><th>Orientasi terbanyak</th></tr></thead>
        <tbody>${groups.length ? groups.map(g => { const top = arr => { const m = Math.max(...arr.map(x => x.n)), w = arr.filter(x => x.n === m); return { n: m, label: w.map(x => x.label).join(', ') + (w.length > 1 && m ? ' <small class="muted">masing-masing</small>' : '') }; };
          const best = top(g.s.singles), ob = top(g.s.oSingles);
          const topAvg = Math.max(...PK_ORDER.map(d => g.s.avg[d]));
          return `<tr><td><b>${esc(g.name)}</b></td><td class="num">${g.xs.length} <small class="muted">(${pct(g.xs.length, s.n)}%)</small></td>${PK_ORDER.map(d => `<td class="num${g.s.avg[d] === topAvg ? ' hi' : ''}" style="--c:${PK_DIMS[d].color}">${pkNum(g.s.avg[d])}</td>`).join('')}<td>${best.n ? `${best.label} <small class="muted">${best.n} dari ${g.xs.length} (${pct(best.n, g.xs.length)}%)</small>` : `Seri <small class="muted">${g.s.ties} orang</small>`}</td><td>${ob.n ? `${ob.label} <small class="muted">${ob.n} dari ${g.xs.length} (${pct(ob.n, g.xs.length)}%)</small>` : `Kombinasi <small class="muted">${g.xs.length} orang</small>`}</td></tr>`; }).join('') : '<tr><td colspan="7" class="muted">Belum ada data.</td></tr>'}</tbody>
      </table></div>
    </section>

    <section class="pka-card pka-panel">
      <div class="pka-tools">
        <div class="pka-tools-h"><h2>Peserta <small class="muted">${xs.length === bs.length ? xs.length : `${xs.length} dari ${bs.length}`}</small></h2>
          <input class="input pka-q" id="q" type="search" placeholder="Cari nama atau jabatan" value="${esc(S.q)}" autocomplete="off" /></div>
        <div class="pka-chips" role="group" aria-label="Komitmen dominan"><span class="pka-chl">Komitmen</span>
          <button data-dom="" aria-pressed="${!S.dom}">Semua <small>${bs.length}</small></button>
          ${domOpts.map(o => { const d = PK_ORDER.find(k => PK_DIMS[k].name === o); return `<button data-dom="${esc(o)}" aria-pressed="${S.dom === o}" style="--c:${d ? PK_DIMS[d].color : '#9A9A96'}">${d ? '<i class="pk-dot"></i>' : ''}${esc(o)} <small>${domCnt[o] || 0}</small></button>`; }).join('')}
        </div>
        <div class="pka-chips" role="group" aria-label="Orientasi dominan"><span class="pka-chl">Orientasi</span>
          <button data-ori="" aria-pressed="${!S.ori}">Semua <small>${bs.length}</small></button>
          ${oriOpts.map(o => { const d = WO_ORDER.find(k => WO_DIMS[k].name === o); return `<button data-ori="${esc(o)}" aria-pressed="${S.ori === o}" style="--c:${d ? WO_DIMS[d].color : '#9A9A96'}">${d ? '<i class="pk-dot"></i>' : ''}${esc(o)} <small>${oriCnt[o] || 0}</small></button>`; }).join('')}
        </div>
      </div>
      <p class="muted small">Klik baris untuk melihat jawaban per pertanyaan. Klik judul kolom untuk mengurutkan. Angka tebal berwarna = komitmen tertinggi orang itu.</p>
      <div class="pka-scroll pka-people-wrap"><table class="pka-t pka-people">
        <thead><tr>${th('name', 'Nama')}${th('job', 'Jabatan')}${PK_ORDER.map(d => th(d, PK_DIMS[d].name, 'num')).join('')}${th('dom', 'Komitmen')}${th('ori', 'Orientasi')}${th('time', 'Waktu')}</tr></thead>
        <tbody>${xs.length ? xs.map(x => `
          <tr class="pka-p${S.open === x.id ? ' open' : ''}" data-id="${esc(x.id)}"><td class="c-name"><b>${esc(x.name)}</b></td><td class="c-job">${esc(x.job)}</td>${PK_ORDER.map(d => cell(x, d)).join('')}<td class="c-dom"><span class="pka-dom">${esc(x.dom)}</span></td><td class="c-ori">${oPill(x)}</td><td class="c-time muted nowrap">${esc(fmt(x.iso))}</td></tr>
          ${S.open === x.id ? `<tr class="pka-detail"><td colspan="8">${detail(x)}</td></tr>` : ''}`).join('') : `<tr><td colspan="8" class="muted">${S.rows && S.rows.length ? 'Tidak ada peserta yang cocok. <button class="linkbtn" data-act="clear">Hapus pencarian dan filter</button>' : 'Belum ada peserta yang menyelesaikan tes.'}</td></tr>`}</tbody>
      </table></div>
    </section>
    <footer class="foot"><span class="tag">dari "mengapa" jadi tahu harus apa</span>© ${new Date().getFullYear()} Mengapa · <a href="https://instagram.com/mengapa.me" target="_blank" rel="noopener">@mengapa.me</a><span class="ver">Tes Pandangan Kerja v${PK_VERSION}</span></footer>
  </div>`;
}

function detail(x) {
  return `<div class="pka-ans">${PK_ORDER.map(d => `<div class="pka-ans-g" style="--c:${PK_DIMS[d].color}">
    <b><i class="pk-dot"></i>${PK_DIMS[d].name} · ${pkNum(x.a.avg[d])}</b>
    <ol>${PK_ITEMS.map((it, i) => it.d === d ? `<li><span class="pka-v v${x.ans[i]}" title="${PK_SCALE[x.ans[i] - 1]}">${x.ans[i]} ${PK_SCALE_SHORT[x.ans[i] - 1]}</span><span>${i + 1}. ${esc(it.q)}</span></li>` : '').join('')}</ol>
  </div>`).join('')}
  <div class="pka-ans-wo"><b>Bagian 2 · Cara memandang pekerjaan · ${esc(x.ori)}</b>
    <div class="pka-wo">${WO_ITEMS.map((it, i) => { const D = WO_DIMS[it.d], v = x.o.sc[it.d]; return `<div class="pka-wo-i${x.o.dominant.includes(it.d) ? ' on' : ''}" style="--c:${D.color}"><span><em>${D.name}</em> (gambaran ${it.who})</span><strong>${WO_LEVEL(v)}</strong><small>${v} dari 3 · ${x.o.pct[it.d]}%</small></div>`; }).join('')}</div>
  </div>
  <p class="small muted">Kode ${esc(x.id)}${x.dur ? ` · durasi ${Math.max(1, Math.round(x.dur / 60))} menit` : ''}</p></div>`;
}

function csv() {
  const xs = filtered(), q = v => `"${String(v ?? '').replace(/"/g, '""')}"`; // pemisah titik koma: cocok untuk Excel berbahasa Indonesia
  const head = ['Nama', 'Jabatan', 'Afektif', 'Berkelanjutan', 'Normatif', 'Komitmen dominan', 'Job (0-3)', 'Career (0-3)', 'Calling (0-3)', 'Orientasi dominan', 'Waktu', 'Kode', ...PK_ITEMS.map((_, i) => 'P' + (i + 1))];
  const lines = [head.map(q).join(';'), ...xs.map(x => [x.name, x.job, pkNum(x.a.avg.A), pkNum(x.a.avg.B), pkNum(x.a.avg.N), x.dom, x.o.sc.J, x.o.sc.R, x.o.sc.C, x.ori, fmt(x.iso), x.id, ...x.ans].map(q).join(';'))];
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'hkgold-pandangan-kerja.csv' });
  document.body.appendChild(a); a.click(); a.remove();
}

function paintStatus() { const rb = document.getElementById('reloadbtn'); if (rb) { rb.disabled = !!S.loading; rb.innerHTML = S.loading ? '<span class="spin-s"></span>Memuat…' : 'Muat ulang'; } const el = document.getElementById('status'); if (el) el.textContent = S.loading ? 'Memuat…' : S.at ? `Diperbarui ${new Date(S.at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}` : ''; }

function render() {
  if (!S.session) {
    $app.innerHTML = login();
    const f = document.getElementById('lf');
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('lbtn'), er = document.getElementById('lerr');
      btn.disabled = true; btn.textContent = 'Memeriksa…'; er.hidden = true;
      const user = f.elements.user.value, pass = f.elements.pass.value;
      try {
        let j, hk = false;
        try { j = await api({ action: 'login', user, pass }); }
        catch (e1) {
          try { j = await api({ client: 'HKGold', action: 'login', user, pass }); hk = true; }
          catch (e2) { throw e1; }
        }
        S.session = j.session; session.set(j.session, j.hours || 12, hk); S.err = ''; load();
      } catch (err) { er.hidden = false; er.textContent = err.message; btn.disabled = false; btn.textContent = 'Masuk'; }
    });
    return;
  }
  if (!S.rows) { $app.innerHTML = `<main class="login"><p class="muted">${S.err ? esc(S.err) : 'Memuat data…'}</p></main>`; return; }
  const focus = document.activeElement && document.activeElement.id, pos = focus === 'q' ? document.activeElement.selectionStart : null;
  $app.innerHTML = app();
  const qi = document.getElementById('q');
  if (focus === 'q') { qi.focus(); try { qi.setSelectionRange(pos, pos); } catch (e) { /* abaikan */ } }
  qi.addEventListener('input', () => { S.q = qi.value; render(); });
  document.getElementById('fjob').addEventListener('change', e => { S.job = e.target.value; render(); });
  $app.querySelectorAll('[data-dom]').forEach(b => b.addEventListener('click', () => { S.dom = b.dataset.dom; render(); }));
  $app.querySelectorAll('[data-ori]').forEach(b => b.addEventListener('click', () => { S.ori = b.dataset.ori; render(); }));
  $app.querySelectorAll('[data-cross]').forEach(b => b.addEventListener('click', () => {
    const [k, o] = b.dataset.cross.split('');
    S.dom = k === 'X' ? '' : PK_DIMS[k].name; S.ori = o === 'X' ? '' : WO_DIMS[o].name; S.q = ''; render();
    const t = $app.querySelector('.pka-tools'); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
  const fd = document.getElementById('fday'); if (fd) fd.addEventListener('change', e => { S.day = e.target.value; render(); });
  const act = (a, fn) => { const el = $app.querySelector(`[data-act="${a}"]`); if (el) el.addEventListener('click', fn); };
  act('reload', load); act('logout', logout); act('csv', csv);
  act('clear', () => { S.q = ''; S.dom = ''; S.ori = ''; render(); });
  act('clearTop', () => { S.job = ''; S.day = 'all'; render(); });
  $app.querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.sort; if (S.sort === k) S.dir *= -1; else { S.sort = k; S.dir = ['time', 'A', 'B', 'N'].includes(k) ? -1 : 1; } render(); }));
  // header tabel peserta menempel tepat di bawah toolbar; toolbar diberi bayangan saat menempel
  const tools = $app.querySelector('.pka-tools');
  if (tools) {
    const setTop = () => $app.querySelector('.pka-people').style.setProperty('--th-top', tools.offsetHeight + 'px');
    setTop();
    if (!render.ro && 'ResizeObserver' in window) render.ro = new ResizeObserver(setTop);
    if (render.ro) { render.ro.disconnect(); render.ro.observe(tools); }
    const onScroll = () => tools.classList.toggle('stuck', tools.getBoundingClientRect().top <= 0.5 && window.scrollY > 0);
    window.removeEventListener('scroll', render.onScroll || (() => {})); render.onScroll = onScroll; window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
  }
  $app.querySelectorAll('tr.pka-p').forEach(tr => tr.addEventListener('click', () => { S.open = S.open === tr.dataset.id ? '' : tr.dataset.id; render(); }));
}

document.title = 'Hasil Tes Pandangan Kerja · HK Gold';
render();
if (S.session) load();
// segarkan otomatis saat workshop berlangsung (hanya kalau tab sedang dibuka)
setInterval(() => { if (S.session && S.rows && !document.hidden && !S.loading) load(); }, 30000);
}

</script>
</body>
